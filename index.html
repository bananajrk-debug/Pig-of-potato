<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活ゲーム - 借金返済編</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 800px;
            height: 600px;
            background-color: #2b2b2b;
            border: 4px solid #444;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .active {
            display: flex;
            flex-direction: column;
        }

        /* --- タイトル画面 --- */
        #title-screen {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111, #333);
            text-align: center;
        }
        #title-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f39c12;
            text-shadow: 2px 2px 4px #000;
        }
        #title-screen p {
            color: #aaa;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
        }
        .btn {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2ec4b6;
        }
        .btn-secondary {
            background-color: #2980b9;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #3498db;
        }
        .btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        /* --- ゲーム画面 --- */
        #game-screen {
            position: relative;
            background-color: #3a3a3a;
            overflow: hidden;
        }

        .status-bar {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .status-item {
            font-size: 1rem;
            font-weight: bold;
        }
        .status-value {
            color: #f1c40f;
        }
        .debt-value {
            color: #e74c3c;
        }

        /* 【変更】広くなったマップビューポート（カメラ表示枠） */
        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #555;
        }

        /* 【変更】実際の広いワールドマップ (1600 x 1200) */
        #world {
            position: absolute;
            width: 1600px;
            height: 1200px;
            background: #4a4a4a;
        }

        .road-line {
            position: absolute;
            top: 600px;
            left: 0;
            right: 0;
            height: 6px;
            border-top: 6px dashed #777;
        }

        .cardboard-bed {
            position: absolute;
            left: 100px;
            top: 700px;
            width: 100px;
            height: 70px;
            background: #d35400;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            color: #f39c12;
            font-weight: bold;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.4);
        }

        .shop-building {
            position: absolute;
            left: 1350px;
            top: 200px;
            width: 140px;
            height: 90px;
            background-color: #27ae60;
            border: 3px solid #2ecc71;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: #fff;
            font-weight: bold;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.4);
        }

        #player {
            position: absolute;
            width: 32px;
            height: 32px;
            background-color: #3498db;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .trash {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: #7f8c8d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .controls-hint {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
            z-index: 20;
        }

        /* 近くにゴミがある時のガイド表示 */
        #interaction-prompt {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #f39c12;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #f39c12;
            font-weight: bold;
            z-index: 20;
            display: none;
        }

        #backpack-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background-color: rgba(20, 20, 20, 0.95);
            border: 3px solid #f39c12;
            border-radius: 10px;
            padding: 20px;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        #backpack-modal h2 {
            font-size: 1.2rem;
            color: #f39c12;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .close-hint {
            margin-top: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
        }

        .action-panel {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="screen active">
        <h1>どん底スタート生活</h1>
        <p>ゴミを拾い、借金を返し、自分の家を手に入れろ！</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="startNewGame()">生活を始める</button>
            <button id="continue-btn" class="btn btn-secondary" onclick="continueGame()">生活を続ける</button>
        </div>
    </div>

    <!-- 2. ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div class="status-bar">
            <div class="status-item">所持金: <span id="money-display" class="status-value">0</span> G</div>
            <div class="status-item">集めたゴミ: <span id="trash-display" class="status-value">0</span> 個</div>
            <div class="status-item">残りの借金: <span id="debt-display" class="debt-value">1,000,000</span> G</div>
        </div>

        <!-- カメラビューポートとワールドマップ -->
        <div class="viewport" id="viewport">
            <div class="controls-hint">移動: [WASD] | 拾う: [E] | バックパック: [Tab]</div>
            <div id="interaction-prompt">[E] キーでゴミを拾う</div>

            <div id="world">
                <div class="road-line"></div>
                <div class="cardboard-bed">My ダンボール</div>
                <div class="shop-building">
                    <span>🏠 買取店</span>
                    <span style="font-size: 0.65rem; color: #f1c40f; margin-top:2px;">ここで換金可能</span>
                </div>
                <!-- プレイヤー -->
                <div id="player"></div>
            </div>
        </div>

        <!-- バックパック画面 -->
        <div id="backpack-modal">
            <h2>🎒 バックパック (持ち物)</h2>
            <div class="inventory-item">
                <span>拾ったゴミ:</span>
                <span id="inv-trash-count" style="color: #f1c40f;">0 個</span>
            </div>
            <div class="close-hint">[Tab] キーを押して閉じる</div>
        </div>

        <div class="action-panel">
            <button class="action-btn btn-primary" onclick="sellTrashAtShop()">買取店でゴミを換金する (+100G/個)</button>
            <button class="action-btn btn-secondary" onclick="payDebt()">借金を1,000G返済する</button>
            <button class="action-btn" style="background:#e67e22; color:white;" onclick="saveAndExit()">セーブしてタイトルへ</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let playerData = {
            x: 150,
            y: 730,
            money: 0,
            trashCount: 0,
            debt: 1000000,
            hasSavedData: false
        };

        const keys = {};
        const speed = 4;
        let isBackpackOpen = false;
        let nearestTrash = null; // 現在Eキーで拾える一番近いゴミ

        window.onload = () => {
            checkSaveData();
            setupControls();
        };

        function checkSaveData() {
            const saved = localStorage.getItem('lifeGame_saveData');
            const continueBtn = document.getElementById('continue-btn');
            continueBtn.disabled = !saved;
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;

                if (e.key === 'Tab') {
                    e.preventDefault();
                    toggleBackpack();
                }

                // Eキーでゴミを拾う
                if (e.key === 'e' || e.key === 'E') {
                    if (nearestTrash && !isBackpackOpen) {
                        pickUpTrash(nearestTrash);
                    }
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });
        }

        function toggleBackpack() {
            isBackpackOpen = !isBackpackOpen;
            const modal = document.getElementById('backpack-modal');
            if (isBackpackOpen) {
                document.getElementById('inv-trash-count').textContent = playerData.trashCount + ' 個';
                modal.style.display = 'block';
            } else {
                modal.style.display = 'none';
            }
        }

        function startNewGame() {
            if (localStorage.getItem('lifeGame_saveData')) {
                if (!confirm("以前のセーブデータが上書きされます。よろしいですか？")) {
                    return;
                }
            }
            playerData = {
                x: 150,
                y: 730,
                money: 0,
                trashCount: 0,
                debt: 1000000,
                hasSavedData: true
            };
            saveData();
            switchToGame();
        }

        function continueGame() {
            const saved = localStorage.getItem('lifeGame_saveData');
            if (saved) {
                playerData = JSON.parse(saved);
                switchToGame();
            }
        }

        function switchToGame() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            updateUI();
            spawnTrashLoop();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!isBackpackOpen) {
                // 広くなったマップの端（1600x1200）で制限
                if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                    playerData.y = Math.max(10, playerData.y - speed);
                }
                if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                    playerData.y = Math.min(1160, playerData.y + speed);
                }
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                    playerData.x = Math.max(10, playerData.x - speed);
                }
                if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                    playerData.x = Math.min(1560, playerData.x + speed);
                }
            }

            // プレイヤー位置更新
            const playerEl = document.getElementById('player');
            playerEl.style.left = playerData.x + 'px';
            playerEl.style.top = playerData.y + 'px';

            // カメラ追従処理（プレイヤーが画面の中央に来るようにワールドを動かす）
            updateCamera();

            // 最も近いゴミを探す判定
            checkNearestTrash();

            if (document.getElementById('game-screen').classList.contains('active')) {
                requestAnimationFrame(gameLoop);
            }
        }

        function updateCamera() {
            const viewport = document.getElementById('viewport');
            const world = document.getElementById('world');
            
            const vpWidth = viewport.clientWidth;
            const vpHeight = viewport.clientHeight;

            // プレイヤーを中心にスクロール計算
            let camX = playerData.x - vpWidth / 2 + 16;
            let camY = playerData.y - vpHeight / 2 + 16;

            // マップの端を超えないように制限
            camX = Math.max(0, Math.min(1600 - vpWidth, camX));
            camY = Math.max(0, Math.min(1200 - vpHeight, camY));

            world.style.transform = `translate(${-camX}px, ${-camY}px)`;
        }

        function checkNearestTrash() {
            const trashes = document.getElementsByClassName('trash');
            const playerSize = 32;
            let minDistance = 50; // 50px以内に近づいたらEキーが有効
            let found = null;

            for (let trash of Array.from(trashes)) {
                const tx = parseInt(trash.style.left);
                const ty = parseInt(trash.style.top);

                const dx = (playerData.x + playerSize / 2) - (tx + 14);
                const dy = (playerData.y + playerSize / 2) - (ty + 14);
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < minDistance) {
                    minDistance = distance;
                    found = trash;
                }
            }

            nearestTrash = found;
            const prompt = document.getElementById('interaction-prompt');
            if (nearestTrash) {
                prompt.style.display = 'block';
            } else {
                prompt.style.display = 'none';
            }
        }

        function pickUpTrash(trashElement) {
            playerData.trashCount += 1;
            updateUI();
            trashElement.remove();
            nearestTrash = null;
            document.getElementById('interaction-prompt').style.display = 'none';
        }

        function updateUI() {
            document.getElementById('money-display').textContent = playerData.money.toLocaleString();
            document.getElementById('trash-display').textContent = playerData.trashCount;
            document.getElementById('debt-display').textContent = playerData.debt.toLocaleString();
            if (isBackpackOpen) {
                document.getElementById('inv-trash-count').textContent = playerData.trashCount + ' 個';
            }
        }

        function spawnTrashLoop() {
            setInterval(() => {
                const world = document.getElementById('world');
                const currentTrashes = world.getElementsByClassName('trash').length;
                if (currentTrashes < 25) { // 広いマップに合わせて最大数増加
                    spawnTrash();
                }
            }, 1500);
        }

        function spawnTrash() {
            const world = document.getElementById('world');
            const trash = document.createElement('div');
            trash.className = 'trash';
            trash.textContent = '🗑️';

            // 広いマップ（1600x1200）全体にランダム配置
            const x = Math.floor(Math.random() * 1500) + 50;
            const y = Math.floor(Math.random() * 1100) + 50;

            trash.style.left = x + 'px';
            trash.style.top = y + 'px';

            world.appendChild(trash);
        }

        function sellTrashAtShop() {
            // 買取店の位置付近判定 (x: 1350~1490, y: 200~290)
            const isInShopArea = (playerData.x >= 1330 && playerData.x <= 1510 && playerData.y >= 180 && playerData.y <= 310);

            if (!isInShopArea) {
                alert("📍 マップ右上にある「買取店」の建物付近まで移動しないと換金できません！");
                return;
            }

            if (playerData.trashCount > 0) {
                playerData.money += playerData.trashCount * 100;
                playerData.trashCount = 0;
                updateUI();
                alert("💰 ゴミを買い取ってもらいました！");
            } else {
                alert("換金するゴミを持っていません！");
            }
        }

        function payDebt() {
            const payAmount = 1000;
            if (playerData.money >= payAmount) {
                if (playerData.debt > 0) {
                    playerData.money -= payAmount;
                    playerData.debt = Math.max(0, playerData.debt - payAmount);
                    updateUI();

                    if (playerData.debt === 0) {
                        alert("🎉 借金をすべて完済しました！家を購入する準備が整えました！");
                    }
                } else {
                    alert("すでに借金は完済しています！");
                }
            } else {
                alert("返済用の資金（1,000G）が足りません。");
            }
        }

        function saveData() {
            localStorage.setItem('lifeGame_saveData', JSON.stringify(playerData));
            checkSaveData();
        }

        function saveAndExit() {
            saveData();
            alert("位置情報とデータをセーブしました。");
            location.reload();
        }
    </script>
</body>
</html>
