<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLY-VALO (3D FPS)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>POLY-VALO</h2>
        <p>クリックしてゲームを開始</p>
        <p>[WASD] 移動 | [マウス] 視点移動 | [クリック] 射撃</p>
    </div>
    <div id="crosshair">+</div>

    <!-- Three.js と Socket.io のCDN読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let scene, camera, renderer;
        const otherPlayers = {};

        // 入力状態
        const keys = { forward: false, backward: false, left: false, right: false };
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        // マウス視点用の角度
        let pitch = 0;
        let yaw = 0;

        const instructions = document.getElementById('instructions');
        const crosshair = document.getElementById('crosshair');

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
                crosshair.style.display = 'block';
            } else {
                instructions.style.display = 'block';
                crosshair.style.display = 'none';
            }
        });

        // 初期化
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // ライト
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 床 (マップ)
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x22223b });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 適当な障害物（Valorantの箱をイメージ）
            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x4a4e69 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(0, 1.5, -10);
            scene.add(box);

            // イベントリスナー
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onShoot);

            window.addEventListener('resize', onWindowResize);

            // Socket.ioイベント
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) {
                        addOtherPlayer(id, players[id]);
                    }
                });
            });

            socket.on('newPlayer', (data) => {
                addOtherPlayer(data.id, data.player);
            });

            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].position.set(data.player.x, data.player.y, data.player.z);
                    otherPlayers[data.id].rotation.y = data.player.rotationY;
                }
            });

            socket.on('disconnectPlayer', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            });
        }

        function addOtherPlayer(id, playerData) {
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xe63946 });
            const playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.set(playerData.x, playerData.y, playerData.z);
            scene.add(playerMesh);
            otherPlayers[id] = playerMesh;
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement !== document.body) return;

            const movementX = e.movementX || e.mozMovementX || 0;
            const movementY = e.movementY || e.mozMovementY || 0;

            yaw -= movementX * 0.002;
            pitch -= movementY * 0.002;

            // 上下視点の制限
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function onShoot() {
            if (document.pointerLockElement !== document.body) return;
            // 簡易的な弾丸発射エフェクトやイベント送信
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            socket.emit('shoot', { origin: camera.position, direction: direction });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 移動処理
        function updatePlayerPosition(delta) {
            const speed = 5.0 * delta;
            const direction = new THREE.Vector3();

            if (moveForward) direction.z -= 1;
            if (moveBackward) direction.z += 1;
            if (moveLeft) direction.x -= 1;
            if (moveRight) direction.x += 1;

            direction.normalize();
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.addScaledVector(direction, speed);
            camera.position.y = 1.6; // 目の高さ固定

            // サーバーに位置を送信
            socket.emit('playerMovement', {
                x: camera.position.x,
                y: camera.position.y,
                z: camera.position.z,
                rotationY: yaw
            });
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updatePlayerPosition(delta);
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
