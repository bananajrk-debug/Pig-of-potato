<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>パチットモンスター 〜風林火山〜</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1a; --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1); --line:rgba(255,255,255,.13);
  --text:#eef1ff; --mute:#9aa3c7; --accent:#ff3d6e; --accent2:#ffd166; --good:#3ee089; --bad:#ff4d6d; --blue:#4dc3ff;
  --N:#a7b0d4; --R:#4dc3ff; --SR:#c77dff; --SSR:#ffd166;
  --g:#ff4d6d; --c:#4dc3ff; --p:#3ee089;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'M PLUS Rounded 1c',system-ui,-apple-system,sans-serif;color:var(--text);
  background:
    radial-gradient(1000px 520px at 50% -12%,#3a1a5c 0%,transparent 62%),
    radial-gradient(800px 480px at 110% 110%,#0f3a5a 0%,transparent 60%),
    radial-gradient(600px 400px at -10% 80%,#4a1030 0%,transparent 60%),
    var(--bg);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:disabled{cursor:not-allowed}
.screen{display:none;min-height:100vh;width:100%;max-width:680px;margin:0 auto;padding:16px 14px 22px;flex-direction:column;gap:12px}
.screen.active{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 共通 ---------- */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.05em;
  background:var(--panel2);border:1px solid var(--line);transition:transform .12s,filter .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff3d6e,#ff8a3d);border:none;box-shadow:0 8px 24px rgba(255,61,110,.35)}
.btn.gold{background:linear-gradient(135deg,#ffb703,#ffd166 50%,#ff9e00);color:#2a1800;border:none;box-shadow:0 8px 24px rgba(255,183,3,.35)}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.mini{padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px}
.h2{font-family:'Dela Gothic One',sans-serif;font-size:22px;letter-spacing:.06em;text-align:center}
.sub{color:var(--mute);font-size:13px;text-align:center;line-height:1.6}
.rb{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#0b0d1a;vertical-align:middle}
.rb.r-N{background:var(--N)} .rb.r-R{background:var(--R)} .rb.r-SR{background:var(--SR)}
.rb.r-SSR{background:linear-gradient(90deg,#ffd166,#fff3c4,#ffb703);box-shadow:0 0 10px rgba(255,209,102,.7)}
.elb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(255,255,255,.14);vertical-align:middle}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-bottom-width:3px;font-family:inherit;font-weight:800;font-size:12px;text-align:center}

/* ---------- タイトル ---------- */
#title{justify-content:center;align-items:center;text-align:center;gap:18px}
.logo-kanji{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.logo-kanji span{font-family:'Dela Gothic One',sans-serif;width:52px;height:52px;display:grid;place-items:center;font-size:28px;border-radius:12px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--line);animation:float 3s ease-in-out infinite}
.logo-kanji span:nth-child(1){color:#7cf7ff}
.logo-kanji span:nth-child(2){color:#b6f26b;animation-delay:.2s}
.logo-kanji span:nth-child(3){color:#ff8a3d;animation-delay:.4s}
.logo-kanji span:nth-child(4){color:#e0c08a;animation-delay:.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo{font-family:'Dela Gothic One',sans-serif;font-size:clamp(34px,10vw,58px);line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#ffd166 55%,#ff3d6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(255,61,110,.45))}
.logo small{display:block;font-size:.36em;letter-spacing:.3em;margin-top:8px}
.title-mons{font-size:34px;letter-spacing:6px}
.title-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.flow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12px;font-weight:800}
.flow span{padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.flow i{font-style:normal;color:var(--mute);align-self:center}

/* ---------- 探索フェーズ ---------- */
#explore{position:fixed;inset:0;max-width:none;padding:0;touch-action:none;overflow:hidden;background:#2f7a33}
#explore.active{animation:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.hbox{pointer-events:auto;background:rgba(10,12,28,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.hl{display:flex;flex-direction:column;gap:6px;min-width:150px}
.timer{font-family:'Dela Gothic One',sans-serif;font-size:28px;letter-spacing:.06em;line-height:1}
.timer.warn{color:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{filter:brightness(1.5)}}
.timer small{font-family:'M PLUS Rounded 1c';font-size:10px;color:var(--mute);display:block;letter-spacing:.1em;margin-bottom:3px}
.php{height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.php i{display:block;height:100%;background:linear-gradient(90deg,#2bd47d,#7cf7a0);transition:width .2s}
.php i.lo{background:linear-gradient(90deg,#ff2d55,#ff6b6b)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.inv{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px}
.inv span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.inv .ball{width:16px;height:16px;border-radius:50%;background:linear-gradient(180deg,#ff3d6e 0 46%,#222 46% 54%,#fff 54%);display:inline-block;border:1.5px solid #222}
.hbtns{display:flex;gap:6px}
#mini{width:150px;height:113px;border-radius:12px;border:1px solid var(--line);background:rgba(10,30,12,.7);pointer-events:none}
.toasts{position:absolute;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;width:92%;max-width:440px}
.toast{padding:8px 14px;border-radius:12px;background:rgba(10,12,28,.85);border:1px solid var(--line);font-size:13px;font-weight:700;text-align:center;animation:toastIn .3s ease;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.toast.get{border-color:var(--accent2);background:linear-gradient(90deg,rgba(255,209,102,.25),rgba(10,12,28,.9))}
.toast.ssr{border-color:var(--SSR);box-shadow:0 0 18px rgba(255,209,102,.6)}
.toast.warn{border-color:var(--bad)}
.toast.item{border-color:var(--blue)}
.toast.out{animation:toastOut .35s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
.joy{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;
  background:rgba(10,12,28,.35);border:2px solid rgba(255,255,255,.22);z-index:5;display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6)}
body.touch .joy{display:block}
.acts{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;z-index:5}
.abtn{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11px;
  border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 20px rgba(0,0,0,.35);touch-action:none}
.abtn b{font-size:26px;line-height:1}
.abtn.k{background:linear-gradient(145deg,#ff3d6e,#a3123e)}
.abtn.o{background:linear-gradient(145deg,#4dc3ff,#1f6bff);width:66px;height:66px;margin-bottom:34px}
.abtn:active{transform:scale(.92)}
.keyhelp{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;
  background:rgba(10,12,28,.6);border:1px solid var(--line);white-space:nowrap;pointer-events:none}
body.touch .keyhelp{display:none}
.bigmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(5,6,14,.55);pointer-events:none}
.bigmsg.show{display:flex}
.bigmsg div{font-family:'Dela Gothic One',sans-serif;font-size:clamp(40px,12vw,84px);color:#fff;text-shadow:0 0 30px rgba(255,61,110,.8),0 6px 0 #a3123e;animation:pop .5s ease}
@media(max-width:560px){
  .timer{font-size:22px} .hl{min-width:120px} .inv{font-size:12px;gap:7px} #mini{width:112px;height:84px}
  .toasts{top:calc(130px + env(safe-area-inset-top))}
}

/* ---------- カード ---------- */
.ava{width:64px;height:64px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),linear-gradient(145deg,var(--c1),var(--c2));
  box-shadow:0 0 18px color-mix(in srgb,var(--c1) 60%,transparent)}
.card{border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1.5px solid var(--line);text-align:left}
.card.r-SSR{border-color:var(--SSR);box-shadow:0 0 28px rgba(255,209,102,.35)}
.card.r-SR{border-color:var(--SR);box-shadow:0 0 20px rgba(199,125,255,.25)}
.card.r-R{border-color:var(--R)}
.card-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.card-top h3{font-size:20px;margin-top:3px}
.card-top .ttl{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:10px}
.st{display:flex;align-items:center;gap:6px;font-size:11px}
.st span{width:28px;color:var(--mute)}
.st .sb{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.st .sb i{display:block;height:100%;background:linear-gradient(90deg,#4dc3ff,#c77dff)}
.st b{width:26px;text-align:right}
.pas{font-size:12px;line-height:1.55;padding:8px 10px;border-radius:10px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.25);margin-bottom:8px}
.pas b{color:var(--accent2);margin-right:4px}
.mlist{display:flex;flex-direction:column;gap:5px}
.mi{display:grid;grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;padding:6px 9px;border-radius:10px;
  background:rgba(255,255,255,.05);border-left:4px solid var(--hc)}
.mi span{grid-row:1/3;font-size:22px;text-align:center}
.mi b{font-size:13px} .mi i{font-style:normal;font-size:11px;color:var(--mute)}
.mi small{grid-column:2/4;font-size:11px;color:var(--mute)}
.h-g{--hc:var(--g)} .h-c{--hc:var(--c)} .h-p{--hc:var(--p)}
.mc{flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.mc .ava{width:52px;height:52px;font-size:28px}
.mc .info{flex:1;min-width:0}
.mc .nm{font-weight:800;font-size:16px;margin:2px 0}
.mc .hs{font-size:18px;letter-spacing:2px}
.mc .ps{font-size:11px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enemyrow{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.enemyrow .mc{padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* ---------- 選択フェーズ ---------- */
#select{padding-bottom:0}
.selhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seltimer{font-family:'Dela Gothic One',sans-serif;font-size:30px;color:var(--accent2);min-width:84px;text-align:right}
.seltimer.warn{color:var(--bad);animation:pulse .6s infinite}
.seltimer small{font-size:14px;margin-left:2px}
.tbar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff3d6e);transition:width .1s linear}
.selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:8px}
.selc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;border-radius:16px;background:var(--panel);border:2px solid var(--line);text-align:center;transition:.15s;cursor:pointer}
.selc.r-SSR{border-color:rgba(255,209,102,.6)} .selc.r-SR{border-color:rgba(199,125,255,.55)} .selc.r-R{border-color:rgba(77,195,255,.45)}
.selc .ava{width:56px;height:56px;font-size:30px}
.selc .nm{font-weight:800;font-size:15px}
.selc .hs{font-size:17px;letter-spacing:2px}
.selc .ps{font-size:10.5px;color:var(--accent2);line-height:1.35}
.selc .ss{font-size:10px;color:var(--mute)}
.selc.on{border-color:var(--accent2);background:rgba(255,209,102,.13);box-shadow:0 0 0 3px rgba(255,209,102,.25);transform:translateY(-2px)}
.selc .num{position:absolute;top:-8px;left:-6px;padding:3px 8px;border-radius:10px;background:linear-gradient(135deg,#ff3d6e,#ff8a3d);font-size:12px;font-weight:800;display:none}
.selc.on .num{display:block}
.selc .ibtn{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:12px}
.selfoot{position:sticky;bottom:0;margin:0 -14px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,13,26,.4),rgba(11,13,26,.96) 30%);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
.selslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sslot{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;background:var(--panel);border:1.5px dashed var(--line);font-size:12px;min-height:46px}
.sslot.f{border-style:solid;border-color:var(--accent2)}
.sslot .ava{width:32px;height:32px;font-size:18px}
.sslot em{font-style:normal;font-size:10px;color:var(--accent2);font-weight:800}
.selinv{font-size:12px;color:var(--mute);text-align:center}
.selinv b{color:var(--text)}

/* ---------- バトル ---------- */
#battle{gap:8px;padding-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.topbar #turnLabel{font-family:'Dela Gothic One',sans-serif;font-size:16px;letter-spacing:.12em;color:var(--accent2)}
.topbar div{display:flex;gap:6px}
.unitbar{padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.unitbar.enemy{border-color:rgba(255,77,109,.35)} .unitbar.player{border-color:rgba(77,195,255,.35)}
.ub-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ub-head .who{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.08em}
.enemy .who{background:var(--bad)} .player .who{background:var(--blue);color:#06202e}
.ub-head b{font-size:16px}
.bench{margin-left:auto;display:flex;gap:4px}
.bdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.bdot.cur{border-color:var(--accent2);box-shadow:0 0 8px rgba(255,209,102,.5)}
.bdot.dead{filter:grayscale(1);opacity:.35}
.hpwrap{position:relative;height:14px;border-radius:7px;background:rgba(0,0,0,.4);margin:7px 0 5px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.hp{height:100%;border-radius:7px;transition:width .45s ease,background .3s}
.hp.hi{background:linear-gradient(90deg,#2bd47d,#7cf7a0)}
.hp.mid{background:linear-gradient(90deg,#ffb703,#ffd166)}
.hp.lo{background:linear-gradient(90deg,#ff2d55,#ff6b6b);animation:pulse 1s infinite}
.hpwrap span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.badges{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.bd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.1)}
.st-poison{background:#7b2cbf} .st-burn{background:#e85d04} .st-para{background:#d4a300;color:#1c1400} .st-conf{background:#d63384}
.bd.up{background:rgba(62,224,137,.25);color:#7cf7a0} .bd.down{background:rgba(255,77,109,.25);color:#ff9aa8}
.bd.it{background:rgba(255,209,102,.2);color:var(--accent2)}
.pline{font-size:11px;color:var(--accent2);margin-top:3px}
.emoves{display:flex;gap:5px;margin-top:6px}
.echip{flex:1;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:9px;font-size:11px;background:rgba(255,255,255,.06);border-left:3px solid var(--hc);min-width:0}
.echip span{font-size:15px}
.echip em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.echip.locked{opacity:.35;text-decoration:line-through}
.arena{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 4px;min-height:150px;border-radius:20px;
  background:radial-gradient(ellipse at 50% 120%,rgba(62,224,137,.18),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.07));
  border:1px solid var(--line);overflow:hidden}
.arena::before{content:"";position:absolute;left:0;right:0;bottom:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.sprite{position:relative;display:flex;justify-content:center;cursor:pointer}
.sp-body{display:flex;flex-direction:column;align-items:center;gap:4px}
.orb{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 42%),linear-gradient(145deg,var(--c1),var(--c2));
  box-shadow:0 0 30px color-mix(in srgb,var(--c1) 70%,transparent),inset 0 -8px 16px rgba(0,0,0,.25);animation:idle 2.4s ease-in-out infinite}
.sprite.e .orb{animation-delay:.6s}
.sprite.e .orb span{display:inline-block;transform:scaleX(-1)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sp-name{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.4)}
.sprite.shake .orb{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px);filter:brightness(2.2)}40%{transform:translateX(8px)}60%{transform:translateX(-5px);filter:brightness(1.6)}80%{transform:translateX(3px)}}
.sprite.p.lunge .orb{animation:lungeR .35s}
.sprite.e.lunge .orb{animation:lungeL .35s}
@keyframes lungeR{50%{transform:translateX(28px) scale(1.12)}}
@keyframes lungeL{50%{transform:translateX(-28px) scale(1.12)}}
.sprite.faint .orb{animation:faint .7s forwards}

<script>
'use strict';
/* =========================================================
   基本ユーティリティ
========================================================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const HAND = { g: { e: '👊', n: 'グー' }, c: { e: '✌️', n: 'チョキ' }, p: { e: '✋', n: 'パー' } };
const RAR_RANK = { N: 0, R: 1, SR: 2, SSR: 3 };
const RAR_COL = { N: '#a7b0d4', R: '#4dc3ff', SR: '#c77dff', SSR: '#ffd166' };
const POS = ['先鋒', '中堅', '大将'];

// サーバーから受け取るゲームデータ
let CHARS = [], CHAR_MAP = {}, ITEMS = {}, STATUS = {}, WORLD = { w: 3200, h: 2400 };

const S = {
  phase: 'title', me: null, name: '', code: '', lobby: null, connected: false,
  inv: { balls: 0, items: { power: 0, guard: 0, heal: 0 }, party: [] },
  players: new Map(), speed: 1
};

function show(id) {
  S.phase = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

/* =========================================================
   モーダル・トースト
========================================================= */
let modalResolve = null;
function modal(html, closable = true) {
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(null); }
  return new Promise(resolve => {
    const m = $('#modal');
    $('#modalBody').innerHTML = html;
    m.classList.add('open');
    $('#modalBody').scrollTop = 0;
    modalResolve = resolve;
    m.onclick = e => {
      const t = e.target.closest('[data-v]');
      if (t) closeModal(t.dataset.v);
      else if (closable && e.target === m) closeModal(null);
    };
  });
}
function closeModal(v = null) {
  const m = $('#modal');
  m.classList.remove('open');
  m.onclick = null;
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(v); }
}
const modalOpen = () => $('#modal').classList.contains('open');

function toast(text, cls = '') {
  const box = $('#toasts');
  const d = document.createElement('div');
  d.className = 'toast ' + cls;
  d.textContent = text;
  box.appendChild(d);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 360); }, 2800);
}

function rulesHTML() {

    <h3>② 探索フェーズ（5分）</h3>
    <ul>
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>（矢印キーも可）で移動。スマホは左下のスティック。</li>

    </ul>

    <p>集めた仲間から3体を選択（タップ順に 先鋒→中堅→大将）。時間切れは自動補完。仲間が3体未満なら野良パチモンが加勢します。</p>

      <li>技は 👊/✌️/✋ の手を持つ。<b>勝った側だけ</b>がダメージ。<b>あいこ</b>はお互い威力半分（素早い方が先）。</li>

    <button class="btn primary" data-v="ok">わかった！</button>
  </div>`;
}

/* ----- 入室 ----- */
try { $('#nameIn').value = localStorage.getItem('pachit_name') || ''; } catch (e) { /* noop */ }
$('#codeIn').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5); });
$('#randBtn').addEventListener('click', () => { $('#codeIn').value = String(Math.floor(Math.random() * 100000)).padStart(5, '0'); });

$('#joinBtn').addEventListener('click', joinRoom);

function joinRoom() {
  const name = $('#nameIn').value.trim().slice(0, 10) || ('プレイヤー' + Math.floor(Math.random() * 90 + 10));
  const code = $('#codeIn').value.trim();
  $('#joinErr').textContent = '';

    $('#joinBtn').disabled = false;

/* =========================================================
   探索フェーズ
========================================================= */
const EX = {
  running: false, ending: false, raf: 0, last: 0, t: 0,
  obs: [], chests: [], decor: [], parts: [], pops: [],
  me: null, others: new Map(), mons: new Map(), balls: [],
  leftEnd: 0, sendT: 0, zoom: 1, cam: { x: 0, y: 0 }, hudT: 0, miniT: 0
};
const keys = {};
const joy = { active: false, x: 0, y: 0, id: null };
const cv = $('#cv'), ctx = cv.getContext('2d');
const mini = $('#mini'), mctx = mini.getContext('2d');
let DPR = 1;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.floor(cv.clientWidth * DPR));
  cv.height = Math.max(1, Math.floor(cv.clientHeight * DPR));
  EX.zoom = Math.min(cv.clientWidth, cv.clientHeight) < 600 ? 0.78 : 1;
}
window.addEventListener('resize', () => { if (S.phase === 'explore') resizeCanvas(); });

socket.on('gameStart', d => {
  closeModal();
  clearInterval(SEL.timer);
  startExplore(d);
});

function startExplore(d) {
  WORLD = d.world;
  EX.obs = d.obs;
  EX.chests = d.chests.map(c => ({ ...c }));
  EX.decor = [];
  const flowerCols = ['#ffd166', '#ff8fab', '#ffffff', '#c77dff', '#7cf7ff'];
  for (let i = 0; i < 1300; i++) {
    EX.decor.push({ x: rnd(0, WORLD.w), y: rnd(0, WORLD.h), t: Math.random() < .72 ? 0 : 1, c: flowerCols[i % flowerCols.length], s: rnd(.7, 1.3) });
  }
  EX.me = { x: d.you.x, y: d.you.y, dir: { x: 0, y: 1 }, spd: 200, hp: 100, inv: 0, stun: 0, swing: 0, cd: 0, walk: 0, noHit: 0, swingDir: 0 };
  EX.others = new Map(); EX.mons = new Map(); EX.balls = []; EX.parts = []; EX.pops = [];
  for (const p of d.players) S.players.set(p.id, p);
  EX.leftEnd = Date.now() + d.left;
  EX.t = 0; EX.ending = false; EX.sendT = 0; EX.miniT = 0;
  for (const k in keys) keys[k] = false;
  $('#bigMsg').classList.remove('show');
  $('#toasts').innerHTML = '';
  show('explore');
  resizeCanvas();
  EX.running = true;
  EX.last = performance.now();
  cancelAnimationFrame(EX.raf);
  EX.raf = requestAnimationFrame(loop);
  updateHud();
  toast(`🌿 探索開始！ 5分間でパチモンを集めよう（${d.players.length}人参加）`, 'get');
}
function stopExplore() {
  EX.running = false;
  cancelAnimationFrame(EX.raf);
}

/* ----- サーバーからの更新 ----- */
socket.on('snap', d => {
  if (!EX.running) return;
  EX.leftEnd = Date.now() + d.left;
  const seen = new Set();
  for (const [id, x, y, dx, dy, sw, stun] of d.pl) {
    if (id === S.me) continue;
    seen.add(id);
    let o = EX.others.get(id);
    if (!o) { o = { x, y, tx: x, ty: y, dir: { x: 0, y: 1 }, sw, swing: 0, swingDir: 0, stun: 0, walk: 0 }; EX.others.set(id, o); }
    if (Math.hypot(o.tx - x, o.ty - y) > 0.5) o.walk += .6;
    o.tx = x; o.ty = y;
    const l = Math.hypot(dx, dy);
    if (l > 1) o.dir = { x: dx / l, y: dy / l };
    if (sw !== o.sw) { o.sw = sw; o.swing = .22; o.swingDir = Math.atan2(o.dir.y, o.dir.x); }
    o.stun = stun;
  }
  for (const id of [...EX.others.keys()]) if (!seen.has(id)) EX.others.delete(id);
  const ms = new Set();
  for (const [i, cid, x, y, hp, mh, st, ag, capT] of d.m) {
    ms.add(i);
    let m = EX.mons.get(i);
    if (!m) { m = { i, c: CHAR_MAP[cid], x, y, tx: x, ty: y, flash: 0, bob: Math.random() * 10 }; EX.mons.set(i, m); }
    m.tx = x; m.ty = y; m.hp = hp; m.mh = mh; m.st = st; m.ag = ag; m.capT = capT / 10;
  }
  for (const i of [...EX.mons.keys()]) if (!ms.has(i)) EX.mons.delete(i);
  EX.balls = d.b;
});
socket.on('fx', list => {
  if (!EX.running) return;
  for (const f of list) {
    if (f.k === 'pop') addPop(f.x, f.y, f.s, f.col, f.z);
    else if (f.k === 'burst') burst(f.x, f.y, f.col, f.n, f.sp);
    else if (f.k === 'flash') { const m = EX.mons.get(f.i); if (m) m.flash = .15; }
  }
});
socket.on('chest', d => { const c = EX.chests.find(x => x.id === d.id); if (c) c.open = true; });
socket.on('inv', d => {
  S.inv = d;
  if (EX.running) updateHud();
});
socket.on('hurt', d => {
  const p = EX.me;
  if (!EX.running || !p || p.inv > 0 || p.stun > 0) return;
  p.hp = Math.max(0, p.hp - d.d);
  p.inv = 1; p.noHit = 0;
  const dx = p.x - d.x, dy = p.y - d.y, l = Math.hypot(dx, dy) || 1;
  p.x += dx / l * 26; p.y += dy / l * 26;
  addPop(p.x, p.y - 30, '-' + d.d, '#ff4d6d', 18);
  if (p.hp <= 0) { p.stun = 3; toast('やられた！ 3秒間 気絶…', 'warn'); }
});
socket.on('exploreEnd', () => {
  if (!EX.running) return;
  EX.ending = true;
  EX.leftEnd = Date.now();
  updateHud();
  closeModal();
  $('#bigMsgTxt').textContent = 'TIME UP!';
  $('#bigMsg').classList.add('show');
});

function addPop(x, y, text, col = '#fff', size = 18) { EX.pops.push({ x, y, text, col, size, life: 1.1 }); }
function burst(x, y, col, n = 14, sp = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rnd(sp * .3, sp);
    EX.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.4, .8), max: .8, col, size: rnd(2, 5) });
  }
}

/* ----- 入力 ----- */
const MOVE_KEYS = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
window.addEventListener('keydown', e => {
  if (S.phase !== 'explore') return;
  if (MOVE_KEYS[e.code] || e.code === 'KeyK' || e.code === 'KeyO' || e.code === 'Space') e.preventDefault();
  if (e.code === 'Escape') { if (!modalOpen()) openMenu(); return; }
  if (modalOpen()) return;
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyK') actionK();
  if (e.code === 'KeyO') actionO();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function getMove() {
  if (modalOpen()) return { x: 0, y: 0, l: 0 };
  let x = 0, y = 0;
  for (const k in MOVE_KEYS) if (keys[k]) { x += MOVE_KEYS[k][0]; y += MOVE_KEYS[k][1]; }
  if (joy.active) { x += joy.x; y += joy.y; }
  const l = Math.hypot(x, y);
  if (l > 1) { x /= l; y /= l; }
  return { x, y, l: Math.min(1, l) };
}

if ('ontouchstart' in window || (window.matchMedia && matchMedia('(pointer:coarse)').matches)) document.body.classList.add('touch');
(() => {
  const base = $('#joy'), knob = $('#joyKnob');
  const R = 50;
  const upd = e => {
    const r = base.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const l = Math.hypot(dx, dy);
    if (l > R) { dx = dx / l * R; dy = dy / l * R; }
    joy.x = dx / R; joy.y = dy / R;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  base.addEventListener('pointerdown', e => { joy.active = true; joy.id = e.pointerId; try { base.setPointerCapture(e.pointerId); } catch (er) { /* noop */ } upd(e); e.preventDefault(); });
  base.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) upd(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.active = false; joy.x = joy.y = 0; knob.style.transform = ''; };
  base.addEventListener('pointerup', end);
  base.addEventListener('pointercancel', end);
})();
$('#btnK').addEventListener('pointerdown', e => { e.preventDefault(); if (!modalOpen()) actionK(); });
$('#btnO').addEventListener('pointerdown', e => { e.preventDefault(); if (!modalOpen()) actionO(); });
$('#menuBtn').addEventListener('click', () => openMenu());

/* ----- アクション ----- */
function nearChest(p) {
  let best = null, bd = 64;
  for (const c of EX.chests) {
    if (c.open) continue;
    const d = Math.hypot(p.x - c.x, p.y - (c.y - 10));
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
const canAction = () => EX.running && !EX.ending && EX.me && EX.me.stun <= 0;

function actionK() {
  if (!canAction()) return;
  const p = EX.me;
  const ch = nearChest(p);
  if (ch) { if (p.cd <= 0) { socket.emit('chest', { id: ch.id }); p.cd = .3; } return; }
  if (p.cd > 0) return;
  p.cd = .38; p.swing = .22; p.swingDir = Math.atan2(p.dir.y, p.dir.x);
  socket.emit('sword', { x: p.x, y: p.y, dx: p.dir.x, dy: p.dir.y });
}
function actionO() {
  if (!canAction()) return;
  const p = EX.me;
  const ch = nearChest(p);
  if (ch) { if (p.cd <= 0) { socket.emit('chest', { id: ch.id }); p.cd = .3; } return; }
  if (p.cd > 0) return;
  if (S.inv.balls <= 0) { toast('パチボールがない！ 宝箱を探そう', 'warn'); p.cd = .5; return; }
  let dir = { x: p.dir.x, y: p.dir.y }, bd = 340, best = null;
  for (const m of EX.mons.values()) {
    if (m.st === 2) continue;
    const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy) || 1;
    const dot = (dx * p.dir.x + dy * p.dir.y) / d;
    if (d < bd && (dot > .3 || d < 90)) { bd = d; best = m; }
  }
  if (best) { const dx = best.x - p.x, dy = best.y - p.y, d = Math.hypot(dx, dy) || 1; dir = { x: dx / d, y: dy / d }; }
  p.cd = .45;
  socket.emit('pos', { x: p.x, y: p.y, dx: p.dir.x, dy: p.dir.y, s: 0 });
  socket.emit('throw', { dx: dir.x, dy: dir.y });
}

async function openMenu() {
  if (!EX.running || EX.ending || modalOpen()) return;
  const party = S.inv.party || [];
  const list = party.length
    ? party.map(e => { const c = CHAR_MAP[e.id]; return `<div class="pi">${avaHTML(c)}<div><span class="rb r-${c.rar}">${c.rar}</span> <b>${c.name}</b><div style="font-size:12px">${c.moves.map(m => HAND[m.hand].e).join(' ')}</div></div></div>`; }).join('')
    : '<p class="sub">まだ仲間がいません</p>';
  const isHost = S.lobby && S.lobby.hostId === S.me;
  const v = await modal(`<h2 class="h2">☰ メニュー</h2>
    <p class="sub" style="margin-top:6px">※マルチプレイのため時間は止まりません</p>
    <p class="sub">仲間 ${party.length}体 / ボール ${S.inv.balls}個 / 🗡️${S.inv.items.power} 🛡️${S.inv.items.guard} 🍑${S.inv.items.heal}</p>
    <div class="plist">${list}</div>
    <button class="btn primary" data-v="back">探索に戻る</button>
    <button class="btn" data-v="rules">あそびかた</button>
    ${isHost ? '<button class="btn" data-v="end">（ホスト）全員の探索を終了する</button>' : ''}
    <button class="btn" data-v="leave">ルームから退出する</button>`);
  if (v === 'rules') modal(rulesHTML());
  else if (v === 'end') socket.emit('hostEndExplore');
  else if (v === 'leave') leaveToTitle();
}

/* ----- 更新 ----- */
function collide(e, r) {
  for (const o of EX.obs) {
    const rr = o.r * o.s * .8 + r;
    const dx = e.x - o.x, dy = e.y - o.y, d2 = dx * dx + dy * dy;
    if (d2 < rr * rr) { const d = Math.sqrt(d2) || 1; e.x = o.x + dx / d * rr; e.y = o.y + dy / d * rr; }
  }
  for (const c of EX.chests) {
    const rr = 16 + r, cy = c.y - 10;
    const dx = e.x - c.x, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < rr * rr) { const d = Math.sqrt(d2) || 1; e.x = c.x + dx / d * rr; e.y = cy + dy / d * rr; }
  }
  e.x = clamp(e.x, r, WORLD.w - r);
  e.y = clamp(e.y, r, WORLD.h - r);
}

function updateExplore(dt) {
  EX.t += dt;
  const p = EX.me;
  if (!EX.ending) {
    if (p.stun > 0) {
      p.stun -= dt;
      if (p.stun <= 0) { p.hp = 60; p.inv = 1.5; toast('目を覚ました！'); }
    } else {
      const mv = getMove();
      if (mv.l > .05) {
        const l = Math.hypot(mv.x, mv.y) || 1;
        p.dir = { x: mv.x / l, y: mv.y / l };
        p.x += mv.x * p.spd * dt; p.y += mv.y * p.spd * dt;
        p.walk += dt * 12;
      }
      p.noHit += dt;
      if (p.noHit > 3 && p.hp < 100) p.hp = Math.min(100, p.hp + 5 * dt);
    }
    collide(p, 15);
  }
  p.cd -= dt; p.swing = Math.max(0, p.swing - dt); p.inv = Math.max(0, p.inv - dt);

  // 位置送信（約15Hz）
  EX.sendT -= dt;
  if (EX.sendT <= 0 && !EX.ending) {
    EX.sendT = 1 / 15;
    socket.emit('pos', { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10, dx: p.dir.x, dy: p.dir.y, s: p.stun > 0 ? 1 : 0 });
  }

  // 補間
  const k = Math.min(1, dt * 12);
  for (const o of EX.others.values()) {
    o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k;
    o.swing = Math.max(0, o.swing - dt);
  }
  for (const m of EX.mons.values()) {
    if (Math.hypot(m.tx - m.x, m.ty - m.y) > 200) { m.x = m.tx; m.y = m.ty; }
    m.x += (m.tx - m.x) * k; m.y += (m.ty - m.y) * k;
    m.flash = Math.max(0, m.flash - dt); m.bob += dt;
    if (m.st === 2) m.capT = Math.max(0, m.capT - dt);
  }
  for (let i = EX.parts.length - 1; i >= 0; i--) {
    const q = EX.parts[i];
    q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .92; q.vy *= .92;
    if (q.life <= 0) EX.parts.splice(i, 1);
  }
  for (let i = EX.pops.length - 1; i >= 0; i--) {
    const q = EX.pops[i];
    q.life -= dt; q.y -= 32 * dt;
    if (q.life <= 0) EX.pops.splice(i, 1);
  }

  const vw = cv.clientWidth / EX.zoom, vh = cv.clientHeight / EX.zoom;
  EX.cam.x = clamp(p.x - vw / 2, 0, Math.max(0, WORLD.w - vw));
  EX.cam.y = clamp(p.y - vh / 2, 0, Math.max(0, WORLD.h - vh));

  EX.hudT -= dt;
  if (EX.hudT <= 0) { EX.hudT = .1; updateHud(); }
}

function updateHud() {
  if (!EX.me) return;
  const t = Math.max(0, Math.ceil((EX.leftEnd - Date.now()) / 1000));
  const el = $('#exTime');
  el.innerHTML = `<small>残り時間</small>${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  el.classList.toggle('warn', t <= 30);
  const hpEl = $('#exHp');
  hpEl.style.width = EX.me.hp + '%';
  hpEl.classList.toggle('lo', EX.me.hp < 35);
  $('#exBall').textContent = S.inv.balls;
  $('#exPow').textContent = S.inv.items.power;
  $('#exGrd').textContent = S.inv.items.guard;
  $('#exHeal').textContent = S.inv.items.heal;
  $('#exParty').textContent = (S.inv.party || []).length;
}

/* ----- 描画 ----- */
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function drawTree(o) {
  const s = o.s, x = o.x, y = o.y;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ell(x, y + 4 * s, 24 * s, 9 * s);
  ctx.fillStyle = '#6b4423'; ctx.fillRect(x - 5 * s, y - 16 * s, 10 * s, 20 * s);
  ctx.fillStyle = '#1d5e27'; circ(x, y - 30 * s, 26 * s);
  ctx.fillStyle = '#287a33'; circ(x - 9 * s, y - 37 * s, 18 * s);
  ctx.fillStyle = '#37a143'; circ(x + 8 * s, y - 42 * s, 13 * s);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; circ(x + 4 * s, y - 46 * s, 6 * s);
}
function drawRock(o) {
  const s = o.s, x = o.x, y = o.y;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ell(x, y + 6 * s, 22 * s, 8 * s);
  ctx.fillStyle = '#6f7684'; ell(x, y - 4 * s, 22 * s, 16 * s);
  ctx.fillStyle = '#8d95a4'; ell(x - 5 * s, y - 9 * s, 13 * s, 9 * s);
  ctx.fillStyle = '#aab2c0'; ell(x - 8 * s, y - 12 * s, 5 * s, 3 * s);
}
function drawChest(c) {
  const x = c.x, y = c.y;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ell(x, y + 2, 22, 7);
  if (!c.open) {
    ctx.fillStyle = `rgba(255,209,102,${.16 + .12 * Math.sin(EX.t * 4 + x)})`;
    circ(x, y - 12, c.gold ? 38 : 30);
  }
  const body = c.gold ? '#c9952c' : '#8b5a2b', lid = c.gold ? '#e8b440' : '#a0682f';
  ctx.fillStyle = body; rrect(x - 18, y - 22, 36, 22, 4); ctx.fill();
  if (c.open) {
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x - 16, y - 24, 32, 6);
    ctx.fillStyle = lid; rrect(x - 18, y - 40, 36, 12, 4); ctx.fill();
  } else {
    ctx.fillStyle = lid; rrect(x - 18, y - 32, 36, 13, 5); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillRect(x - 3, y - 32, 6, 32);
    ctx.fillStyle = '#fff3c4'; circ(x, y - 19, 3.5);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5;
  rrect(x - 18, y - 22, 36, 22, 4); ctx.stroke();
}
function drawBall(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#ffffff'; circ(0, 0, r);
  ctx.fillStyle = '#ff3d6e'; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(-r, -r * .14, r * 2, r * .28);
  ctx.fillStyle = '#fff'; circ(0, 0, r * .32);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawMon(m) {
  if (!m.c) return;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ell(m.x, m.y + 18, 17, 6);
  if (m.st === 2) {
    const k = 1.5 - m.capT;
    const wob = k > .35 && m.capT > .1 ? Math.sin(m.capT * 16) * .5 : 0;
    if (k < .35) { ctx.save(); ctx.globalAlpha = 1 - k / .35; drawMonBody(m, 1 - k / .35); ctx.restore(); }
    drawBall(m.x, m.y + 6, 13, wob);
    return;
  }
  drawMonBody(m, 1);
}
function drawMonBody(m, scale) {
  const c = m.c, x = m.x, y = m.y + Math.sin(m.bob * 5) * 2;
  const fainted = m.st === 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  if (fainted) { ctx.globalAlpha *= .7; ctx.rotate(.5); }
  if (c.rar === 'SR' || c.rar === 'SSR') {
    ctx.fillStyle = c.rar === 'SSR' ? `rgba(255,209,102,${.25 + .15 * Math.sin(EX.t * 5)})` : 'rgba(199,125,255,.22)';
    circ(0, 0, 30);
  }
  const g = ctx.createLinearGradient(-20, -20, 20, 20);
  g.addColorStop(0, c.col[0]); g.addColorStop(1, c.col[1]);
  ctx.fillStyle = g; circ(0, 0, 21);
  ctx.strokeStyle = RAR_COL[c.rar]; ctx.lineWidth = c.rar === 'N' ? 1.5 : 3;
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke();
  if (m.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.75)'; circ(0, 0, 21); }
  ctx.font = '24px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(c.em, 0, 2);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  if (fainted) {
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💫', x + Math.cos(EX.t * 5) * 10, y - 30);
  } else {
    if (m.hp < m.mh) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 20, y - 34, 40, 6);
      const r = m.hp / m.mh;
      ctx.fillStyle = r > .5 ? '#3ee089' : r > .2 ? '#ffd166' : '#ff4d6d';
      ctx.fillRect(x - 19, y - 33, 38 * r, 4);
    }
    if (m.ag && Math.hypot(EX.me.x - m.x, EX.me.y - m.y) < 290) {
      ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#ff4d6d'; ctx.textAlign = 'center'; ctx.fillText('！', x + 18, y - 22);
    }
  }
  if (c.rar !== 'N') {
    ctx.font = 'bold 10px "M PLUS Rounded 1c",sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = RAR_COL[c.rar]; ctx.fillText(c.rar, x, y + 33);
  }
}
function drawHero(p, color, label, isMe) {
  const x = p.x, y = p.y + (p.walk ? Math.abs(Math.sin(p.walk)) * -2 : 0);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ell(p.x, p.y + 15, 15, 5);
  ctx.save();
  if (isMe && p.inv > 0 && Math.floor(EX.t * 18) % 2 === 0) ctx.globalAlpha = .45;
  const dir = p.dir;
  const a = Math.atan2(dir.y, dir.x);
  if (p.swing <= 0) {
    ctx.strokeStyle = '#cfd8e6'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - dir.x * 6 + 10, y - 2); ctx.lineTo(x - dir.x * 6 + 16, y - 24); ctx.stroke();
  }
  const g = ctx.createLinearGradient(x - 16, y - 16, x + 16, y + 16);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, color); g.addColorStop(1, color);
  ctx.fillStyle = g; circ(x, y, 16);
  ctx.strokeStyle = isMe ? '#ffffff' : 'rgba(255,255,255,.7)'; ctx.lineWidth = isMe ? 3 : 2;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#ff3d6e'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, 13, a + Math.PI * .55, a + Math.PI * 1.45); ctx.stroke();
  const px = -dir.y, py = dir.x;
  ctx.fillStyle = '#fff';
  circ(x + dir.x * 7 + px * 5, y + dir.y * 7 + py * 5 - 2, 3.6);
  circ(x + dir.x * 7 - px * 5, y + dir.y * 7 - py * 5 - 2, 3.6);
  ctx.fillStyle = '#0b0d1a';
  circ(x + dir.x * 8.5 + px * 5, y + dir.y * 8.5 + py * 5 - 2, 1.8);
  circ(x + dir.x * 8.5 - px * 5, y + dir.y * 8.5 - py * 5 - 2, 1.8);
  if (p.swing > 0) {
    const prog = 1 - p.swing / .22;
    const base = p.swingDir;
    const ang = base - 1.3 + 2.6 * prog;
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(x, y, 44, base - 1.3, ang); ctx.stroke();
    ctx.strokeStyle = '#eaf4ff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + Math.cos(ang) * 16, y + Math.sin(ang) * 16); ctx.lineTo(x + Math.cos(ang) * 58, y + Math.sin(ang) * 58); ctx.stroke();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(ang) * 14 - Math.sin(ang) * 7, y + Math.sin(ang) * 14 + Math.cos(ang) * 7);
    ctx.lineTo(x + Math.cos(ang) * 14 + Math.sin(ang) * 7, y + Math.sin(ang) * 14 - Math.cos(ang) * 7); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  ctx.restore();
  if (p.stun > 0) { ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('💫', x + Math.cos(EX.t * 6) * 10, y - 26); }
  ctx.font = 'bold 11px "M PLUS Rounded 1c",sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(label, x, y - 23);
  ctx.fillStyle = isMe ? '#fff' : color; ctx.fillText(label, x, y - 23);
}

function drawExplore() {
  const W = cv.clientWidth, H = cv.clientHeight, z = EX.zoom;
  const vw = W / z, vh = H / z, cx = EX.cam.x, cy = EX.cam.y;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1f4f22'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * z, 0, 0, DPR * z, -cx * DPR * z, -cy * DPR * z);

  const T = 100;
  const tx0 = Math.max(0, Math.floor(cx / T)), tx1 = Math.min(Math.ceil(WORLD.w / T), Math.ceil((cx + vw) / T));
  const ty0 = Math.max(0, Math.floor(cy / T)), ty1 = Math.min(Math.ceil(WORLD.h / T), Math.ceil((cy + vh) / T));
  for (let ty = ty0; ty < ty1; ty++) for (let tx = tx0; tx < tx1; tx++) {
    ctx.fillStyle = (tx + ty) % 2 ? '#4fa548' : '#4a9e43';
    ctx.fillRect(tx * T, ty * T, T + 1, T + 1);
  }
  const inView = (x, y, m = 60) => x > cx - m && x < cx + vw + m && y > cy - m && y < cy + vh + m;
  for (const d of EX.decor) {
    if (!inView(d.x, d.y)) continue;
    if (d.t === 0) {
      ctx.strokeStyle = '#3a8a36'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(d.x - 5 * d.s, d.y); ctx.lineTo(d.x - 7 * d.s, d.y - 9 * d.s);
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - 12 * d.s);
      ctx.moveTo(d.x + 5 * d.s, d.y); ctx.lineTo(d.x + 7 * d.s, d.y - 9 * d.s);
      ctx.stroke();
    } else {
      ctx.fillStyle = d.c; circ(d.x, d.y, 3 * d.s);
      ctx.fillStyle = '#ffe066'; circ(d.x, d.y, 1.3 * d.s);
    }
  }
  for (const c of EX.chests) if (inView(c.x, c.y)) drawChest(c);

  const list = [];
  for (const o of EX.obs) if (inView(o.x, o.y, 80)) list.push({ y: o.y, f: () => (o.type === 'tree' ? drawTree(o) : drawRock(o)) });
  for (const m of EX.mons.values()) if (inView(m.x, m.y)) list.push({ y: m.y, f: () => drawMon(m) });
  for (const [id, o] of EX.others) {
    if (!inView(o.x, o.y)) continue;
    const info = S.players.get(id) || { name: '???', color: '#ccc' };
    list.push({ y: o.y, f: () => drawHero(o, info.color, info.name, false) });
  }
  const myInfo = S.players.get(S.me);
  list.push({ y: EX.me.y, f: () => drawHero(EX.me, myInfo ? myInfo.color : '#4dc3ff', 'YOU', true) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.f();

  for (const b of EX.balls) drawBall(b[0], b[1], 9, EX.t * 18);
  for (const q of EX.parts) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; circ(q.x, q.y, q.size); }
  ctx.globalAlpha = 1;
  const ch = nearChest(EX.me);
  if (ch) {
    const text = document.body.classList.contains('touch') ? '⚔️/🎯 で開ける' : 'K / O で開ける';
    ctx.font = 'bold 12px "M PLUS Rounded 1c",sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(10,12,28,.8)'; rrect(ch.x - w / 2, ch.y - 66, w, 22, 11); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillText(text, ch.x, ch.y - 51);
  }
  for (const q of EX.pops) {
    ctx.globalAlpha = Math.min(1, q.life * 1.6);
    ctx.font = `bold ${q.size}px "M PLUS Rounded 1c",sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.col; ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

  EX.miniT -= 1;
  if (EX.miniT <= 0) { EX.miniT = 6; drawMini(vw, vh); }
}

function drawMini(vw, vh) {
  const w = mini.width, h = mini.height, sx = w / WORLD.w, sy = h / WORLD.h;
  mctx.clearRect(0, 0, w, h);
  mctx.fillStyle = 'rgba(40,110,45,.85)'; mctx.fillRect(0, 0, w, h);
  mctx.fillStyle = 'rgba(15,60,20,.9)';
  for (const o of EX.obs) if (o.type === 'tree') mctx.fillRect(o.x * sx - 2, o.y * sy - 2, 4, 4);
  for (const c of EX.chests) {
    if (c.open) continue;
    mctx.fillStyle = '#ffd166'; mctx.fillRect(c.x * sx - 3, c.y * sy - 3, 6, 6);
  }
  for (const m of EX.mons.values()) {
    if (!m.c) continue;
    mctx.fillStyle = m.st === 1 ? '#888' : RAR_COL[m.c.rar];
    mctx.beginPath(); mctx.arc(m.x * sx, m.y * sy, m.c.rar === 'SSR' ? 4.5 : 3, 0, Math.PI * 2); mctx.fill();
  }
  for (const [id, o] of EX.others) {
    const info = S.players.get(id);
    mctx.fillStyle = info ? info.color : '#ccc';
    mctx.beginPath(); mctx.arc(o.x * sx, o.y * sy, 4.5, 0, Math.PI * 2); mctx.fill();
  }
  mctx.strokeStyle = 'rgba(255,255,255,.6)'; mctx.lineWidth = 1.5;
  mctx.strokeRect(EX.cam.x * sx, EX.cam.y * sy, vw * sx, vh * sy);
  mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.arc(EX.me.x * sx, EX.me.y * sy, 5, 0, Math.PI * 2); mctx.fill();
  mctx.strokeStyle = '#ff3d6e'; mctx.lineWidth = 2; mctx.stroke();
}

function loop(ts) {
  if (!EX.running) return;
  const dt = Math.min(.05, (ts - EX.last) / 1000 || 0);
  EX.last = ts;
  updateExplore(dt);
  drawExplore();
  EX.raf = requestAnimationFrame(loop);
}

/* =========================================================
   選択フェーズ（30秒）
========================================================= */
const SEL = { timer: 0, end: 0, done: false, party: [], sel: [], rescued: 0 };

socket.on('selectStart', d => {
  stopExplore();
  closeModal();
  $('#bigMsg').classList.remove('show');
  SEL.party = d.party.slice().sort((a, b) => {
    const ca = CHAR_MAP[a.id], cb = CHAR_MAP[b.id];
    return RAR_RANK[cb.rar] - RAR_RANK[ca.rar] || (cb.hp + cb.atk + cb.def + cb.spd) - (ca.hp + ca.atk + ca.def + ca.spd);
  });
  SEL.sel = []; SEL.done = false; SEL.rescued = d.rescued;
  S.inv.items = d.items;
  const st = d.stats;
  $('#selSub').innerHTML = `ゲット ${st.caught}体・撃破 ${st.defeated}体・宝箱 ${st.chests}個` +
    (d.rescued ? `<br><span style="color:var(--accent2)">仲間が足りないため、野良パチモン${d.rescued}体が加勢した！</span>` : '') +
    '<br>タップした順に 先鋒→中堅→大将 になります';
  $('#selWait').textContent = '';
  show('select');
  renderSelect();
  SEL.end = Date.now() + d.left;
  clearInterval(SEL.timer);
  SEL.timer = setInterval(tickSelect, 100);
  tickSelect();
});
socket.on('selectStatus', d => {
  if (S.phase === 'select' && SEL.done) $('#selWait').textContent = `出撃準備完了！ 他のプレイヤーを待っています…（${d.done}/${d.total}）`;
});

function tickSelect() {
  const left = Math.max(0, SEL.end - Date.now());
  const s = Math.ceil(left / 1000);
  const el = $('#selTime');
  el.innerHTML = `${s}<small>秒</small>`;
  el.classList.toggle('warn', s <= 10);
  $('#selBar').style.width = (left / 30000 * 100) + '%';
  if (left <= 0 && !SEL.done) {
    closeModal();
    for (let i = 0; i < SEL.party.length && SEL.sel.length < 3; i++) if (!SEL.sel.includes(i)) SEL.sel.push(i);
    confirmSelect();
  }
  if (left <= 0) clearInterval(SEL.timer);
}
function renderSelect() {
  $('#selGrid').innerHTML = SEL.party.map((e, i) => {
    const c = CHAR_MAP[e.id];
    const k = SEL.sel.indexOf(i);
    return `<div class="selc r-${c.rar} ${k >= 0 ? 'on' : ''}" data-i="${i}">
      <span class="num">${k >= 0 ? POS[k] : ''}</span>
      <button class="ibtn" data-info="${i}">i</button>
      ${avaHTML(c)}
      <div><span class="rb r-${c.rar}">${c.rar}</span><span class="elb">${c.el}</span></div>
      <div class="nm">${c.name}</div>
      <div class="hs">${c.moves.map(m => HAND[m.hand].e).join(' ')}</div>
      <div class="ss">HP${c.hp} 攻${c.atk} 防${c.def} 速${c.spd}</div>
      <div class="ps">【${c.passive.name}】${c.passive.desc}</div>
    </div>`;
  }).join('');
  $('#selSlots').innerHTML = [0, 1, 2].map(k => {
    const i = SEL.sel[k];
    if (i === undefined) return `<div class="sslot"><span style="color:var(--mute)">${POS[k]}：未選択</span></div>`;
    const c = CHAR_MAP[SEL.party[i].id];
    return `<div class="sslot f">${avaHTML(c)}<div><em>${POS[k]}</em><br><b>${c.name}</b></div></div>`;
  }).join('');
  const it = S.inv.items;
  $('#selInv').innerHTML = `バトルに持ち込むアイテム：🗡️闘魂の札 <b>${it.power}</b>　🛡️鉄壁の護符 <b>${it.guard}</b>　🍑仙桃 <b>${it.heal}</b>`;
  $('#selGo').disabled = SEL.done || SEL.sel.length < 3;
  $('#selGo').textContent = SEL.done ? '出撃準備完了！' : 'この3体で出撃！';
}
$('#selGrid').addEventListener('click', e => {
  const info = e.target.closest('[data-info]');
  if (info) { e.stopPropagation(); modal(cardHTML(CHAR_MAP[SEL.party[+info.dataset.info].id]) + '<button class="btn" data-v="ok">閉じる</button>'); return; }
  if (SEL.done) return;
  const card = e.target.closest('.selc');
  if (!card) return;
  const i = +card.dataset.i;
  const k = SEL.sel.indexOf(i);
  if (k >= 0) SEL.sel.splice(k, 1);
  else if (SEL.sel.length < 3) SEL.sel.push(i);
  renderSelect();
});
$('#selGo').addEventListener('click', () => { if (SEL.sel.length === 3) confirmSelect(); });
function confirmSelect() {
  if (SEL.done || SEL.sel.length < 3) return;
  SEL.done = true;
  socket.emit('selectTeam', { uids: SEL.sel.slice(0, 3).map(i => SEL.party[i].uid) });
  $('#selWait').textContent = '出撃準備完了！ 他のプレイヤーを待っています…';
  renderSelect();
}

/* =========================================================
   バトル（サーバー権威・イベント再生）
========================================================= */
const BV = {
  me: 'a', opp: 'b', names: {}, teams: { a: [], b: [] }, snap: null, cpu: false,
  anim: false, submitted: false, over: false, needSwitch: false, waitSwitch: false,
  turn: 1, turnEnd: 0, selItem: null, q: Promise.resolve(), result: null, reason: null, timer: 0, oppReady: false
};

function unitView(sk) {
  const side = sk === 'p' ? BV.me : BV.opp;
  const d = BV.snap[side];
  const def = BV.teams[side][d.idx];
  const du = d.u[d.idx];
  return {
    ...def, maxHp: def.hp, hp: du.hp, status: du.st ? { type: du.st[0], turns: du.st[1] } : null,
    atkSt: du.a, defSt: du.d, flags: du.fl || {}, lastSlot: du.ls, fainted: du.fa, uid: side + d.idx, sk
  };
}

socket.on('battleStart', async d => {
  clearInterval(SEL.timer);
  closeModal();
  Object.assign(BV, {
    me: d.me, opp: d.me === 'a' ? 'b' : 'a', names: d.names, cpu: d.cpu,
    teams: { a: d.teams.a.map(id => CHAR_MAP[id]), b: d.teams.b.map(id => CHAR_MAP[id]) },
    snap: d.snap, anim: true, submitted: false, over: false, needSwitch: false, waitSwitch: false,
    turn: 1, turnEnd: Date.now() + d.left, selItem: null, q: Promise.resolve(), result: null, reason: null, oppReady: false
  });
  $('#log').innerHTML = '';
  $('#pSprite').dataset.uid = ''; $('#eSprite').dataset.uid = '';
  $('#turnLabel').textContent = 'TURN 1';
  $('#vsName').innerHTML = `<b>${esc(BV.names[BV.me])}</b> vs <b>${esc(BV.names[BV.opp])}</b>${BV.cpu ? '（CPU戦）' : ''}`;
  resetClash();
  show('battle');
  renderBattle();
  clearInterval(BV.timer);
  BV.timer = setInterval(updateTurnTimer, 250);
  const oppTeam = BV.teams[BV.opp];
  await modal(`<h2 class="h2">⚔️ 対戦相手：${esc(BV.names[BV.opp])}</h2>
    ${BV.cpu ? '<p class="sub" style="margin-top:6px">人数が奇数のため、あなたはCPUと対戦します</p>' : ''}
    <p class="sub" style="margin-top:6px">あなた：${BV.teams[BV.me].map((c, i) => `${POS[i]} ${c.em}${c.name}`).join(' / ')}</p>
    <div class="enemyrow">${oppTeam.map(c => miniCard(c)).join('')}</div>
    <button class="btn primary" data-v="go">いざ、勝負！</button>`, false);
  if (S.phase !== 'battle') return;
  restartClass($('#eSprite'), 'enter');
  restartClass($('#pSprite'), 'enter');
  await say(`${BV.names[BV.opp]} の ${unitView('e').name} が現れた！`, 'sys', 600);
  await say(`行け！ ${unitView('p').name}！`, 'sys', 450);
  BV.anim = false;
  renderBattle();
});

socket.on('oppReady', () => { BV.oppReady = true; renderControls(); });
socket.on('actionRejected', d => {
  if (S.phase !== 'battle') return;
  if (d.snap) BV.snap = d.snap;
  BV.submitted = false;
  toast(d.msg || 'その行動はできません', 'warn');
  renderBattle();
});

socket.on('turnResult', d => {
  const recv = Date.now();
  BV.q = BV.q.then(async () => {
    if (S.phase !== 'battle') return;
    BV.anim = true; renderControls();
    await playEvents(d.events);
    BV.submitted = false; BV.oppReady = false;
    BV.anim = false;
    BV.turnEnd = recv + d.left;
    if (BV.over) { await sleep(500); showResult(); return; }
    resetClash();
    if (d.needSwitch) {
      BV.needSwitch = true;
      renderBattle();
      const idx = await chooseSwitch();
      BV.needSwitch = false;
      BV.waitSwitch = true;
      socket.emit('battleSwitch', { idx });
    } else if (unitView('e').fainted) {
      BV.waitSwitch = true;
    }
    renderBattle();
  }).catch(err => console.error(err));
});
socket.on('switchResult', d => {
  const recv = Date.now();
  BV.q = BV.q.then(async () => {
    if (S.phase !== 'battle') return;
    BV.anim = true; renderControls();
    await playEvents(d.events);
    BV.anim = false; BV.waitSwitch = false;
    BV.turnEnd = recv + d.left;
    renderBattle();
  }).catch(err => console.error(err));
});

async function playEvents(events) {
  for (const e of events) {
    if (e.snap) BV.snap = e.snap;
    const sk = e.side ? (e.side === BV.me ? 'p' : 'e') : null;
    switch (e.t) {
      case 'turn':
        BV.turn = e.n;
        $('#turnLabel').textContent = `TURN ${e.n}`;
        log(`━━ TURN ${e.n} ━━`, 'turn');
        renderBattle();
        break;
      case 'log':
        await say((e.pre && e.side && e.side !== BV.me ? '相手の' : '') + e.s, e.c, e.ms || 560);
        break;
      case 'fx':
        if (e.f === 'lunge') lunge(sk);
        else if (e.f === 'shake') restartClass($(`#${sk}Sprite`), 'shake');
        else if (e.f === 'heal') restartClass($(`#${sk}Sprite`), 'healfx');
        if (e.pop) popText(sk, e.pop, e.cls);
        renderBattle();
        break;
      case 'item': {
        const it = ITEMS[e.k];
        await say(`${sk === 'p' ? 'あなた' : '相手'}は ${it.ic}${it.n} を使った！`, 'item', 500);
        break;
      }
      case 'clash':
        await clashAnim(e);
        break;
      case 'faint':
        renderBattle();
        $(`#${sk}Sprite`).classList.add('faint');
        break;
      case 'enter':
        renderBattle();
        restartClass($(`#${sk}Sprite`), 'enter');
        await say(sk === 'p' ? `行け！ ${unitView('p').name}！` : `相手は ${unitView('e').name} を繰り出した！`, 'sys', 650);
        break;
      case 'end':
        BV.over = true;
        BV.result = e.winner === 'draw' ? 'draw' : (e.winner === BV.me ? 'win' : 'lose');
        BV.reason = e.reason || null;
        BV.turn = e.turn || BV.turn;
        renderBattle();
        await sleep(700 / S.speed);
        break;
      default:
        renderBattle();
    }
  }
}

async function clashAnim(e) {
  setClash('✊', '✊', '', '');
  const r = $('#resTxt');
  r.className = 'res';
  for (const t of ['じゃん', 'けん', 'ぽん！']) { r.textContent = t; await sleep(230 / S.speed); }
  const myH = e.h[BV.me], opH = e.h[BV.opp];
  const res = e.res === null ? null : (BV.me === 'a' ? e.res : -e.res);
  const label = res === 1 ? ['WIN!', 'win'] : res === -1 ? ['LOSE', 'lose'] : res === 0 ? ['DRAW', 'tie'] : ['---', ''];
  setClash(myH ? HAND[myH].e : '💤', opH ? HAND[opH].e : '💤', label[0], label[1]);
  restartClass($('#clash'), 'show');
  await sleep(380 / S.speed);
  const vs = `${myH ? HAND[myH].e : '💤'} vs ${opH ? HAND[opH].e : '💤'}`;
  if (res === null) await say('両者とも動けない…！', 'sys');
  else if (res === 1) await say(`${vs}  じゃんけん勝ち！`, 'win', 420);
  else if (res === -1) await say(`${vs}  じゃんけん負け…`, 'lose', 420);
  else await say(`${vs}  あいこ！ お互いに威力半分で攻撃！`, 'tie', 480);
}

async function chooseSwitch() {
  const d = BV.snap[BV.me];
  const alive = BV.teams[BV.me].map((c, i) => [c, i, d.u[i]]).filter(([, , u]) => u.hp > 0);
  const html = `<h2 class="h2">次に出すパチモンを選択</h2><p class="sub" style="margin-top:6px">倒れた仲間の意志を継げ！（30秒以内）</p>
    <div class="swlist">${alive.map(([c, i, u]) =>
      `<button data-v="${i}">${avaHTML(c)}<div style="flex:1"><span class="rb r-${c.rar}">${c.rar}</span> <b>${c.name}</b>
        <div style="font-size:12px;color:var(--mute);margin-top:2px">HP ${u.hp}/${c.hp}　${c.moves.map(m => HAND[m.hand].e).join(' ')}</div>
        <div style="font-size:11px;color:var(--accent2)">【${c.passive.name}】${c.passive.desc}</div></div></button>`).join('')}</div>`;
  const v = await modal(html, false);
  return v === null ? alive[0][1] : +v;
}

/* ----- バトル演出 ----- */
function log(t, cls = '') {
  const el = $('#log');
  const p = document.createElement('p');
  p.className = cls; p.textContent = t;
  el.appendChild(p);
  while (el.children.length > 60) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
async function say(t, cls = '', ms = 560) {
  log(t, cls);
  renderBattle();
  await sleep(ms / S.speed);
}
function restartClass(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function popText(sk, t, cls) {
  const sp = $(`#${sk}Sprite`);
  const d = document.createElement('div');
  d.className = 'pop ' + (cls || '');
  d.textContent = t;
  d.style.left = (38 + Math.random() * 24) + '%';
  sp.appendChild(d);
  setTimeout(() => d.remove(), 1100);
}
function lunge(sk) { restartClass($(`#${sk}Sprite`), 'lunge'); }
function setClash(pH, eH, resText, resCls) {
  $('#pHand').textContent = pH; $('#eHand').textContent = eH;
  const r = $('#resTxt'); r.textContent = resText; r.className = 'res ' + (resCls || '');
}
function resetClash() { setClash('❔', '❔', 'VS', ''); }

function updateTurnTimer() {
  const el = $('#turnTimer');
  if (S.phase !== 'battle' || BV.over || BV.anim) { el.textContent = ''; return; }
  const s = Math.max(0, Math.ceil((BV.turnEnd - Date.now()) / 1000));
  el.textContent = `⏱ ${s}秒`;
  el.classList.toggle('warn', s <= 10);
}

/* ----- バトル描画 ----- */
function renderSprite(sk, u) {
  const sp = $(`#${sk}Sprite`);
  if (sp.dataset.uid !== u.uid) {
    sp.dataset.uid = u.uid;
    sp.classList.remove('faint', 'shake', 'lunge');
    sp.querySelector('.sp-body').innerHTML =
      `<div class="orb" style="--c1:${u.col[0]};--c2:${u.col[1]}"><span>${u.em}</span></div><div class="sp-name">${u.name}</div>`;
  }
}
function badgesHTML(u) {
  let h = '';
  if (u.status) { const s = STATUS[u.status.type]; h += `<span class="bd ${s.cls}">${s.ic}${s.n} ${u.status.turns}</span>`; }
  if (u.atkSt) h += `<span class="bd ${u.atkSt > 0 ? 'up' : 'down'}">攻撃${u.atkSt > 0 ? '↑' : '↓'}${Math.abs(u.atkSt)}</span>`;
  if (u.defSt) h += `<span class="bd ${u.defSt > 0 ? 'up' : 'down'}">防御${u.defSt > 0 ? '↑' : '↓'}${Math.abs(u.defSt)}</span>`;
  if (u.flags.power) h += '<span class="bd it">🗡️闘魂</span>';
  if (u.flags.guard) h += '<span class="bd it">🛡️護符</span>';
  if (u.passive.key === 'haisui' && u.hp > 0 && u.hp <= u.maxHp / 3) h += '<span class="bd up">背水発動</span>';
  return h;
}
function renderSide(sk) {
  const side = sk === 'p' ? BV.me : BV.opp;
  const u = unitView(sk);
  $(`#${sk}Name`).textContent = u.name;
  const rb = $(`#${sk}Rar`); rb.textContent = u.rar; rb.className = 'rb r-' + u.rar;
  $(`#${sk}El`).textContent = u.el;
  const pct = Math.max(0, u.hp / u.maxHp * 100);
  const bar = $(`#${sk}Hp`);
  bar.style.width = pct + '%';
  bar.className = 'hp ' + (pct > 50 ? 'hi' : pct > 20 ? 'mid' : 'lo');
  $(`#${sk}HpTxt`).textContent = `${u.hp} / ${u.maxHp}`;
  $(`#${sk}Badges`).innerHTML = badgesHTML(u);
  const d = BV.snap[side];
  $(`#${sk}Bench`).innerHTML = BV.teams[side].map((c, i) => `<span class="bdot ${d.u[i].hp <= 0 ? 'dead' : ''} ${i === d.idx ? 'cur' : ''}">${c.em}</span>`).join('');
  renderSprite(sk, u);
  if (sk === 'e') {
    $('#eMoves').innerHTML = u.moves.map((m, i) =>
      `<div class="echip h-${m.hand} ${i === u.lastSlot ? 'locked' : ''}"><span>${HAND[m.hand].e}</span><em>${m.name}</em></div>`).join('');
  } else {
    $('#pPassive').textContent = `特性【${u.passive.name}】${u.passive.desc}`;
  }
}
const canChoose = () => !BV.anim && !BV.submitted && !BV.over && !BV.needSwitch && !BV.waitSwitch;
function renderControls() {
  if (!BV.snap) return;
  const P = unitView('p');
  const items = BV.snap[BV.me].items;
  const ok = canChoose();
  $('#moves').innerHTML = P.moves.map((m, i) => {
    const locked = i === P.lastSlot;
    return `<button class="mv h-${m.hand} ${locked ? 'locked' : ''}" data-i="${i}" ${locked || !ok ? 'disabled' : ''}>
      <span class="mv-h">${HAND[m.hand].e}</span><b>${m.name}</b>
      <small>威力 ${m.power}${m.hits ? ' ×' + m.hits : ''}</small><em>${m.desc}</em>
      ${locked ? '<span class="lock">🔒 連続使用不可</span>' : ''}</button>`;
  }).join('');
  $('#items').innerHTML = Object.keys(ITEMS).map(k => {
    const it = ITEMS[k], n = items[k] || 0;
    const useless = k === 'heal' && P.hp >= P.maxHp && !P.status;
    const dis = !ok || n <= 0 || useless;
    return `<button class="itb ${BV.selItem === k ? 'sel' : ''}" data-k="${k}" ${dis ? 'disabled' : ''}>
      <span class="ic">${it.ic}</span><span><b>${it.n}</b><small>${it.type}</small></span><span class="cnt">${n}</span></button>`;
  }).join('');
  let hint = '';
  if (BV.over) hint = '';
  else if (BV.submitted) hint = BV.cpu ? '' : '技を決定！ 相手の選択を待っています…';
  else if (BV.waitSwitch) hint = '次のパチモンの選択を待っています…';
  else if (BV.selItem) hint = `${ITEMS[BV.selItem].ic} ${ITEMS[BV.selItem].n}：${ITEMS[BV.selItem].desc}（技を選ぶと使用）`;
  else if (ok) hint = BV.oppReady ? '相手は技を選択済み！ 技を選んでください' : '技を選んでください';
  $('#itHint').textContent = hint;
}
function renderBattle() {
  if (!BV.snap || S.phase !== 'battle') return;
  renderSide('p'); renderSide('e'); renderControls();
}

$('#moves').addEventListener('click', e => {
  const b = e.target.closest('.mv');
  if (!b || b.disabled || !canChoose() || modalOpen()) return;
  const i = +b.dataset.i;
  if (i === unitView('p').lastSlot) return;
  socket.emit('battleAction', { move: i, item: BV.selItem });
  BV.submitted = true;
  BV.selItem = null;
  renderControls();
});
$('#items').addEventListener('click', e => {
  const b = e.target.closest('.itb');
  if (!b || b.disabled || !canChoose()) return;
  const k = b.dataset.k;
  BV.selItem = BV.selItem === k ? null : k;
  renderControls();
});
$('#speedBtn').addEventListener('click', () => {
  S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  $('#speedBtn').textContent = `⏩ 速度 x${S.speed}`;
});
['p', 'e'].forEach(sk => {
  $(`#${sk}Sprite`).addEventListener('click', () => {
    if (!BV.snap || modalOpen() || S.phase !== 'battle') return;
    const u = unitView(sk);
    modal(cardHTML(u) + `<p class="sub" style="margin-top:8px">現在HP ${u.hp} / ${u.maxHp}</p><button class="btn" data-v="ok">閉じる</button>`);
  });
});

/* =========================================================
   リザルト
========================================================= */
function showResult() {
  clearInterval(BV.timer);
  const kind = BV.result || 'draw';
  const t = $('#rTitle');
  t.className = 'rbig ' + kind;
  t.textContent = kind === 'win' ? '勝利！' : kind === 'lose' ? '敗北…' : '引き分け';
  const d = BV.snap[BV.me];
  const alive = d.u.filter(u => u.hp > 0).length;
  const opp = esc(BV.names[BV.opp]);
  $('#rSub').innerHTML = BV.reason === 'left'
    ? `${opp} が退出したため、不戦勝！`
    : kind === 'win' ? `${opp} に勝利！<br>${BV.turn}ターンで決着（生存 ${alive}体）`
    : kind === 'lose' ? `${opp} に敗北…<br>${BV.turn}ターン目に力尽きた` : '両軍、全滅…！';
  $('#rTeam').innerHTML = BV.teams[BV.me].map((c, i) => `<span class="${d.u[i].hp <= 0 ? 'dead' : ''}">${c.em}</span>`).join('');
  show('result');
  updateResultNote();
  socket.emit('lobbyState');
}
function updateResultNote() {
  const d = S.lobby;
  $('#rNote').textContent = d && d.phase !== 'lobby' ? '他のプレイヤーがまだバトル中です。終わり次第、次のゲームを始められます。' : 'ロビーに戻って、もう一度冒険しよう！';
}
$('#toLobbyBtn').addEventListener('click', () => { show('lobby'); renderLobby(); socket.emit('lobbyState'); });
$('#exitBtn').addEventListener('click', leaveToTitle);

document.querySelectorAll('[data-rules]').forEach(b => b.addEventListener('click', () => { if (!modalOpen()) modal(rulesHTML()); }));
</script>
