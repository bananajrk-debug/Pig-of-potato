<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050b14;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#e2d9c2;user-select:none;-webkit-user-select:none}

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);

// 設定・モード保持
let isMobile = false;
let gameMode = 'free'; // 'free' or 'pvp'
let shipCustom = { hull: 0x3a2e24, sail: 0xf2e6d2, flag: 0x8a2818 };

// =====================================================
//  共通ユーティリティ & 地形データ（Sea of Thieves風重厚感）
// =====================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const noise2 = (x, z) => Math.sin(x * 0.11 + 1.3) * Math.cos(z * 0.09 + 0.7) * 1.1 + Math.sin(x * 0.23 + z * 0.17) * 0.55;
const angd = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };

const ISLETS = [
  { name: 'ドクロ島', x: -820, z: -560, r: 60, p: 8 }, { name: 'ヤシ島', x: 700, z: -480, r: 46, p: 5 },
  { name: '岩礁島', x: -600, z: 760, r: 50, p: 8 }, { name: '砂州の島', x: 940, z: 560, r: 38, p: 3 },
  { name: '霧の島', x: 260, z: -1050, r: 54, p: 9 }, { name: 'クジラ湾', x: -1100, z: 260, r: 44, p: 6 },
  { name: '月影島', x: 1130, z: -60, r: 40, p: 4 }, { name: 'ジャガ島', x: -150, z: 1180, r: 52, p: 5 }
];
function mainH(x, z) {
  const d = Math.hypot(x, z), a = Math.atan2(z, x);
  const Rm = 108 + Math.sin(a * 3 + 1) * 9;
  const land = Rm - d;
  const m = 24 * Math.exp(-((x + 8) ** 2 + (z + 24) ** 2) / 2600);
  let elev = (2.6 + m + noise2(x, z) * 0.7) * sstep(0, 34, land);
  return lerp(-5, elev, sstep(-6, 1, land));
}
function isletH(I, x, z) {
  const d = Math.hypot(x - I.x, z - I.z), a = Math.atan2(z - I.z, x - I.x);
  const R = I.r * (1 + 0.12 * Math.sin(a * 4 + I.x));
  const land = R - d;
  const top = I.p * Math.exp(-(d * d) / (2 * (R * 0.5) ** 2));
  return lerp(-5, (1.4 + top) * sstep(0, R * 0.4, land), sstep(-6, 1, land));
}
function heightAt(x, z) {
  if (gameMode === 'pvp') return -5; // 対戦モードは海面アリーナ
  let h = -5;
  if (x > -200 && x < 200 && z > -200 && z < 200) h = mainH(x, z);
  for (const I of ISLETS) {
    const dx = x - I.x, dz = z - I.z;
    if (dx * dx + dz * dz < I.r * I.r * 2.6) { const v = isletH(I, x, z); if (v > h) h = v; }
  }
  return h;
}
let STORM = 0, STORM_T = 0;
const WIND = { dir: 0, spd: 1 };
const wave = (x, z, t) => (0.26 * Math.sin(x * 0.05 + t * 0.8) + 0.2 * Math.sin(z * 0.062 + t * 1.05 + 1.3)) * (1 + 2.2 * STORM);
const DUNGEON_ENTRANCE = { x: ISLETS[0].x + 26, z: ISLETS[0].z + 28 };
const KZONES = [{ name: '嵐の渦潮', x: -1150, z: -1000, r: 260 }, { name: '大渦の海', x: 1050, z: 1150, r: 240 }];
const FIELDS = [];
{
  let seed = 7771; const rr = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  ISLETS.forEach((I, ii) => {
    let got = 0;
    for (let k = 0; k < 200 && got < 3; k++) {
      const a = rr() * Math.PI * 2, r = I.r * (0.3 + rr() * 0.4);
      const x = Math.round(I.x + Math.cos(a) * r), z = Math.round(I.z + Math.sin(a) * r), h = heightAt(x, z);
      if (h < 1.5 || h > 7) continue;
      FIELDS.push({ id: FIELDS.length, x, z, isl: I.name }); got++;
    }
  });
}
const FR = new Set();
const ROAD = [[0, 14], [-8, -2], [10, -16], [-12, -30], [8, -44]];
function roadDist(x, z) {
  let best = 1e9;
  for (let i = 0; i < ROAD.length - 1; i++) {
    const [ax, az] = ROAD[i], [bx, bz] = ROAD[i + 1];
    const vx = bx - ax, vz = bz - az, t = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz), 0, 1);
    best = Math.min(best, Math.hypot(x - ax - vx * t, z - az - vz * t));
  }
  return best;
}

// =====================================================
//  船の形状・レイアウト（後方穴・めり込み・帆の位置の完全修正版）
// =====================================================
const DECKY = 1.8, HOLDY = -0.4;
const TYPES = {
  sloop: { name: 'スループ', hull: [[7.0, 3.2], [4.8, 3.7], [0.5, 3.9], [-4, 3.6], [-7.5, 2.2], [-10.2, 0.25]], qlen: 3.4, qh: 2.4, masts: [-6.0], mastH: 9, cz: [-3.4], crops: 2 },
  galleon: { name: '大型帆船', hull: [[13.5, 4.8], [10.5, 5.4], [5, 5.8], [-3, 5.8], [-9.5, 4.8], [-13.5, 2.5], [-17, 0.3]], qlen: 5.8, qh: 2.6, masts: [-3.5, -9.5], mastH: 15, cz: [-3, -8], crops: 4 }
};
function hwAt(T, z) {
  const H = T.hull;
  if (z > H[0][0] || z < H[H.length - 1][0]) return 0;
  for (let i = 0; i < H.length - 1; i++) {
    const a = H[i], b = H[i + 1];
    if (z <= a[0] && z >= b[0]) return a[1] + (b[1] - a[1]) * ((a[0] - z) / (a[0] - b[0]));
  }
  return 0;
}
function layoutOf(T) {
  const L = {};
  L.stern = T.hull[0][0]; L.bow = T.hull[T.hull.length - 1][0]; L.qh = T.qh;
  L.qz0 = L.stern - T.qlen;
  L.qs1 = L.qz0; L.qs0 = L.qz0 - T.qh / 0.55;
  const hq = hwAt(T, (L.qs0 + L.qs1) / 2);
  L.sw = hq > 3 ? 1.15 : 0.95; L.sxo = hq - 0.3; L.sxi = L.sxo - L.sw;
  L.dxo = Math.min(1.1, L.sxi - 0.2);
  L.ra1 = L.qs0 - 0.9; L.ra0 = L.ra1 - 2.8; L.rax = 0.65;
  L.wheelZ = L.stern - 1.7; L.standZ = L.stern - 0.85;
  L.winch = { x: hwAt(T, L.stern - 1.2) - 0.75, z: L.stern - 1.2 };
  L.hh = (z) => 0.85 * hwAt(T, z) - 0.35;
  L.stove = { x: -(L.hh(L.ra0 - 1.4) - 0.5), z: L.ra0 - 1.4 };
  L.bucket = { x: L.hh(L.ra0 - 1.4) - 0.55, z: L.ra0 - 1.4 };
  L.chest = { x: L.hh(L.stern - 1.6) - 0.5, z: L.stern - 1.6 };
  L.cannons = [];
  for (const side of [-1, 1]) for (const z of T.cz) L.cannons.push({ side, z, x: side * (hwAt(T, z) - 0.6), idx: L.cannons.length });
  L.lad = { z: (T.hull[2][0] + T.hull[3][0]) / 2 - 0.3 };
  L.plant = [];
  for (let i = 0; i < T.crops; i++) { const z = L.qz0 + 1.3 + Math.floor(i / 2) * 1.6; L.plant.push({ x: (i % 2 ? 1 : -1) * (hwAt(T, z) - 0.85), z }); }
  return L;
}
for (const k in TYPES) TYPES[k].L = layoutOf(TYPES[k]);

function shipSurface(T, anch, lx, lz, fy, dopen) {
  const L = T.L, hw = hwAt(T, lz);
  const inHold = fy < DECKY - 0.85;
  if (!inHold) {
    if (lz > L.stern + 0.1 || lz < L.bow - 0.1 || Math.abs(lx) > hw + 0.05) return anch ? 'off' : null;
  } else {
    const h = L.hh(lz);
    if (h < 0.3 || Math.abs(lx) > h + 0.05 || lz > L.stern - 0.2 || lz < L.bow + 0.5) return null;
  }
  if (Math.abs(lx) <= L.rax && lz >= L.ra0 && lz <= L.ra1) return HOLDY + (DECKY - HOLDY) * (lz - L.ra0) / (L.ra1 - L.ra0);
  if (!inHold) {
    if (lz >= L.qs0 && lz <= L.qs1 && Math.abs(lx) >= L.sxi && Math.abs(lx) <= L.sxo + 0.3) return DECKY + L.qh * (lz - L.qs0) / (L.qs1 - L.qs0);
    if (lz >= L.qz0) {
      if (fy > DECKY + L.qh * 0.55) return DECKY + L.qh;
      return DECKY;
    }
    return DECKY;
  }
  return HOLDY;
}

// =====================================================
//  レンダラ / シーン / 海（Sea of Thieves風重厚感）
// =====================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c1824, 0.0035);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 4000);
camera.rotation.order = 'YXZ';
scene.add(camera);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const hemi = new THREE.HemisphereLight(0x8fa8cc, 0x223040, 0.7); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xfff2d0, 0.9); scene.add(sunL);
const holdLight = new THREE.PointLight(0xffa850, 0, 14, 2);
const deckLantern = new THREE.PointLight(0xffc070, 0, 18, 2);
scene.add(holdLight, deckLantern);

// 海面（深い紺碧〜深海ブルー）
const SEA_N = 110, SEA_S = 1400;
const seaGeo = new THREE.PlaneGeometry(SEA_S, SEA_S, SEA_N, SEA_N); seaGeo.rotateX(-Math.PI / 2);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);
const seaMat = new THREE.MeshPhongMaterial({ color: 0x0d3852, shininess: 60, specular: 0x4a7ba0, flatShading: true });
const sea = new THREE.Mesh(seaGeo, seaMat); sea.frustumCulled = false; scene.add(sea);
function updateSea(t) {
  const cell = SEA_S / SEA_N, ox = Math.round(camera.position.x / cell) * cell, oz = Math.round(camera.position.z / cell) * cell;
  sea.position.set(ox, 0, oz);
  const p = seaGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) p[i + 1] = wave(seaBase[i] + ox, seaBase[i + 2] + oz, t);
  seaGeo.attributes.position.needsUpdate = true;
}

// 昼夜サイクル
let hourBase = 8, hourStamp = performance.now(), DAY_SEC = 900;
const curHour = () => (hourBase + (performance.now() - hourStamp) / 1000 / DAY_SEC * 24) % 24;
const sunDir = new THREE.Vector3();
function updateSky(hour) {
  const a = (hour - 6) / 12 * Math.PI, sy = Math.sin(a);
  sunDir.set(Math.cos(a) * 0.9, sy, 0.35).normalize();
  sunL.position.copy(sunDir).multiplyScalar(100);
  sunL.intensity = Math.max(0.1, sy) * 1.0;
  const h = Math.floor(hour), m = Math.floor((hour - h) * 60);
  $('clock').textContent = '⏳ ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// =====================================================
//  ボックス・インスタンス / 地形 / アリーナ生成
// =====================================================
const MAXB = 9000;
const boxIM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ flatShading: true }), MAXB);
boxIM.frustumCulled = false; scene.add(boxIM);
let nb = 0; const dummy = new THREE.Object3D(), tmpC = new THREE.Color();
const GRID = {}, CS = 12, EMPTY = [];
function addSolid(b) {
  const i0 = Math.floor((b.x0 - 0.6) / CS), i1 = Math.floor((b.x1 + 0.6) / CS), j0 = Math.floor((b.z0 - 0.6) / CS), j1 = Math.floor((b.z1 + 0.6) / CS);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) (GRID[i + ',' + j] || (GRID[i + ',' + j] = [])).push(b);
}
const solidsAt = (x, z) => GRID[Math.floor(x / CS) + ',' + Math.floor(z / CS)] || EMPTY;
function box(cx, cy, cz, sx, sy, sz, col, o) {
  o = o || {}; if (nb >= MAXB) return;
  dummy.position.set(cx, cy, cz); dummy.rotation.set(o.tx || 0, o.ry || 0, o.tz || 0); dummy.scale.set(sx, sy, sz); dummy.updateMatrix();
  boxIM.setMatrixAt(nb, dummy.matrix); boxIM.setColorAt(nb, tmpC.set(col)); nb++;
  if (o.solid) {
    const c = Math.abs(Math.cos(o.ry || 0)), s = Math.abs(Math.sin(o.ry || 0)), hx = (c * sx + s * sz) / 2, hz = (s * sx + c * sz) / 2;
    addSolid({ x0: cx - hx, x1: cx + hx, z0: cz - hz, z1: cz + hz, y0: cy - sy / 2, y1: cy + sy / 2 });
  }
}

// 地形メッシュ生成（フリープレイ用）
function buildWorldTerrain() {
  if (gameMode === 'pvp') {
    // 対戦モード用アリーナ（四方に小島と要塞壁）
    box(0, 2, 0, 120, 0.5, 120, 0x2a3542, { solid: true });
    for (let i = -50; i <= 50; i += 25) {
      box(i, 5, -60, 20, 6, 8, 0x4a3d2c, { solid: true });
      box(i, 5, 60, 20, 6, 8, 0x4a3d2c, { solid: true });
    }
    boxIM.count = nb; boxIM.instanceMatrix.needsUpdate = true; return;
  }
  // フリープレイ用島
  ISLETS.forEach((I) => {
    const geo = new THREE.CylinderGeometry(I.r * 0.7, I.r, 12, 10);
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x4a3d2c, flatShading: true }));
    m.position.set(I.x, 1, I.z); scene.add(m);
  });
  boxIM.count = nb; boxIM.instanceMatrix.needsUpdate = true;
}

// =====================================================
//  船の構築（帆をマストより後ろに配置・後方穴の完全ふさぎ）
// =====================================================
const SH = {};
function shapeFrom(zs, wf) {
  const sh = new THREE.Shape();
  zs.forEach((z, i) => { const x = wf(z); if (i === 0) sh.moveTo(x, -z); else sh.lineTo(x, -z); });
  for (let i = zs.length - 1; i >= 0; i--) sh.lineTo(-wf(zs[i]), -zs[i]);
  return sh;
}
function buildShip(type, style) {
  style = style || {};
  const T = TYPES[type], L = T.L, g = new THREE.Group(); g.rotation.order = 'YXZ';
  const lam = (c, ds) => new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 10, side: ds ? THREE.DoubleSide : THREE.FrontSide });
  const add = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); (parent || g).add(m); return m; };
  const hullC = style.color || shipCustom.hull, sailC = style.sailC || shipCustom.sail;

  // 船体
  const H = T.hull, n = H.length, K = 9, pos = [], idx = [];
  const ring = (w) => [[-w, DECKY + 0.4], [-w, DECKY], [-w * 0.88, 0.3], [-w * 0.5, -0.85], [0, -1.3], [w * 0.5, -0.85], [w * 0.88, 0.3], [w, DECKY], [w, DECKY + 0.4]];
  H.forEach(([z, w]) => ring(w).forEach(([x, y]) => pos.query ? 0 : pos.push(x, y, z)));
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < K - 1; k++) { const a = i * K + k, b = a + 1, c = a + K, d = c + 1; idx.push(a, b, c, b, d, c); }
  const hg = new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); hg.setIndex(idx); hg.computeVertexNormals();
  add(hg, lam(hullC, true), 0, 0, 0);

  // 甲板・船内床（穴なし完全結合）
  const zsAll = H.map((h) => h[0]);
  const dsh = shapeFrom(zsAll, (z) => hwAt(T, z) - 0.03);
  const dg = new THREE.ShapeGeometry(dsh); dg.rotateX(-Math.PI / 2); add(dg, lam(0x5a422b, true), 0, DECKY, 0);
  const fgeo = new THREE.ShapeGeometry(shapeFrom(zsAll, (z) => Math.max(0.05, L.hh(z) + 0.1))); fgeo.rotateX(-Math.PI / 2); add(fgeo, lam(0x3a2818, true), 0, HOLDY, 0);
  const waterM = add(fgeo.clone(), new THREE.MeshBasicMaterial({ color: 0x1878a0, transparent: true, opacity: 0.6, side: THREE.DoubleSide }), 0, HOLDY + 0.05, 0); waterM.visible = false;

  // 後方キャビン（完全に隙間を塞ぐ背面パネル）
  const cabM = lam(0x4a3528, true);
  add(new THREE.BoxGeometry(hwAt(T, L.stern - 0.05) * 2.02, L.qh + 0.1, 0.2), cabM, 0, DECKY + L.qh / 2, L.stern - 0.04);

  // 階段・マスト
  const nSt = 5, stLen = (L.qs1 - L.qs0) / nSt;
  [-1, 1].forEach((sd) => {
    for (let i = 0; i < nSt; i++) { const top = L.qh * (i + 1) / nSt; add(new THREE.BoxGeometry(L.sw, top, stLen + 0.02), lam(0x4a3826), sd * (L.sxi + L.sw / 2), DECKY + top / 2, L.qs0 + stLen * (i + 0.5)); }
  });

  // マストと「マストよりも後ろ側」に配置された帆
  const sails = [];
  T.masts.forEach((mz, i) => {
    add(new THREE.CylinderGeometry(0.18, 0.26, T.mastH + 2.4, 6), lam(0x2a1a0c), 0, DECKY + T.mastH / 2 - 0.2, mz);
    const sw = 4.4, sh = T.mastH * 0.62, sy = DECKY + T.mastH * 0.52;
    const grp = new THREE.Group(); grp.position.set(0, 0, mz); g.add(grp);
    // 帆をマストより少し後ろ（+Z方向）にずらして配置
    add(new THREE.PlaneGeometry(sw, sh), lam(sailC, true), 0, sy, 0.35, grp);
    add(new THREE.PlaneGeometry(1.4, 0.9), lam(shipCustom.flag, true), 0.7, DECKY + T.mastH + 1.4, mz + 0.35, grp);
    sails.push(grp);
  });

  // 舵輪・錨・台所・大砲
  const wheel = new THREE.Group(); wheel.position.set(0, DECKY + L.qh + 1.05, L.wheelZ); g.add(wheel);
  add(new THREE.TorusGeometry(0.55, 0.07, 6, 14), lam(0x5a3d28), 0, 0, 0, wheel);
  add(new THREE.BoxGeometry(0.3, 1.0, 0.3), lam(0x2a1a0c), 0, DECKY + L.qh + 0.5, L.wheelZ - 0.2);

  const anchorG = new THREE.Group(); anchorG.position.set(hwAt(T, L.stern - 2.5) + 0.25, DECKY - 0.3, L.stern - 2.5); g.add(anchorG);
  add(new THREE.BoxGeometry(0.16, 1.4, 0.16), lam(0x1a1a20), 0, 0, 0, anchorG);
  const chain = add(new THREE.CylinderGeometry(0.04, 0.04, 1, 4), lam(0x4a4a50), 0, DECKY, 0);

  add(new THREE.BoxGeometry(1.0, 0.9, 1.2), lam(0x3a3a40), L.stove.x, HOLDY + 0.45, L.stove.z);
  const plate = add(new THREE.BoxGeometry(0.8, 0.06, 0.9), new THREE.MeshBasicMaterial({ color: 0xff6a20 }), L.stove.x, HOLDY + 0.93, L.stove.z);

  const cannons = L.cannons.map((c) => {
    const cg = new THREE.Group(); cg.position.set(c.x, DECKY + 0.58, c.z); g.add(cg);
    add(new THREE.BoxGeometry(0.95, 0.5, 0.95), lam(0x2a2a30), 0, -0.3, 0, cg);
    const barrel = new THREE.Group(); cg.add(barrel);
    add(new THREE.CylinderGeometry(0.24, 0.32, 1.6, 8), lam(0x1a1a20), 0.6, 0, 0, barrel).rotation.z = Math.PI / 2;
    return { barrel, c, rec: 0 };
  });

  const tag = label(style.owner || '海賊船', 5, 0.9, null, '#f2e6d2', 52); tag.position.set(0, T.mastH + 6, 0); g.add(tag);
  scene.add(g);
  return { g, T, L, wheel, anchorG, chain, sails, plate, anc: 1, cannons, waterM, tag };
}

function label(text, w, h, bg, fg, px) {
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w);
  const x = c.getContext('2d');
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  x.fillStyle = fg || '#fff'; x.font = 'bold ' + (px || 64) + 'px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, c.width / 2, c.height / 2);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
}

// =====================================================
//  プレイヤー & タッチ操作（視点移動・移動）管理
// =====================================================
const P = { x: 0, y: 1.6, z: 40, vy: 0, yaw: Math.PI, pitch: 0, ship: null, lx: 0, ly: 0, lz: 0, helm: null, swim: false, hp: 200, maxhp: 200, tool: 1, onGround: true, wp: new THREE.Vector3(0, 1.6, 40), dead: 0, moving: false, run: false, viewT: 1, viewTarget: 1, cn: null };

// タッチ操作用リスナー設定
let touchData = { active: false, id: null, sx: 0, sy: 0, cx: 0, cy: 0 };
let camTouch = { active: false, id: nil = null, lx: 0, ly: 0 };

function initTouchControls() {
  if (!isMobile) return;
  $('touchui').style.display = 'block';
  const stick = $('t-stick'), knob = $('t-stick-knob');

  stick.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchData.active = true; touchData.id = t.identifier;
    touchData.sx = t.clientX; touchData.sy = t.clientY;
  });
  addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (touchData.active && t.identifier === touchData.id) {
        const dx = t.clientX - touchData.sx, dy = t.clientY - touchData.sy;
        const d = Math.hypot(dx, dy), maxR = 40;
        const ang = Math.atan2(dy, dx);
        const dist = Math.min(d, maxR);
        knob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
        keys.KeyW = dy < -15; keys.KeyS = dy > 15;
        keys.KeyA = dx < -15; keys.KeyD = dx > 15;
      }
      if (camTouch.active && t.identifier === camTouch.id) {
        P.yaw -= (t.clientX - camTouch.lx) * 0.005;
        P.pitch = clamp(P.pitch - (t.clientY - camTouch.ly) * 0.005, -1.4, 1.4);
        camTouch.lx = t.clientX; camTouch.ly = t.clientY;
      }
    }
  });
  addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (touchData.active && t.identifier === touchData.id) {
        touchData.active = false; knob.style.transform = 'translate(0px, 0px)';
        keys.KeyW = keys.KeyS = keys.KeyA = keys.KeyD = false;
      }
      if (camTouch.active && t.identifier === camTouch.id) camTouch.active = false;
    }
  });

  // 画面右側タッチでカメラ視点回転
  $('c').addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    if (t.clientX > innerWidth / 2 && !camTouch.active) {
      camTouch.active = true; camTouch.id = t.identifier; camTouch.lx = t.clientX; camTouch.ly = t.clientY;
    }
  });

  $('t-jump').onclick = () => { spaceAction = true; };
  $('t-use').onclick = () => { interact(); };
}

// =====================================================
//  インタラクト & メインループ
// =====================================================
let started = false, uiOpen = false, spaceAction = false;
function nearestInter() { return null; }
function interact() {}

function updatePlayer(dt, t) {
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const sp = 5.0, mvx = (-Math.sin(P.yaw) * iz + Math.cos(P.yaw) * ix), mvz = (-Math.cos(P.yaw) * iz - Math.sin(P.yaw) * ix);
  P.x += mvx * sp * dt; P.z += mvz * sp * dt;
  P.y = heightAt(P.x, P.z);
  P.wp.set(P.x, P.y, P.z);
}

function updateCamera(dt) {
  const eye = camera.position.copy(P.wp).add(new THREE.Vector3(0, 1.6, 0));
  const f = new THREE.Vector3(-Math.sin(P.yaw)*Math.cos(P.pitch), Math.sin(P.pitch), -Math.cos(P.yaw)*Math.cos(P.pitch));
  camera.position.copy(eye).addScaledVector(f, -5.0);
  camera.rotation.set(P.pitch, P.yaw, 0);
}

const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; });
addEventListener('keyup', (e) => { keys[e.code] = false; });

let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  updateSky(curHour());
  if (started) {
    updatePlayer(dt, t);
    updateCamera(dt);
    updateSea(t);
  } else {
    camera.position.set(Math.sin(t*0.05)*80, 20, 80);
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// パネル制御
function openPanel(kind) {
  uiOpen = true; const p = $('panel'); p.style.display = 'block';
  if (kind === 'custom') {
    p.innerHTML = `<h2>🚢 船のカスタム</h2>
      <div class="row"><b>船体カラー</b><button onclick="setCol('hull', 0x3a2e24)">ダークウッド</button><button onclick="setCol('hull', 0x24323a)">ネイビー</button></div>
      <div class="row"><b>帆の色</b><button onclick="setCol('sail', 0xf2e6d2)">羊皮紙</button><button onclick="setCol('sail', 0x8a2818)">レッド</button></div>
      <div style="margin-top:14px;text-align:right"><button onclick="closePanel()">閉じる</button></div>`;
  }
}
function closePanel() { $('panel').style.display = 'none'; uiOpen = false; }
window.setCol = (k, v) => { shipCustom[k] = v; alert('変更しました'); };
