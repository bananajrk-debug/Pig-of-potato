<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d1a">
<title>パチットモンスター 〜風林火山〜</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1a; --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1); --line:rgba(255,255,255,.13);
  --text:#eef1ff; --mute:#9aa3c7; --accent:#ff3d6e; --accent2:#ffd166; --good:#3ee089; --bad:#ff4d6d; --blue:#4dc3ff;
  --N:#a7b0d4; --R:#4dc3ff; --SR:#c77dff; --SSR:#ffd166;
  --g:#ff4d6d; --c:#4dc3ff; --p:#3ee089;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'M PLUS Rounded 1c',system-ui,-apple-system,sans-serif;color:var(--text);
  background:
    radial-gradient(1000px 520px at 50% -12%,#3a1a5c 0%,transparent 62%),
    radial-gradient(800px 480px at 110% 110%,#0f3a5a 0%,transparent 60%),
    radial-gradient(600px 400px at -10% 80%,#4a1030 0%,transparent 60%),
    var(--bg);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:disabled{cursor:not-allowed}
.screen{display:none;min-height:100vh;width:100%;max-width:680px;margin:0 auto;padding:16px 14px 22px;flex-direction:column;gap:12px}
.screen.active{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 共通パーツ ---------- */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.05em;
  background:var(--panel2);border:1px solid var(--line);transition:transform .12s,filter .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff3d6e,#ff8a3d);border:none;box-shadow:0 8px 24px rgba(255,61,110,.35)}
.btn.gold{background:linear-gradient(135deg,#ffb703,#ffd166 50%,#ff9e00);color:#2a1800;border:none;box-shadow:0 8px 24px rgba(255,183,3,.35)}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.mini{padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px}
.h2{font-family:'Dela Gothic One',sans-serif;font-size:22px;letter-spacing:.06em;text-align:center}
.sub{color:var(--mute);font-size:13px;text-align:center;line-height:1.6}
.rb{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#0b0d1a;vertical-align:middle}
.rb.r-N{background:var(--N)} .rb.r-R{background:var(--R)} .rb.r-SR{background:var(--SR)}
.rb.r-SSR{background:linear-gradient(90deg,#ffd166,#fff3c4,#ffb703);box-shadow:0 0 10px rgba(255,209,102,.7)}
.elb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(255,255,255,.14);vertical-align:middle}

/* ---------- タイトル ---------- */
#title{justify-content:center;align-items:center;text-align:center;gap:18px}
.logo-kanji{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.logo-kanji span{font-family:'Dela Gothic One',sans-serif;width:52px;height:52px;display:grid;place-items:center;font-size:28px;border-radius:12px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--line);animation:float 3s ease-in-out infinite}
.logo-kanji span:nth-child(1){color:#7cf7ff;animation-delay:0s}
.logo-kanji span:nth-child(2){color:#b6f26b;animation-delay:.2s}
.logo-kanji span:nth-child(3){color:#ff8a3d;animation-delay:.4s}
.logo-kanji span:nth-child(4){color:#e0c08a;animation-delay:.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo{font-family:'Dela Gothic One',sans-serif;font-size:clamp(34px,10vw,58px);line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#ffd166 55%,#ff3d6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(255,61,110,.45))}
.logo small{display:block;font-size:.36em;letter-spacing:.3em;margin-top:8px}
.title-mons{font-size:34px;letter-spacing:6px;opacity:.95}
.title-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;margin-top:6px}

/* ---------- ガチャ ---------- */
.machine{position:relative;margin:6px auto 0;width:220px;height:250px;display:grid;place-items:center}
.machine .dome{position:absolute;top:0;width:200px;height:170px;border-radius:100px 100px 24px 24px;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.35),rgba(255,255,255,.05) 45%),linear-gradient(180deg,rgba(124,247,255,.12),rgba(199,125,255,.12));
  border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 0 40px rgba(124,247,255,.15),0 0 40px rgba(199,125,255,.2);overflow:hidden}
.dome i{position:absolute;width:34px;height:34px;border-radius:50%;opacity:.85}
.machine .base{position:absolute;bottom:0;width:220px;height:92px;border-radius:20px;background:linear-gradient(180deg,#ff3d6e,#a3123e);
  box-shadow:0 10px 30px rgba(255,61,110,.35);display:grid;place-items:center}
.base .slot{width:70px;height:18px;border-radius:9px;background:#3a0a1a;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.capsule{position:absolute;top:56px;width:84px;height:84px;border-radius:50%;z-index:3;
  background:linear-gradient(180deg,#fff 0 48%,#333 48% 52%,#ff3d6e 52% 100%);box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .3s}
.capsule.spin{animation:capSpin 1s cubic-bezier(.4,0,.2,1)}
@keyframes capSpin{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-25deg) scale(1.05)}40%{transform:rotate(25deg) scale(1.05)}
  60%{transform:rotate(-360deg) scale(1.15)}100%{transform:rotate(-720deg) scale(1)}}
.capsule.open{animation:capOpen .5s ease forwards}
.capsule.open.r-N{--rc:var(--N)} .capsule.open.r-R{--rc:var(--R)} .capsule.open.r-SR{--rc:var(--SR)} .capsule.open.r-SSR{--rc:var(--SSR)}
@keyframes capOpen{0%{transform:scale(1)}50%{transform:scale(1.35);box-shadow:0 0 60px 20px var(--rc)}100%{transform:scale(0);opacity:0;box-shadow:0 0 120px 60px var(--rc)}}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle,var(--fc,#fff),transparent 70%)}
.flash.go{animation:flash .7s ease}
@keyframes flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slotc{aspect-ratio:3/4;border-radius:16px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--panel);font-size:12px;color:var(--mute);padding:6px;text-align:center}
.slotc.filled{border-style:solid;color:var(--text);animation:pop .4s ease}
.slotc.filled.r-SSR{border-color:var(--SSR);box-shadow:0 0 16px rgba(255,209,102,.4)}
.slotc.filled.r-SR{border-color:var(--SR)} .slotc.filled.r-R{border-color:var(--R)}
.slotc .ava{width:54px;height:54px;font-size:30px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.rates{font-size:12px;color:var(--mute);text-align:center}
.rates b{margin:0 4px}

/* ---------- カード ---------- */
.ava{width:64px;height:64px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),linear-gradient(145deg,var(--c1),var(--c2));
  box-shadow:0 0 18px color-mix(in srgb,var(--c1) 60%,transparent)}
.card{border-radius:18px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1.5px solid var(--line);text-align:left}
.card.r-SSR{border-color:var(--SSR);box-shadow:0 0 28px rgba(255,209,102,.35)}
.card.r-SR{border-color:var(--SR);box-shadow:0 0 20px rgba(199,125,255,.25)}
.card.r-R{border-color:var(--R)}
.card-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.card-top h3{font-size:20px;margin-top:3px}
.card-top .ttl{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:10px}
.st{display:flex;align-items:center;gap:6px;font-size:11px}
.st span{width:28px;color:var(--mute)}
.st .sb{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.st .sb i{display:block;height:100%;background:linear-gradient(90deg,#4dc3ff,#c77dff)}
.st b{width:26px;text-align:right}
.pas{font-size:12px;line-height:1.55;padding:8px 10px;border-radius:10px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.25);margin-bottom:8px}
.pas b{color:var(--accent2);margin-right:4px}
.mlist{display:flex;flex-direction:column;gap:5px}
.mi{display:grid;grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;padding:6px 9px;border-radius:10px;
  background:rgba(255,255,255,.05);border-left:4px solid var(--hc)}
.mi span{grid-row:1/3;font-size:22px;text-align:center}
.mi b{font-size:13px} .mi i{font-style:normal;font-size:11px;color:var(--mute)}
.mi small{grid-column:2/4;font-size:11px;color:var(--mute)}
.h-g{--hc:var(--g)} .h-c{--hc:var(--c)} .h-p{--hc:var(--p)}

/* ---------- チーム編成 ---------- */
.tlist{display:flex;flex-direction:column;gap:10px}
.tslot{display:flex;align-items:stretch;gap:10px;padding:10px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);transition:.15s;cursor:pointer}
.tslot.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(255,209,102,.25);transform:scale(1.01)}
.pos{writing-mode:vertical-rl;font-family:'Dela Gothic One',sans-serif;font-size:15px;letter-spacing:.2em;padding:6px 4px;border-radius:10px;
  background:linear-gradient(180deg,#ff3d6e,#ff8a3d);display:grid;place-items:center}
.mc{flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.mc .ava{width:52px;height:52px;font-size:28px}
.mc .info{flex:1;min-width:0}
.mc .nm{font-weight:800;font-size:16px;margin:2px 0}
.mc .hs{font-size:18px;letter-spacing:2px}
.mc .ps{font-size:11px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-weight:800;flex:0 0 auto;align-self:center}
.enemyrow{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.enemyrow .mc{padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}

/* ---------- バトル ---------- */
#battle{gap:8px;padding-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.topbar #turnLabel{font-family:'Dela Gothic One',sans-serif;font-size:16px;letter-spacing:.12em;color:var(--accent2)}
.topbar div{display:flex;gap:6px}
.unitbar{padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.unitbar.enemy{border-color:rgba(255,77,109,.35)} .unitbar.player{border-color:rgba(77,195,255,.35)}
.ub-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ub-head .who{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.08em}
.enemy .who{background:var(--bad)} .player .who{background:var(--blue);color:#06202e}
.ub-head b{font-size:16px}
.bench{margin-left:auto;display:flex;gap:4px}
.bdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.bdot.cur{border-color:var(--accent2);box-shadow:0 0 8px rgba(255,209,102,.5)}
.bdot.dead{filter:grayscale(1);opacity:.35}
.hpwrap{position:relative;height:14px;border-radius:7px;background:rgba(0,0,0,.4);margin:7px 0 5px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.hp{height:100%;border-radius:7px;transition:width .45s ease,background .3s}
.hp.hi{background:linear-gradient(90deg,#2bd47d,#7cf7a0)}
.hp.mid{background:linear-gradient(90deg,#ffb703,#ffd166)}
.hp.lo{background:linear-gradient(90deg,#ff2d55,#ff6b6b);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.4)}}
.hpwrap span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.badges{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.bd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.1)}
.st-poison{background:#7b2cbf} .st-burn{background:#e85d04} .st-para{background:#d4a300;color:#1c1400} .st-conf{background:#d63384}
.bd.up{background:rgba(62,224,137,.25);color:#7cf7a0} .bd.down{background:rgba(255,77,109,.25);color:#ff9aa8}
.bd.it{background:rgba(255,209,102,.2);color:var(--accent2)}
.pline{font-size:11px;color:var(--accent2);margin-top:3px}
.emoves{display:flex;gap:5px;margin-top:6px}
.echip{flex:1;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:9px;font-size:11px;background:rgba(255,255,255,.06);border-left:3px solid var(--hc);min-width:0}
.echip span{font-size:15px}
.echip em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.echip.locked{opacity:.35;text-decoration:line-through}

.arena{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 4px;min-height:150px;border-radius:20px;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,61,110,.18),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.07));
  border:1px solid var(--line);overflow:hidden}
.arena::before{content:"";position:absolute;left:0;right:0;bottom:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.sprite{position:relative;display:flex;justify-content:center;cursor:pointer}
.sp-body{display:flex;flex-direction:column;align-items:center;gap:4px}
.orb{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 42%),linear-gradient(145deg,var(--c1),var(--c2));
  box-shadow:0 0 30px color-mix(in srgb,var(--c1) 70%,transparent),inset 0 -8px 16px rgba(0,0,0,.25);animation:idle 2.4s ease-in-out infinite}
.sprite.e .orb{animation-delay:.6s}
.sprite.e .orb span{display:inline-block;transform:scaleX(-1)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sp-name{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.4)}
.sprite.shake .orb{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px);filter:brightness(2.2)}40%{transform:translateX(8px)}60%{transform:translateX(-5px);filter:brightness(1.6)}80%{transform:translateX(3px)}}
.sprite.p.lunge .orb{animation:lungeR .35s}
.sprite.e.lunge .orb{animation:lungeL .35s}
@keyframes lungeR{50%{transform:translateX(28px) scale(1.12)}}
@keyframes lungeL{50%{transform:translateX(-28px) scale(1.12)}}
.sprite.faint .orb{animation:faint .7s forwards}
@keyframes faint{to{transform:translateY(30px) scale(.4);opacity:0;filter:grayscale(1)}}
.sprite.enter .orb{animation:enter .55s ease}
@keyframes enter{0%{transform:scale(0) rotate(-180deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.sprite.healfx .orb{animation:healfx .6s}
@keyframes healfx{50%{box-shadow:0 0 40px 14px rgba(62,224,137,.8)}}
.pop{position:absolute;top:8px;font-family:'Dela Gothic One',sans-serif;font-size:24px;color:#fff;text-shadow:0 2px 0 #b5002f,0 0 10px rgba(255,61,110,.8);
  pointer-events:none;animation:popUp 1.1s ease-out forwards;z-index:5;transform:translateX(-50%)}
.pop.crit{font-size:32px;color:var(--accent2);text-shadow:0 2px 0 #8a4b00,0 0 14px rgba(255,209,102,.9)}
.pop.healp{color:#7cf7a0;text-shadow:0 2px 0 #0a5a2e,0 0 10px rgba(62,224,137,.7)}
.pop.stdmg{color:#d48bff;font-size:20px;text-shadow:0 2px 0 #3c0a6b}
.pop.miss{color:#cfe8ff;text-shadow:0 2px 0 #234}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}

.clash{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px}
.hand{font-size:34px;height:44px;line-height:44px;transition:.2s}
.res{font-family:'Dela Gothic One',sans-serif;font-size:15px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.4);white-space:nowrap}
.res.win{background:var(--good);color:#04210f} .res.lose{background:var(--bad)} .res.tie{background:var(--accent2);color:#2a1800}
.clash.show .hand{animation:handPop .45s ease}
@keyframes handPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}

.log{height:96px;overflow-y:auto;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:12.5px;line-height:1.6;scroll-behavior:smooth}
.log p{animation:fadeIn .25s}
.log .turn{color:var(--accent2);font-weight:800;text-align:center;margin-top:2px}
.log .act{color:#fff;font-weight:700} .log .dmg{color:#ff9aa8} .log .heal{color:#7cf7a0} .log .st{color:#d48bff}
.log .up{color:#7cf7ff} .log .down{color:#ffb38a} .log .sys{color:var(--mute)} .log .item{color:var(--accent2)}
.log .win{color:var(--good);font-weight:800} .log .lose{color:var(--bad);font-weight:800} .log .tie{color:var(--accent2);font-weight:800} .log .ko{color:#ff4d6d;font-weight:800}

.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.itb{position:relative;display:flex;align-items:center;gap:6px;padding:8px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);text-align:left;transition:.15s}
.itb .ic{font-size:22px}
.itb b{display:block;font-size:12px} .itb small{font-size:10px;color:var(--mute)}
.itb .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.itb.sel{border-color:var(--accent2);background:rgba(255,209,102,.14);box-shadow:0 0 14px rgba(255,209,102,.35)}
.itb:disabled{opacity:.35}
.ithint{font-size:11px;color:var(--accent2);text-align:center;min-height:15px}

.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 9px;border-radius:16px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 30%,transparent),color-mix(in srgb,var(--hc) 10%,transparent));
  border:2px solid color-mix(in srgb,var(--hc) 70%,transparent);box-shadow:0 6px 18px color-mix(in srgb,var(--hc) 22%,transparent);transition:transform .12s,opacity .2s}
.mv:not(:disabled):active{transform:scale(.95)}
@media(hover:hover){.mv:not(:disabled):hover{transform:translateY(-2px)}}
.mv-h{font-size:34px;line-height:1}
.mv b{font-size:13.5px;line-height:1.2}
.mv small{font-size:11px;font-weight:800;color:var(--hc)}
.mv em{font-style:normal;font-size:10.5px;color:#cfd5f2;line-height:1.35}
.mv:disabled{opacity:.5}
.mv.locked{opacity:.28;filter:grayscale(.8)}

#result{justify-content:center;align-items:center;text-align:center;gap:16px}
.rbig{font-family:'Dela Gothic One',sans-serif;font-size:clamp(56px,18vw,96px);line-height:1;animation:pop .6s ease}
.rbig.win{background:linear-gradient(180deg,#fff,#ffd166,#ff9e00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,209,102,.6))}
.rbig.lose{color:#8b93b8;filter:drop-shadow(0 0 18px rgba(255,77,109,.4))}
.rbig.draw{color:var(--blue)}
.rteam{display:flex;gap:10px;justify-content:center;font-size:30px}

.rteam span.dead{filter:grayscale(1);opacity:.4}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,14,.72);backdrop-filter:blur(6px)}
.modal.open{display:flex;animation:fadeIn .2s}
.modal-card{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:18px;border-radius:22px;background:linear-gradient(170deg,#1c2045,#12142a);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-card .btn{margin-top:12px}
.reveal-head{text-align:center;margin-bottom:10px}
.reveal-head .big{font-family:'Dela Gothic One',sans-serif;font-size:30px;letter-spacing:.1em}
.reveal-head .big.r-SSR{background:linear-gradient(90deg,#ffd166,#fff,#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.2s infinite}
.reveal-head .big.r-SR{color:var(--SR)} .reveal-head .big.r-R{color:var(--R)} .reveal-head .big.r-N{color:var(--N)}
@keyframes shine{50%{filter:brightness(1.5) drop-shadow(0 0 10px rgba(255,209,102,.8))}}
.rules h3{font-size:15px;margin:14px 0 6px;color:var(--accent2)}
.rules p,.rules li{font-size:13px;line-height:1.7;color:#d8ddf5}
.rules ul{padding-left:18px}
.swlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.swlist button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);text-align:left}
.swlist button:active{border-color:var(--accent2)}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}

/* =========================================================

========================================================= */
function modal(html, closable = true) {
  return new Promise(resolve => {
    const m = $('#modal');
    $('#modalBody').innerHTML = html;
    m.classList.add('open');
    $('#modalBody').scrollTop = 0;
    m.onclick = e => {
      const t = e.target.closest('[data-v]');
      if (t) { m.classList.remove('open'); m.onclick = null; resolve(t.dataset.v); }
      else if (closable && e.target === m) { m.classList.remove('open'); m.onclick = null; resolve(null); }
    };
  });
}

}
function avaHTML(c, cls = '') {
  return `<div class="ava ${cls}" style="--c1:${c.col[0]};--c2:${c.col[1]}">${c.em}</div>`;
}
function cardHTML(c) {
  const hp = c.maxHp || c.hp;

/* =========================================================
   ガチャ
========================================================= */
function rollRarity() {
  const r = Math.random() * 100;
  if (r < 5) return 'SSR';
  if (r < 20) return 'SR';
  if (r < 54) return 'R';
  return 'N';
}
function drawOne(excludeIds) {
  const rar = rollRarity();
  let pool = CHARS.filter(c => c.rar === rar && !excludeIds.includes(c.id));
  if (!pool.length) pool = CHARS.filter(c => !excludeIds.includes(c.id));
  return pick(pool);
}

/* =========================================================
   バトル：ユニット生成・計算
========================================================= */
function makeUnit(c, sk) {
  return { ...c, moves: c.moves.map(m => ({ ...m })), maxHp: c.hp, hp: c.hp, status: null, atkSt: 0, defSt: 0, lastSlot: null, flags: {}, fainted: false, sk };
}
const act = side => side.units[side.idx];
const avail = u => [0, 1, 2].filter(i => i !== u.lastSlot);
const stageMul = s => s >= 0 ? 1 + .25 * s : 1 / (1 - .25 * s);

function effAtk(u) {
  let a = u.atk * stageMul(u.atkSt);
  if (u.passive.key === 'haisui' && u.hp <= u.maxHp / 3) a *= 1.5;
  if (u.status && u.status.type === 'burn') a *= .75;
  return a;
}
function calcDamage(att, def, mv, mult) {
  const df = def.def * stageMul(def.defSt);
  let dmg = mv.power * effAtk(att) / df * .8 * rnd(.9, 1.1) * mult;
  if (att.flags.power) dmg *= 1.5;
  if (att.passive.key === 'dokutai' && def.status && def.status.type === 'poison') dmg *= 1.3;
  const critRate = .06 + (mv.crit || 0) + (att.passive.key === 'shofuku' ? .2 : 0);
  const crit = Math.random() < critRate;
  if (crit) dmg *= 1.5;
  if (def.passive.key === 'teppeki') dmg *= .85;
  if (def.flags.guard) dmg *= .5;
  return { dmg: Math.max(1, Math.round(dmg)), crit };
}
function heal(u, n) {
  const before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp + n);
  const h = u.hp - before;
  if (h > 0) popText(u.sk, '+' + h, 'healp');
  return h;
}

/* =========================================================
   バトル：状態異常・能力変化
========================================================= */
async function inflict(t, type) {
  if (t.hp <= 0 || t.status) return;
  if (t.passive.key === 'furinkazan') { await say(`${t.name}は【風林火山】で${STATUS[type].n}を受けつけない！`, 'sys'); return; }
  if (t.flags.guard) { await say(`${t.name}は護符の結界で${STATUS[type].n}を防いだ！`, 'sys'); return; }
  let turns = STATUS[type].turns;
  if (t.passive.key === 'seiryu') turns = Math.ceil(turns / 2);
  t.status = { type, turns };
  await say(`${t.name}は${STATUS[type].ic}${STATUS[type].n}になった！`, 'st');
}
async function stage(u, key, delta) {
  const k = key === 'atk' ? 'atkSt' : 'defSt';
  const label = key === 'atk' ? '攻撃' : '防御';
  const before = u[k];
  u[k] = Math.max(-2, Math.min(2, u[k] + delta));
  if (u[k] === before) { await say(`${u.name}の${label}はこれ以上変わらない！`, 'sys', 400); return; }
  await say(`${u.name}の${label}が${delta > 0 ? '上がった！' : '下がった！'}`, delta > 0 ? 'up' : 'down', 450);
}
async function canAct(u) {
  if (u.status && u.status.type === 'paralyze' && Math.random() < .3) {
    await say(`${u.name}は体がしびれて動けない！`, 'st');
    return false;
  }
  return true;
}

/* =========================================================
   バトル：攻撃処理
========================================================= */
async function doAttack(att, def, mv, mult, defMv, defLost) {
  if (att.hp <= 0 || def.hp <= 0) return;
  lunge(att.sk);
  await say(`${att.sk === 'e' ? '相手の' : ''}${att.name}の【${mv.name}】！`, 'act', 420);
  let total = 0, dodged = false;
  if (def.passive.key === 'mikiri' && Math.random() < .25) {
    dodged = true;
    popText(def.sk, 'MISS', 'miss');
    await say(`${def.name}は【見切り】で攻撃をかわした！`, 'sys');
  }
  if (!dodged) {
    const hits = mv.hits || 1;
    for (let h = 0; h < hits && def.hp > 0; h++) {
      let { dmg, crit } = calcDamage(att, def, mv, mult);
      if (defMv && defMv.guard) dmg = Math.max(1, Math.round(dmg * (1 - defMv.guard)));
      def.hp = Math.max(0, def.hp - dmg);
      total += dmg;
      hitFx(def.sk, dmg, crit);
      await say(`${crit ? '急所に当たった！ ' : ''}${def.name}に ${dmg} のダメージ！`, 'dmg', hits > 1 ? 420 : 560);
    }
    if (hits > 1) await say(`${hits}回ヒット！`, 'sys', 320);
    if (defMv && defMv.guard && total > 0) await say(`（${defMv.name}でダメージを軽減した）`, 'sys', 320);
  }
  // 自分への効果
  if (mv.drain && total > 0 && att.hp > 0) {
    const h = heal(att, Math.round(total * mv.drain));
    if (h) { healFx(att.sk); await say(`${att.name}はHPを ${h} 吸収した！`, 'heal'); }
  }
  if (mv.heal && att.hp > 0) {
    const h = heal(att, Math.round(att.maxHp * mv.heal));
    if (h) { healFx(att.sk); await say(`${att.name}はHPが ${h} 回復した！`, 'heal'); }
  }
  if (mv.recoil && total > 0 && att.hp > 0) {
    const r = Math.max(1, Math.round(total * mv.recoil));
    att.hp = Math.max(0, att.hp - r);
    hitFx(att.sk, r, false);
    await say(`${att.name}は反動で ${r} のダメージ！`, 'dmg');
  }
  if (mv.selfBuff && att.hp > 0) for (const k in mv.selfBuff) await stage(att, k, mv.selfBuff[k]);
  // 相手への効果
  if (!dodged && def.hp > 0) {
    if (mv.foeDebuff) for (const k in mv.foeDebuff) await stage(def, k, mv.foeDebuff[k]);
    if (mv.status && Math.random() < mv.status.chance) await inflict(def, mv.status.type);
    if (att.passive.key === 'taiden' && total > 0 && !def.status && Math.random() < .2) {
      await say(`${att.name}の【帯電】が発動！`, 'sys', 380);
      await inflict(def, 'paralyze');
    }
  }
  // カウンター
  if (defLost && defMv && defMv.counter && def.hp > 0 && att.hp > 0 && total > 0) {
    const r = Math.max(1, Math.round(total * defMv.counter));
    att.hp = Math.max(0, att.hp - r);
    hitFx(att.sk, r, false);
    await say(`${def.name}の【${defMv.name}】！ ${r} のダメージを跳ね返した！`, 'dmg');
  }
}

async function useItem(side, u, k) {
  side.items[k]--;
  const it = ITEMS[k];
  await say(`${side.isPlayer ? 'あなた' : '相手'}は ${it.ic}${it.n} を使った！`, 'item', 500);
  if (k === 'power') { u.flags.power = true; await say(`${u.name}の攻撃に闘魂が宿った！`, 'up'); }
  else if (k === 'guard') { u.flags.guard = true; await say(`${u.name}は護符の結界に包まれた！`, 'up'); }
  else {
    const h = heal(u, Math.round(u.maxHp * .4));
    healFx(u.sk);
    await say(`${u.name}のHPが ${h} 回復した！`, 'heal');
    if (u.status) { const n = STATUS[u.status.type].n; u.status = null; await say(`${u.name}の${n}が治った！`, 'heal'); }
  }
}

/* =========================================================
   CPU思考
========================================================= */
function estDmg(a, d, m) {
  let v = m.power * effAtk(a) / (d.def * stageMul(d.defSt)) * .8 * (m.hits || 1);
  if (d.passive.key === 'teppeki') v *= .85;
  if (a.passive.key === 'dokutai' && d.status && d.status.type === 'poison') v *= 1.3;
  return v;
}
function cpuChoose(E, P) {
  const ea = avail(E), pa = avail(P);
  let best = ea[0], bs = -1e9;
  for (const i of ea) {
    const em = E.moves[i];
    let ev = 0;
    for (const j of pa) {
      const pm = P.moves[j];
      const r = judge(em.hand, pm.hand);
      const de = estDmg(E, P, em) * (pm.guard ? 1 - pm.guard : 1);
      const dp = estDmg(P, E, pm) * (em.guard ? 1 - em.guard : 1);
      let v;
      if (r === 1) v = de - (em.counter ? 0 : 0);
      else if (r === -1) v = -dp + (em.counter ? dp * em.counter * .8 : 0);
      else v = de * (E.passive.key === 'shippu' ? 1 : .5) - dp * (P.passive.key === 'shippu' ? 1 : .5);
      if (r >= 0) {
        if (em.status && !P.status && P.passive.key !== 'furinkazan') v += 9 * em.status.chance;
        if (em.heal) v += Math.min(E.maxHp - E.hp, E.maxHp * em.heal) * .6;
        if (em.selfBuff) v += 5;
        if (em.foeDebuff) v += 4;
        if (em.recoil) v -= de * em.recoil * .6;
      }
      if (r === 1 && de >= P.hp) v += 40;
      if (r === -1 && dp >= E.hp) v -= 30;
      ev += v;
    }
    ev = ev / pa.length + rnd(-9, 9);
    if (ev > bs) { bs = ev; best = i; }
  }
  return best;
}
function cpuItem(side, u) {
  const it = side.items;
  if (it.heal > 0 && (u.hp < u.maxHp * .35 || (u.status && u.hp < u.maxHp * .6)) && Math.random() < .75) return 'heal';
  if (it.guard > 0 && u.hp < u.maxHp * .55 && Math.random() < .3) return 'guard';
  if (it.power > 0 && Math.random() < .18) return 'power';
  return null;
}

/* =========================================================
   ターン進行
========================================================= */
async function jankenAnim() {
  const r = $('#resTxt');
  r.className = 'res';
  for (const t of ['じゃん', 'けん', 'ぽん！']) { r.textContent = t; await sleep(230 / S.speed); }
}

async function resolveTurn(pi, ei) {
  const P = act(S.P), E = act(S.E);
  const pm = P.moves[pi], em = E.moves[ei];
  let pH = pm.hand, eH = em.hand;

  const pCan = await canAct(P);
  const eCan = await canAct(E);
  if (pCan && P.status && P.status.type === 'confuse' && Math.random() < .4) {
    pH = pick(['g', 'c', 'p'].filter(h => h !== pm.hand));
    await say(`${P.name}は混乱して手が ${HAND[pm.hand].e}→${HAND[pH].e} に変わった！`, 'st');
  }
  if (eCan && E.status && E.status.type === 'confuse' && Math.random() < .4) {
    eH = pick(['g', 'c', 'p'].filter(h => h !== em.hand));
    await say(`相手の${E.name}は混乱して手が ${HAND[em.hand].e}→${HAND[eH].e} に変わった！`, 'st');
  }

  setClash('✊', '✊', '', '');
  await jankenAnim();

  let res;
  if (!pCan && !eCan) res = null;
  else if (!pCan) res = -1;
  else if (!eCan) res = 1;
  else res = judge(pH, eH);

  const label = res === 1 ? ['WIN!', 'win'] : res === -1 ? ['LOSE', 'lose'] : res === 0 ? ['DRAW', 'tie'] : ['---', ''];
  setClash(pCan ? HAND[pH].e : '💤', eCan ? HAND[eH].e : '💤', label[0], label[1]);
  restartClass($('#clash'), 'show');
  await sleep(380 / S.speed);

  if (res === null) {
    await say('両者とも動けない…！', 'sys');
  } else if (res === 1) {
    await say(`${HAND[pH].e} vs ${HAND[eH].e}  じゃんけん勝ち！`, 'win', 420);
    await doAttack(P, E, pm, 1, eCan ? em : null, true);
  } else if (res === -1) {
    await say(`${HAND[pH].e} vs ${HAND[eH].e}  じゃんけん負け…`, 'lose', 420);
    await doAttack(E, P, em, 1, pCan ? pm : null, true);
  } else {
    await say(`${HAND[pH].e} vs ${HAND[eH].e}  あいこ！ お互いに威力半分で攻撃！`, 'tie', 480);
    const pFirst = P.spd > E.spd || (P.spd === E.spd && Math.random() < .5);
    const order = pFirst ? [[P, E, pm, em], [E, P, em, pm]] : [[E, P, em, pm], [P, E, pm, em]];
    for (const [a, d, am, dm] of order) {
      if (a.hp <= 0 || d.hp <= 0) continue;
      await doAttack(a, d, am, a.passive.key === 'shippu' ? 1 : .5, dm, false);
    }
  }
}

async function endOfTurn() {
  for (const u of [act(S.P), act(S.E)]) {
    if (u.hp <= 0) continue;
    if (u.status) {
      const st = u.status, info = STATUS[st.type];
      if (st.type === 'poison' || st.type === 'burn') {
        const d = Math.max(1, Math.round(u.maxHp * (st.type === 'poison' ? .08 : .06)));
        u.hp = Math.max(0, u.hp - d);
        hitFx(u.sk, d, false, 'stdmg');
        await say(`${u.name}は${info.n}で ${d} のダメージ！`, 'st');
      }
      if (u.hp > 0) {
        st.turns--;
        if (st.turns <= 0) { u.status = null; await say(`${u.name}の${info.n}が治った！`, 'heal'); }
      }
    }
    if (u.hp > 0 && u.passive.key === 'regen' && u.hp < u.maxHp) {
      const h = heal(u, Math.round(u.maxHp * .06));
      if (h) await say(`${u.name}は【森の恵み】でHPが ${h} 回復！`, 'heal', 460);
    }
  }
}

async function chooseSwitch(alive) {
  const html = `<h2 class="h2">次に出すキャラを選択</h2><p class="sub" style="margin-top:6px">倒れた仲間の意志を継げ！</p>
    <div class="swlist">${alive.map(([u, i]) =>
      `<button data-v="${i}">${avaHTML(u)}<div style="flex:1"><span class="rb r-${u.rar}">${u.rar}</span> <b>${u.name}</b>
        <div style="font-size:12px;color:var(--mute);margin-top:2px">HP ${u.hp}/${u.maxHp}　${u.moves.map(m => HAND[m.hand].e).join(' ')}</div>
        <div style="font-size:11px;color:var(--accent2)">【${u.passive.name}】${u.passive.desc}</div></div></button>`).join('')}</div>`;
  const v = await modal(html, false);
  return +v;
}

async function checkFaints() {
  for (const side of [S.E, S.P]) {
    const u = act(side);
    if (u.hp <= 0 && !u.fainted) {
      u.fainted = true;
      $(`#${u.sk}Sprite`).classList.add('faint');
      await say(`${side.isPlayer ? '' : '相手の'}${u.name}は倒れた！`, 'ko', 800);
    }
  }
  const pA = S.P.units.some(u => u.hp > 0), eA = S.E.units.some(u => u.hp > 0);
  if (!pA || !eA) {
    await sleep(700 / S.speed);
    showResult(pA ? 'win' : (eA ? 'lose' : 'draw'));
    return false;
  }
  if (act(S.E).fainted) {
    S.E.idx = S.E.units.findIndex(u => u.hp > 0);
    renderBattle();
    restartClass($('#eSprite'), 'enter');
    await say(`相手は ${act(S.E).name} を繰り出した！`, 'sys', 650);
  }
  if (act(S.P).fainted) {
    const alive = S.P.units.map((u, i) => [u, i]).filter(([u]) => u.hp > 0);
    const idx = alive.length === 1 ? alive[0][1] : await chooseSwitch(alive);
    S.P.idx = idx;
    renderBattle();
    restartClass($('#pSprite'), 'enter');
    await say(`行け！ ${act(S.P).name}！`, 'sys', 650);
  }
  return true;
}

async function doTurn(pi) {
  if (S.busy) return;
  const P = act(S.P);
  if (pi === P.lastSlot) return;
  S.busy = true;
  const selItem = S.selItem;
  S.selItem = null;
  renderControls();

  const E = act(S.E);
  const ei = cpuChoose(E, P);
  const eItem = cpuItem(S.E, E);

  $('#turnLabel').textContent = `TURN ${S.turn}`;
  log(`━━ TURN ${S.turn} ━━`, 'turn');

  if (selItem) await useItem(S.P, P, selItem);
  if (eItem) await useItem(S.E, E, eItem);

  await resolveTurn(pi, ei);
  P.lastSlot = pi;
  E.lastSlot = ei;
  await endOfTurn();
  P.flags = {}; E.flags = {};

  const cont = await checkFaints();
  if (!cont) return;
  S.turn++;
  $('#turnLabel').textContent = `TURN ${S.turn}`;
  await sleep(250 / S.speed);
  resetClash();
  S.busy = false;
  renderBattle();
}

/* =========================================================
   バトル開始・結果
========================================================= */
async function startBattle() {
  const ids = [];
  S.enemyTeam = [];
  for (let i = 0; i < 3; i++) { const c = drawOne(ids); ids.push(c.id); S.enemyTeam.push(c); }
  S.enemyTeam = shuffle(S.enemyTeam);

  await modal(`<h2 class="h2">⚔️ 相手チーム出現！</h2><p class="sub" style="margin-top:6px">相手もガチャで3体を揃えてきた！</p>
    <div class="enemyrow">${S.enemyTeam.map(c => miniCard(c)).join('')}</div>
    <button class="btn primary" data-v="go">いざ、勝負！</button>`, false);

  S.P = { isPlayer: true, units: S.team.map(c => makeUnit(c, 'p')), idx: 0, items: { power: ITEM_COUNT, guard: ITEM_COUNT, heal: ITEM_COUNT } };
  S.E = { isPlayer: false, units: S.enemyTeam.map(c => makeUnit(c, 'e')), idx: 0, items: { power: ITEM_COUNT, guard: ITEM_COUNT, heal: ITEM_COUNT } };
  S.turn = 1; S.selItem = null; S.busy = true;
  $('#log').innerHTML = '';
  $('#pSprite').dataset.uid = ''; $('#eSprite').dataset.uid = '';
  $('#turnLabel').textContent = 'TURN 1';
  resetClash();
  show('battle');
  renderBattle();
  restartClass($('#eSprite'), 'enter');
  restartClass($('#pSprite'), 'enter');
  await say(`相手の ${act(S.E).name} が現れた！`, 'sys', 650);
  await say(`行け！ ${act(S.P).name}！`, 'sys', 500);
  S.busy = false;
  renderBattle();
}

function showResult(kind) {
  const t = $('#rTitle');
  t.className = 'rbig ' + kind;
  t.textContent = kind === 'win' ? '勝利！' : kind === 'lose' ? '敗北…' : '引き分け';
  const alive = S.P.units.filter(u => u.hp > 0).length;
  $('#rSub').innerHTML = kind === 'win'
    ? `見事な読み合いだった！<br>${S.turn}ターンで勝利（生存 ${alive}体）`
    : kind === 'lose' ? `${S.turn}ターン目に力尽きた…<br>次のガチャで再挑戦だ！` : '両軍、全滅…！';
  $('#rTeam').innerHTML = S.P.units.map(u => `<span class="${u.hp <= 0 ? 'dead' : ''}">${u.em}</span>`).join('');
  S.busy = false;
  show('result');
}

function resetGame() {
  S.pulls = []; S.team = []; S.P = null; S.E = null; S.selItem = null; S.busy = false;
  buildDome(); renderSlots();
  $('#capsule').className = 'capsule';
  show('gacha');
}

/* =========================================================
   イベント
========================================================= */
$('#startBtn').addEventListener('click', resetGame);
$('#pullBtn').addEventListener('click', onPull);
$('#battleBtn').addEventListener('click', () => { if (S.team.length === 3) startBattle(); });
$('#againBtn').addEventListener('click', resetGame);
$('#toTitleBtn').addEventListener('click', () => show('title'));
document.querySelectorAll('[data-rules]').forEach(b => b.addEventListener('click', () => modal(rulesHTML())));

$('#moves').addEventListener('click', e => {
  const b = e.target.closest('.mv');
  if (!b || b.disabled) return;
  doTurn(+b.dataset.i);
});
$('#items').addEventListener('click', e => {
  const b = e.target.closest('.itb');
  if (!b || b.disabled || S.busy) return;
  const k = b.dataset.k;
  S.selItem = S.selItem === k ? null : k;
  renderControls();
});
$('#speedBtn').addEventListener('click', () => {
  S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  $('#speedBtn').textContent = `⏩ 速度 x${S.speed}`;
});
['p', 'e'].forEach(sk => {
  $(`#${sk}Sprite`).addEventListener('click', () => {
    if (!S.P || !S.E || $('#modal').classList.contains('open')) return;
    const u = act(sk === 'p' ? S.P : S.E);
    modal(cardHTML(u) + `<p class="sub" style="margin-top:8px">現在HP ${u.hp} / ${u.maxHp}</p><button class="btn" data-v="ok">閉じる</button>`);
  });
});

buildDome();
renderSlots();
</script>
</body>
</html>
