<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pig of Potato - 海戦MMORPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a1a2e; color: #fff; overflow: hidden; height: 100dvh; width: 100vw; position: fixed; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #226089, #112233); z-index: 10; overflow: hidden; }
        .hidden { display: none !important; }

        .lobby-box { background: rgba(0, 0, 0, 0.85); padding: 25px; border-radius: 16px; border: 3px solid #f39c12; width: 420px; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .lobby-box h1 { color: #f39c12; font-size: 2rem; margin-bottom: 8px; text-shadow: 2px 2px #000; }
        .lobby-box p { color: #bdc3c7; margin-bottom: 15px; font-size: 0.9rem; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; color: #f1c40f; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #34495e; color: #fff; font-size: 1rem; }
        .btn { background: #e74c3c; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; transition: 0.2s; box-shadow: 0 4px #c0392b; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px #c0392b; }
        .btn-green { background: #2ecc71; box-shadow: 0 4px #27ae60; }
        .btn-green:active { box-shadow: 0 1px #27ae60; }
        
        #previewCanvas { width: 70px; height: 70px; background: #2c3e50; border-radius: 50%; margin: 5px auto; display: block; border: 2px solid #fff; }

        #gameCanvas { display: block; width: 100vw; height: 100dvh; background: #2980b9; }
        .hud-top { position: absolute; top: 15px; left: 15px; display: flex; gap: 15px; z-index: 5; pointer-events: none; }
        .hud-card { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; border: 2px solid #f39c12; font-size: 0.9rem; }
        
        #promptBox { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 3px solid #2ecc71; padding: 12px 24px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; z-index: 8; text-align: center; cursor: pointer; display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); } }

        #minimapCanvas { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.6); border: 3px solid #fff; border-radius: 12px; z-index: 5; }

        .hud-bottom-controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 8px; z-index: 5; }
        .control-btn { background: rgba(0,0,0,0.7); border: 2px solid #fff; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .control-btn.active { border-color: #f1c40f; color: #f1c40f; }

        #portModal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,30,0.95); border: 4px solid #f39c12; padding: 25px; border-radius: 16px; width: 380px; z-index: 20; display: none; text-align: center; }
        #portModal h2 { color: #f39c12; margin-bottom: 12px; }
        #portModal button { margin: 6px 0; width: 100%; }

        #warningBanner { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(231, 76, 60, 0.9); color: #fff; padding: 8px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; z-index: 6; display: none; }
    </style>
</head>
<body tabindex="0">

    <div id="lobbyScreen" class="screen">
        <div class="lobby-box">
            <h1>🐷 Pig of Potato</h1>
            <p>大海原を駆け抜けろ！オープンワールド海戦MMORPG</p>
            
            <canvas id="previewCanvas" width="70" height="70"></canvas>

            <div class="form-group">
                <label>船長名 (豚の名前)</label>
                <input type="text" id="captainName" value="ポテト海賊団長" maxlength="12">
            </div>
            
            <div class="form-group">
                <label>ルームコード (4桁)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="roomCodeInput" value="1234" maxlength="4">
                    <button class="btn" style="margin-top:0; width:110px;" onclick="randomRoom()">🎲 乱数</button>
                </div>
            </div>

            <div class="form-group">
                <label>豚の体色</label>
                <input type="color" id="pigColorInput" value="#ff99bb" style="height: 35px; cursor: pointer;">
            </div>

            <div class="form-group">
                <label>ゲームモード</label>
                <select id="gameModeSelect">
                    <option value="multi">オープンワールド（マルチプレイ）</option>
                    <option value="cpu">🤖 敵海賊船討伐モード（CPU戦）</option>
                </select>
            </div>

            <button class="btn btn-green" onclick="joinGame()">出航する！</button>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden" style="justify-content: flex-start; align-items: flex-start;">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud-top">
            <div class="hud-card" id="hudCoins">💰 コイン: 100</div>
            <div class="hud-card" id="hudWood">🪵 木材: 0</div>
            <div class="hud-card" id="hudHp">❤️ 船HP: 100 / 100</div>
        </div>

        <div id="warningBanner">⚠️ 海賊船が接近中！</div>

        <div id="promptBox" onclick="triggerPromptAction()">【Eキー または タップ】舵を取る</div>

        <div class="hud-bottom-controls">
            <button class="control-btn active" id="ammo1" onclick="setAmmo(1)">1: 通常</button>
            <button class="control-btn" id="ammo2" onclick="setAmmo(2)">2: 爆発</button>
            <button class="control-btn" id="ammo3" onclick="setAmmo(3)">3: 特製</button>
            <button class="control-btn" style="background:#e67e22;" onclick="repairShip()">🔧 修理 (R)</button>
        </div>

        <canvas id="minimapCanvas" width="150" height="150"></canvas>
    </div>

    <div id="portModal">
        <h2>🥔 ポテト港町</h2>
        <p>ここでは木材の売却や船のアップグレードが行えます。</p>
        <button class="btn" onclick="portAction('sell_wood')">木材を全て売却 (15G/個)</button>
        <button class="btn" onclick="portAction('upgrade_speed')">船速アップ (50G〜)</button>
        <button class="btn" onclick="portAction('upgrade_hp')">船体最大HPアップ (100G)</button>
        <button class="btn btn-green" onclick="closePortModal()">港を出る</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const promptBox = document.getElementById('promptBox');
        const portModal = document.getElementById('portModal');
        const warningBanner = document.getElementById('warningBanner');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        const keys = { w: false, a: false, s: false, d: false };
        let gameState = null;
        let myId = null;
        let promptState = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawPigPreview() {
            const color = document.getElementById('pigColorInput').value;
            previewCtx.clearRect(0, 0, 70, 70);
            previewCtx.fillStyle = color;
            previewCtx.beginPath();
            previewCtx.arc(35, 35, 20, 0, Math.PI * 2);
            previewCtx.fill();
            previewCtx.lineWidth = 2;
            previewCtx.strokeStyle = '#000';
            previewCtx.stroke();

            previewCtx.beginPath();
            previewCtx.arc(23, 20, 7, 0, Math.PI * 2);
            previewCtx.arc(47, 20, 7, 0, Math.PI * 2);
            previewCtx.fillStyle = color;
            previewCtx.fill();
            previewCtx.stroke();

            previewCtx.fillStyle = '#ff77aa';
            previewCtx.beginPath();
            previewCtx.ellipse(35, 38, 7, 4, 0, 0, Math.PI * 2);
            previewCtx.fill();
            previewCtx.stroke();
        }
        document.getElementById('pigColorInput').addEventListener('input', drawPigPreview);
        drawPigPreview();

        function randomRoom() {
            document.getElementById('roomCodeInput').value = Math.floor(1000 + Math.random() * 9000);
        }

        function joinGame() {
            const name = document.getElementById('captainName').value;
            const roomCode = document.getElementById('roomCodeInput').value;
            const color = document.getElementById('pigColorInput').value;
            const mode = document.getElementById('gameModeSelect').value;

            if (!roomCode || roomCode.length !== 4) {
                alert('4桁のルームコードを入力してください。');
                return;
            }

            socket.emit('join_room', { roomCode, name, color, mode });
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            canvas.focus();
        }

        socket.on('connect', () => {
            myId = socket.id;
        });

        socket.on('game_update', (data) => {
            gameState = data;
            checkPrompts();
            updateHUD();
        });

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            const code = e.code;
            const key = e.key.toLowerCase();

            if (code === 'KeyW' || key === 'w' || key === 'arrowup') keys.w = isDown;
            if (code === 'KeyS' || key === 's' || key === 'arrowdown') keys.s = isDown;
            if (code === 'KeyA' || key === 'a' || key === 'arrowleft') keys.a = isDown;
            if (code === 'KeyD' || key === 'd' || key === 'arrowright') keys.d = isDown;

            if (isDown) {
                if (code === 'KeyE' || key === 'e') executePromptAction();
                if (code === 'KeyR' || key === 'r') repairShip();
                if (code === 'KeyK' || key === 'k') socket.emit('fire_cannons', 'left');
                if (code === 'KeyO' || key === 'o') socket.emit('fire_cannons', 'right');
            }
        }

        setInterval(() => {
            if (!gameScreen.classList.contains('hidden')) {
                socket.emit('player_input', keys);
            }
        }, 1000 / 60);

        function checkPrompts() {
            if (!gameState || !gameState.players[myId]) return;
            const player = gameState.players[myId];
            const ship = gameState.ships[player.shipId];

            if (player.isSteering) {
                promptState = 'unsteer';
                promptBox.innerText = '【Eキー または タップ】舵を降りる';
                promptBox.style.display = 'block';
                return;
            }

            if (ship) {
                const distToShip = Math.hypot(player.x - ship.x, player.y - ship.y);
                if (distToShip < 100) {
                    promptState = 'steer';
                    promptBox.innerText = '【Eキー または タップ】舵を取る';
                    promptBox.style.display = 'block';
                    return;
                }
            }

            const port = gameState.islands.find(i => i.type === 'port');
            if (port && Math.hypot(player.x - port.x, player.y - port.y) < port.radius + 50) {
                promptState = 'port';
                promptBox.innerText = '【Eキー または タップ】ポテト港町に入る';
                promptBox.style.display = 'block';
                return;
            }

            let nearRes = gameState.resources.find(r => r.active && Math.hypot(player.x - r.x, player.y - r.y) < 80);
            if (nearRes) {
                promptState = 'resource';
                promptBox.innerText = '【Eキー または タップ】木材を採取する';
                promptBox.style.display = 'block';
                return;
            }

            promptState = null;
            promptBox.style.display = 'none';
        }

        function triggerPromptAction() { executePromptAction(); }

        function executePromptAction() {
            if (promptState === 'steer' || promptState === 'unsteer') {
                socket.emit('toggle_steer');
            } else if (promptState === 'resource') {
                socket.emit('gather_resource');
            } else if (promptState === 'port') {
                portModal.style.display = 'block';
            }
        }

        function closePortModal() { portModal.style.display = 'none'; }
        function portAction(action) { socket.emit('port_action', action); }
        function repairShip() { socket.emit('repair_ship'); }

        function setAmmo(type) {
            socket.emit('change_ammo', type);
            document.querySelectorAll('.hud-bottom-controls .control-btn').forEach((btn, idx) => {
                if (idx < 3) btn.classList.toggle('active', idx + 1 === type);
            });
        }

        function updateHUD() {
            if (!gameState || !gameState.players[myId]) return;
            const player = gameState.players[myId];
            const ship = gameState.ships[player.shipId];

            document.getElementById('hudCoins').innerText = `💰 コイン: ${player.coins}`;
            document.getElementById('hudWood').innerText = `🪵 木材: ${player.wood}`;
            if (ship) {
                document.getElementById('hudHp').innerText = `❤️ 船HP: ${Math.max(0, Math.floor(ship.hp))} / ${ship.maxHp}`;
            }

            let warning = false;
            if (ship && gameState.enemies) {
                gameState.enemies.forEach(e => {
                    if (Math.hypot(e.x - ship.x, e.y - ship.y) < 600) warning = true;
                });
            }
            warningBanner.style.display = warning ? 'block' : 'none';
        }

        function render() {
            requestAnimationFrame(render);
            if (!gameState || !gameState.players[myId]) return;

            const player = gameState.players[myId];
            const ship = gameState.ships[player.shipId];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const camX = ship ? ship.x : player.x;
            const camY = ship ? ship.y : player.y;
            ctx.translate(canvas.width / 2 - camX, canvas.height / 2 - camY);

            ctx.fillStyle = '#2980b9';
            ctx.fillRect(0, 0, 4000, 4000);

            gameState.islands.forEach(island => {
                ctx.fillStyle = island.type === 'port' ? '#e67e22' : '#27ae60';
                ctx.beginPath();
                ctx.arc(island.x, island.y, island.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#d35400';
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(island.name, island.x, island.y - island.radius - 10);
            });

            gameState.resources.forEach(res => {
                if (!res.active) return;
                ctx.fillStyle = '#8e44ad';
                ctx.beginPath();
                ctx.arc(res.x, res.y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.fillText('🪵', res.x, res.y + 4);
            });

            for (const sId in gameState.ships) {
                const s = gameState.ships[sId];
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);

                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-35, -20, 70, 40);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.strokeRect(-35, -20, 70, 40);

                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(25, -10, 15, 20);

                ctx.restore();
            }

            if (gameState.enemies) {
                gameState.enemies.forEach(enemy => {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    ctx.rotate(enemy.angle);
                    ctx.fillStyle = '#c0392b';
                    ctx.beginPath();
                    ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                    ctx.restore();

                    ctx.fillStyle = 'red';
                    ctx.fillRect(enemy.x - 30, enemy.y - 55, 60, 6);
                    ctx.fillStyle = 'green';
                    ctx.fillRect(enemy.x - 30, enemy.y - 55, 60 * (enemy.hp / enemy.maxHp), 6);
                });
            }

            for (const pId in gameState.players) {
                const p = gameState.players[pId];
                if (p.isSteering) continue;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                ctx.fillStyle = '#ff77aa';
                ctx.beginPath();
                ctx.ellipse(10, 0, 5, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 24);
            }

            if (gameState.projectiles) {
                gameState.projectiles.forEach(proj => {
                    ctx.fillStyle = proj.ammoType === 2 ? '#e74c3c' : (proj.ammoType === 3 ? '#f1c40f' : '#333');
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            ctx.restore();
            renderMinimap(player, ship);
        }

        function renderMinimap(player, ship) {
            minimapCtx.clearRect(0, 0, 150, 150);
            const scale = 150 / 4000;

            gameState.islands.forEach(island => {
                minimapCtx.fillStyle = island.type === 'port' ? '#e67e22' : '#27ae60';
                minimapCtx.beginPath();
                minimapCtx.arc(island.x * scale, island.y * scale, island.radius * scale, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            gameState.resources.forEach(res => {
                if (!res.active) return;
                minimapCtx.fillStyle = '#8e44ad';
                minimapCtx.fillRect(res.x * scale - 2, res.y * scale - 2, 4, 4);
            });

            if (gameState.enemies) {
                gameState.enemies.forEach(e => {
                    minimapCtx.fillStyle = '#e74c3c';
                    minimapCtx.beginPath();
                    minimapCtx.arc(e.x * scale, e.y * scale, 4, 0, Math.PI * 2);
                    minimapCtx.fill();
                });
            }

            if (player) {
                minimapCtx.fillStyle = '#2ecc71';
                minimapCtx.beginPath();
                minimapCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
