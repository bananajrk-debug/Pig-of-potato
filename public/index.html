<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2D 射線切り戦車バトル</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #ui {
      margin-bottom: 10px;
      font-size: 14px;
      background: #2b2b2b;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #444;
    }
    canvas {
      background: #222;
      border: 3px solid #555;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div id="ui">
    HP: <span id="hp" style="color: #ff5555; font-weight: bold;">100</span> | 
    スコア: <span id="score" style="color: #55ff55; font-weight: bold;">0</span> 
    <span style="margin-left: 10px; color: #aaa;">[W/S]前後進 [A/D]旋回 [K]射撃(壁1回バウンド)</span>
  </div>
  <canvas id="gameCanvas" width="480" height="720"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 40;
    const TANK_SIZE = 30;
    const BULLET_RADIUS = 8;
    const ZOOM = 1.8; // 画面ズーム倍率

    const MAP_WIDTH = 480;
    const MAP_HEIGHT = 720;

    let keys = {
      forward: false,
      backward: false,
      turnLeft: false,
      turnRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.forward = true;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.backward = true;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.turnLeft = true;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.turnRight = true;

      // Kキーで射撃
      if (['k', 'K'].includes(e.key)) {
        if (!e.repeat) {
          socket.emit('shoot');
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.forward = false;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.backward = false;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.turnLeft = false;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.turnRight = false;
    });

    let currentState = { players: {}, bullets: [], obstacles: [] };

    socket.on('state', (state) => {
      currentState = state;

      if (state.players[socket.id]) {
        const p = state.players[socket.id];
        document.getElementById('hp').innerText = p.hp;
        document.getElementById('score').innerText = p.score;

        socket.emit('input', keys);
      }

      draw();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();

      // --- カメラ追従＆ズーム処理 ---
      const self = currentState.players[socket.id];
      if (self) {
        // 自機の中心位置
        const selfCenterX = self.x + TANK_SIZE / 2;
        const selfCenterY = self.y + TANK_SIZE / 2;

        // 画面中央に自機を合わせるためのオフセット計算（マップ端でのはみ出し防止クランプ付き）
        let camX = canvas.width / 2 - selfCenterX * ZOOM;
        let camY = canvas.height / 2 - selfCenterY * ZOOM;

        const minX = canvas.width - MAP_WIDTH * ZOOM;
        const minY = canvas.height - MAP_HEIGHT * ZOOM;
        camX = Math.min(0, Math.max(minX, camX));
        camY = Math.min(0, Math.max(minY, camY));

        ctx.translate(camX, camY);
        ctx.scale(ZOOM, ZOOM);
      }
      // ----------------------------

      // グリッド線
      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1;
      for (let x = 0; x <= MAP_WIDTH; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y <= MAP_HEIGHT; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
      }

      // 障害物（ブロック）
      ctx.fillStyle = '#555';
      ctx.strokeStyle = '#777';
      currentState.obstacles.forEach(obs => {
        const ox = obs.x * TILE_SIZE;
        const oy = obs.y * TILE_SIZE;
        ctx.fillRect(ox, oy, TILE_SIZE, TILE_SIZE);
        ctx.strokeRect(ox, oy, TILE_SIZE, TILE_SIZE);
      });

      // 弾
      ctx.fillStyle = '#ffcc00';
      currentState.bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      });

      // プレイヤー（戦車）
      for (let id in currentState.players) {
        const p = currentState.players[id];
        const isSelf = id === socket.id;

        ctx.save();
        ctx.translate(p.x + TANK_SIZE / 2, p.y + TANK_SIZE / 2);
        ctx.rotate(p.bodyAngle);

        // 戦車ボディ
        ctx.fillStyle = isSelf ? '#3b82f6' : '#ef4444'; // 自機：青、敵：赤
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
        
        // キャタピラ
        ctx.fillStyle = '#111';
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, 5);
        ctx.fillRect(-TANK_SIZE / 2, TANK_SIZE / 2 - 5, TANK_SIZE, 5);

        // 正面の目印（矢印）＆一体化した砲身
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(0, -4, 22, 8); // 砲身

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(TANK_SIZE / 2, -6);
        ctx.lineTo(TANK_SIZE / 2 + 8, 0);
        ctx.lineTo(TANK_SIZE / 2, 6);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
    }
  </script>
</body>
</html>
