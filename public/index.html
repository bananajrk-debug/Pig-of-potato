<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Airplane Werewolf</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0b12; font-family: sans-serif; color: white; user-select: none; }
        #titleScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a1a3a 0%, #0d0d15 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        #titleScreen h1 { font-size: 52px; color: #ff4757; margin-bottom: 10px; }
        #titleScreen button {
            padding: 15px 35px; font-size: 20px; background: #ff4757; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        #titleScreen button:hover { background: #ff6b81; }

        #taskModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75); z-index: 80; justify-content: center; align-items: center;
        }
        .task-box {
            background: #222233; border: 2px solid #555; padding: 30px; border-radius: 12px;
            width: 420px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        #meetingScreen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center;
        }
        .meeting-container {
            background: #1f1f2e; padding: 25px; border-radius: 12px; width: 850px; height: 520px;
            display: flex; gap: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="titleScreen">
        <h1>Airplane Werewolf</h1>
        <p>コンパクトで臨場感のある宇宙船サバイバル</p>
        <button onclick="startGame()">ゲームスタート</button>
    </div>

    <canvas id="gameCanvas" style="display:none;"></canvas>

    <div id="taskModal">
        <div class="task-box">
            <h2 id="taskTitle">タスク名</h2>
            <p>緑色の範囲にバーがある時に <span style="color:#f1c40f; font-weight:bold;">K</span> キーを押せ！</p>
            <p id="taskScoreText" style="font-size: 14px; color: #2ed573; margin-bottom: 5px;">成功回数: 0 / 3</p>
            
            <div style="background: #111; border-radius: 6px; height: 35px; width: 100%; margin: 20px 0; position: relative; overflow: hidden; border: 1px solid #444;">
                <div id="taskTargetZone" style="position: absolute; top: 0; left: 60%; width: 20%; height: 100%; background: rgba(46, 213, 115, 0.4); border-left: 2px dashed #2ed573; border-right: 2px dashed #2ed573;"></div>
                <div id="taskIndicator" style="position: absolute; top: 0; left: 0%; width: 6px; height: 100%; background: #ff4757;"></div>
            </div>

            <button onclick="triggerTaskAction()" style="padding: 10px 25px; background: #2ed573; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">合わせる (K)</button>
            <br><br>
            <button onclick="closeTaskModal()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">やめる</button>
        </div>
    </div>

    <div id="meetingScreen">
        <div class="meeting-container">
            <div style="flex: 1; border-right: 1px solid #444; padding-right: 15px; display: flex; flex-direction: column;">
                <h2>会議フェーズ</h2>
                <p id="meetingReason" style="font-size: 14px; color: #f1c40f;"></p>
                <div id="playerVoteList" style="flex: 1; overflow-y: auto; margin-top: 10px;"></div>
                <button onclick="skipVote()" style="margin-top: 10px; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer;">スキップ</button>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column;">
                <h2>チャット議論</h2>
                <div id="chatLog" style="flex: 1; background: #111; border: 1px solid #444; border-radius: 6px; padding: 10px; overflow-y: auto; margin-bottom: 10px; font-size: 14px;"></div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="chatInput" placeholder="メッセージを入力..." style="flex: 1; padding: 10px; border-radius: 6px; border: none; background: #2a2a3e; color: white;" onkeydown="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer;">送信</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let myId = null;
        let players = {};
        let walls = [];
        let bodies = [];
        let tasks = [];
        let emergencyButton = { x: 1200, y: 900 };
        let isMeetingActive = false;

        let activeTask = null;
        let taskSuccessCount = 0;
        let barPosition = 0;
        let barDirection = 1;
        let taskAnimId = null;

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let playerPos = { x: 1200, y: 900 };
        const speed = 4;

        // カメラのズーム倍率（1.5倍に拡大してアモングアス感を演出）
        const zoom = 1.5;

        function startGame() {
            document.getElementById('titleScreen').style.display = 'none';
            canvas.style.display = 'block';
            requestAnimationFrame(gameLoop);
        }

        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
            walls = data.walls;
            emergencyButton = data.emergencyButton;
            tasks = data.tasks;
            if (players[myId]) {
                playerPos.x = players[myId].x;
                playerPos.y = players[myId].y;
            }
        });

        socket.on('gameStateUpdate', (data) => {
            players = data.players;
            bodies = data.bodies;
        });

        socket.on('updateGameState', (data) => {
            players = data.players;
            bodies = data.bodies;
        });

        socket.on('updateTasks', (serverTasks) => {
            tasks = serverTasks;
        });

        window.addEventListener('keydown', (e) => {
            if (isMeetingActive) return;
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.key === ' ') keys.space = true;

            if (e.key.toLowerCase() === 'r') {
                socket.emit('reportBody');
            }

            if (e.key.toLowerCase() === 'k') {
                const me = players[myId];
                if (!me || me.isDead) return;

                if (activeTask) {
                    triggerTaskAction();
                    return;
                }

                if (Math.hypot(emergencyButton.x - playerPos.x, emergencyButton.y - playerPos.y) < 80) {
                    socket.emit('emergencyMeeting');
                    return;
                }

                const closeTask = tasks.find(t => !t.completed && Math.hypot(t.x - playerPos.x, t.y - playerPos.y) < 70);
                if (closeTask && me.role === 'crew') {
                    openTaskModal(closeTask);
                    return;
                }

                if (me.role === 'wolf') {
                    for (let id in players) {
                        if (id !== myId && !players[id].isDead) {
                            if (Math.hypot(players[id].x - playerPos.x, players[id].y - playerPos.y) < 80) {
                                socket.emit('killPlayer', id);
                                break;
                            }
                        }
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === ' ') keys.space = false;
        });

        function openTaskModal(task) {
            activeTask = task;
            taskSuccessCount = 0;
            barPosition = 0;
            barDirection = 1;
            document.getElementById('taskTitle').innerText = `タスク: ${task.name}`;
            document.getElementById('taskScoreText').innerText = `成功回数: ${taskSuccessCount} / 3`;
            document.getElementById('taskModal').style.display = 'flex';

            const targetLeft = 35 + Math.random() * 30;
            const zone = document.getElementById('taskTargetZone');
            zone.style.left = targetLeft + '%';

            startTaskBarAnimation();
        }

        function startTaskBarAnimation() {
            if (taskAnimId) cancelAnimationFrame(taskAnimId);

            function animate() {
                if (!activeTask) return;
                barPosition += barDirection * 1.5;
                if (barPosition >= 100) {
                    barPosition = 100;
                    barDirection = -1;
                } else if (barPosition <= 0) {
                    barPosition = 0;
                    barDirection = 1;
                }

                document.getElementById('taskIndicator').style.left = barPosition + '%';
                taskAnimId = requestAnimationFrame(animate);
            }
            taskAnimId = requestAnimationFrame(animate);
        }

        function closeTaskModal() {
            activeTask = null;
            if (taskAnimId) cancelAnimationFrame(taskAnimId);
            document.getElementById('taskModal').style.display = 'none';
        }

        function triggerTaskAction() {
            if (!activeTask) return;
            const zone = document.getElementById('taskTargetZone');
            const targetLeft = parseFloat(zone.style.left);
            const targetWidth = 20;

            if (barPosition >= targetLeft && barPosition <= (targetLeft + targetWidth)) {
                taskSuccessCount++;
                document.getElementById('taskScoreText').innerText = `成功回数: ${taskSuccessCount} / 3`;

                if (taskSuccessCount >= 3) {
                    socket.emit('completeTask', activeTask.id);
                    closeTaskModal();
                } else {
                    const newTarget = 20 + Math.random() * 60;
                    zone.style.left = newTarget + '%';
                }
            } else {
                alert('タイミングが外れました！');
                taskSuccessCount = 0;
                document.getElementById('taskScoreText').innerText = `成功回数: ${taskSuccessCount} / 3`;
            }
        }

        socket.on('startMeeting', (data) => {
            isMeetingActive = true;
            closeTaskModal();
            document.getElementById('meetingScreen').style.display = 'flex';
            document.getElementById('meetingReason').innerText = data.reason === 'body' ? '死体が発見され、会議が始まります。' : '非常招集ボタンが押されました。';
            document.getElementById('chatLog').innerHTML = '';

            const voteListDiv = document.getElementById('playerVoteList');
            voteListDiv.innerHTML = '';
            for (let id in players) {
                const p = players[id];
                if (!p.isDead) {
                    const btn = document.createElement('button');
                    btn.innerText = `${p.name} に投票`;
                    btn.style.cssText = "display: block; width: 100%; margin-bottom: 8px; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;";
                    btn.onclick = () => votePlayer(id);
                    voteListDiv.appendChild(btn);
                }
            }
        });

        socket.on('chatMessage', (data) => {
            const chatLog = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.style.marginBottom = '6px';
            div.innerHTML = `<strong>${data.name}</strong>: ${data.text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        });

        socket.on('endMeeting', (data) => {
            isMeetingActive = false;
            document.getElementById('meetingScreen').style.display = 'none';
            players = data.players;
            if (data.exiledName) alert(`${data.exiledName} は追放されました。`);
            else alert('誰も追放されませんでした。');
        });

        socket.on('gameOver', (data) => {
            alert(data.message);
            location.reload();
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim() === '') return;
            socket.emit('chatInput', input.value); // または chatMessage
            socket.emit('chatMessage', input.value);
            input.value = '';
        }

        function votePlayer(targetId) { socket.emit('vote', targetId); alert('投票しました'); }
        function skipVote() { socket.emit('vote', 'skip'); alert('スキップしました'); }

        function checkCollision(nx, ny) {
            const radius = 20;
            for (let w of walls) {
                if (nx + radius > w.x && nx - radius < w.x + w.width &&
                    ny + radius > w.y && ny - radius < w.y + w.height) return true;
            }
            return false;
        }

        function gameLoop() {
            if (!isMeetingActive && players[myId]) {
                const me = players[myId];
                if (!me.isDead && !activeTask) {
                    let dx = 0, dy = 0;
                    if (keys.w) dy -= 1;
                    if (keys.s) dy += 1;
                    if (keys.a) dx -= 1;
                    if (keys.d) dx += 1;
                    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

                    const nextX = playerPos.x + dx * speed;
                    const nextY = playerPos.y + dy * speed;
                    if (!checkCollision(nextX, playerPos.y)) playerPos.x = nextX;
                    if (!checkCollision(playerPos.x, nextY)) playerPos.y = nextY;

                    socket.emit('playerMove', { x: playerPos.x, y: playerPos.y });
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const me = players[myId];

            ctx.save();
            // --- カメラのズームと追従処理 ---
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-playerPos.x, -playerPos.y);

            // 床
            ctx.fillStyle = '#101018';
            ctx.fillRect(0, 0, 2400, 1800);

            // 壁
            ctx.fillStyle = '#2f2f4e';
            walls.forEach(w => ctx.fillRect(w.x, w.y, w.width, w.height));

            // 非常ボタン
            ctx.fillStyle = '#ff4757';
            ctx.beginPath(); ctx.arc(emergencyButton.x, emergencyButton.y, 22, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('緊急ボタン (K)', emergencyButton.x, emergencyButton.y - 30);

            // タスク
            tasks.forEach(t => {
                ctx.fillStyle = t.completed ? '#2ed573' : '#ffa502';
                ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = '10px sans-serif';
                ctx.fillText(t.name, t.x, t.y - 16);
            });

            // 死体
            bodies.forEach(b => {
                ctx.fillStyle = b.color; ctx.globalAlpha = 0.5;
                ctx.beginPath(); ctx.ellipse(b.x, b.y, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0; ctx.fillStyle = 'white';
                ctx.fillText(`死体: ${b.name} (Rで通報)`, b.x, b.y - 18);
            });

            // プレイヤー
            for (let id in players) {
                const p = players[id];
                ctx.fillStyle = p.color; ctx.globalAlpha = p.isDead ? 0.3 : 1.0;
                ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#70a1ff'; ctx.fillRect(p.x - 3, p.y - 7, 10, 6);
                ctx.fillStyle = 'white'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(p.name + (p.role === 'wolf' && id === myId ? ' (人狼)' : ''), p.x, p.y - 24);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            // スペースキー押下時の全体マップ（ミニマップ）
            if (keys.space) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
                ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

                ctx.save();
                const mapWidth = 2400;
                const mapHeight = 1800;
                const viewW = canvas.width - 200;
                const viewH = canvas.height - 200;
                const scale = Math.min(viewW / mapWidth, viewH / mapHeight);

                const offsetX = 100 + (viewW - mapWidth * scale) / 2;
                const offsetY = 100 + (viewH - mapHeight * scale) / 2;

                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);

                ctx.fillStyle = '#101018';
                ctx.fillRect(0, 0, mapWidth, mapHeight);
                ctx.fillStyle = '#3f3f6e';
                walls.forEach(w => ctx.fillRect(w.x, w.y, w.width, w.height));

                tasks.forEach(t => {
                    ctx.fillStyle = t.completed ? '#2ed573' : '#ffa502';
                    ctx.beginPath(); ctx.arc(t.x, t.y, 22, 0, Math.PI * 2); ctx.fill();
                });

                for (let id in players) {
                    const p = players[id];
                    if (p.isDead) continue;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 30, 0, Math.PI * 2); ctx.fill();
                }

                ctx.restore();

                ctx.fillStyle = 'white';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('--- 宇宙船マップ (全体ビュー) ---', canvas.width / 2, 90);
                
                let completedCount = tasks.filter(t => t.completed).length;
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#2ed573';
                ctx.fillText(`タスク進捗: ${completedCount} / ${tasks.length}`, canvas.width / 2, canvas.height - 70);
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
