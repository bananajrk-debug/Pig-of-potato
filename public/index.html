<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2Dタスク人狼 - 本格ルームマップ</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            border: 2px solid #333;
            outline: none;
        }
        #roleBanner {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            padding: 5px 15px;
            border-radius: 4px;
            background: #222;
        }
        #taskModal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: #2a2a2a;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            z-index: 10;
        }
        #taskModal h2 {
            margin-top: 0;
            color: #ffcc00;
        }
        .bar-container {
            width: 100%;
            height: 30px;
            background: #111;
            border: 2px solid #555;
            position: relative;
            margin: 20px 0;
            border-radius: 4px;
            overflow: hidden;
        }
        .target-zone {
            position: absolute;
            left: 40%;
            width: 20%;
            height: 100%;
            background: rgba(0, 255, 0, 0.4);
            border-left: 2px dashed #0f0;
            border-right: 2px dashed #0f0;
        }
        .cursor-bar {
            position: absolute;
            top: 0;
            width: 6px;
            height: 100%;
            background: #ff3333;
        }

        #meetingModal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 450px;
            background: #1a1a1a;
            border: 4px solid #ff4444;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(255,0,0,0.5);
            z-index: 20;
            display: flex;
            flex-direction: column;
        }
        #meetingModal h2 {
            margin: 0 0 10px 0;
            color: #ff4444;
            text-align: center;
        }
        #chatLogs {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background: #222;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        #ui {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="roleBanner">役職を読み込み中...</div>

    <div id="game-container">
        <canvas id="gameCanvas" width="1100" height="750" tabindex="1"></canvas>
        
        <div id="taskModal">
            <h2>タスク: 圧力調整</h2>
            <p>緑色のエリアで <b>[K]</b> キーを押して止めろ！</p>
            <div class="bar-container">
                <div class="target-zone"></div>
                <div id="cursor" class="cursor-bar" style="left: 0%;"></div>
            </div>
            <p id="taskMessage" style="font-size: 14px; color: #aaa;"></p>
        </div>

        <div id="meetingModal" style="display: none;">
            <h2>🚨 緊急会議中 🚨</h2>
            <div id="chatLogs"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="メッセージを入力..." autocomplete="off">
                <button id="sendBtn">送信</button>
            </div>
        </div>
    </div>

    <div id="ui">
        移動: W/A/S/D | タスク: 近づいて <b>[K]</b> | <span id="killInstruction" style="display:none; color:#ff4444;">人狼: <b>[Q]</b> キル</span> | 通報: <b>[R]</b> | 緊急ボタン: 中央で <b>[E]</b>
        <div id="taskStatus">完了タスク数: 0</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.focus();
        canvas.addEventListener('click', () => canvas.focus());

        const playerSize = 30;
        let myData = { x: 535, y: 375, speed: 4 }; // 中央ホールの安全な初期位置
        let players = {};
        let myRole = 'crewmate';
        let isDead = false;
        let isMeetingActive = false;

        const keys = {};
        let isTaskActive = false;

        let cursorPosition = 0;
        let cursorSpeed = 1.5;
        let cursorDirection = 1;
        let taskInterval = null;

        window.addEventListener('keydown', (e) => {
            if (isDead || isMeetingActive) return;
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (key === 'k') {
                if (isTaskActive) {
                    judgeTaskTiming();
                } else {
                    checkTaskInteraction();
                }
            }

            if (key === 'q' && myRole === 'imposter') {
                tryKillPlayer();
            }

            if (key === 'r') {
                tryReportBody();
            }

            if (key === 'e') {
                tryPressEmergencyButton();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ========================================================
        // 部屋と通路でしっかり構築された本格マップの壁データ
        // ========================================================
        const walls = [
            // --- 外周 ---
            { x: 0, y: 0, w: 1100, h: 20 },
            { x: 0, y: 730, w: 1100, h: 20 },
            { x: 0, y: 0, w: 20, h: 750 },
            { x: 1080, y: 0, w: 20, h: 750 },

            // --- 中央ホール（カフェテリア） ---
            // 上壁（左右に通路用の隙間）
            { x: 400, y: 260, w: 100, h: 20 },
            { x: 600, y: 260, w: 100, h: 20 },
            // 下壁
            { x: 400, y: 480, w: 100, h: 20 },
            { x: 600, y: 480, w: 100, h: 20 },
            // 左壁（上下に通路用の隙間）
            { x: 400, y: 260, w: 20, h: 80 },
            { x: 400, y: 400, w: 20, h: 80 },
            // 右壁
            { x: 680, y: 260, w: 20, h: 80 },
            { x: 680, y: 400, w: 20, h: 80 },

            // --- 左上の部屋（実験室） ---
            { x: 100, y: 80, w: 220, h: 160 },
            // ※左上の部屋の右側に通路へ抜けるドア用の隙間を作るため、壁を分割配置しています
            // （上記は一塊の箱なので、ドアの隙間を開けた部屋の壁を以下で構成）
            // 実質的な部屋の壁をきれいに作るため再定義：
            // [左上ルーム] 
            { x: 80, y: 60, w: 240, h: 20 },   // 上
            { x: 80, y: 60, w: 20, h: 180 },   // 左
            { x: 80, y: 220, w: 160, h: 20 },  // 下（右側に入口の隙間 240~320 を開ける）
            { x: 300, y: 60, w: 20, h: 100 },  // 右（下側に入口の隙間 160~220 を開ける）

            // --- 右上の部屋（電気室） ---
            { x: 780, y: 60, w: 240, h: 20 },  // 上
            { x: 1000, y: 60, w: 20, h: 180 }, // 右
            { x: 860, y: 220, w: 160, h: 20 }, // 下（左側に入口の隙間を開ける）
            { x: 780, y: 60, w: 20, h: 100 },  // 左

            // --- 左下の部屋（エンジンルーム） ---
            { x: 80, y: 510, w: 160, h: 20 },  // 上（右側に入口の隙間）
            { x: 80, y: 510, w: 20, h: 160 },  // 左
            { x: 80, y: 650, w: 240, h: 20 },  // 下
            { x: 300, y: 570, w: 20, h: 100 }, // 右

            // --- 右下の部屋（セキュリティルーム） ---
            { x: 860, y: 510, w: 160, h: 20 }, // 上（左側に入口の隙間）
            { x: 1000, y: 510, w: 20, h: 160 },// 右
            { x: 780, y: 650, w: 240, h: 20 },// 下
            { x: 780, y: 570, w: 20, h: 100 },// 左

            // --- 通路を区切る壁（迷路感と死角を生み出す廊下の壁） ---
            { x: 340, y: 160, w: 20, h: 140 },
            { x: 740, y: 160, w: 20, h: 140 },
            { x: 340, y: 450, w: 20, h: 140 },
            { x: 740, y: 450, w: 20, h: 140 },
        ];

        const emergencyButton = { x: 535, y: 355, size: 30 };
        const taskPoint = { x: 180, y: 130, size: 40 }; // 左上の部屋の中にタスクを配置

        function checkCollision(x, y, w, h, walls) {
            for (let wall of walls) {
                if (
                    x < wall.x + wall.w &&
                    x + w > wall.x &&
                    y < wall.y + wall.h &&
                    y + h > wall.y
                ) {
                    return true;
                }
            }
            return false;
        }

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            if (players[socket.id]) {
                myData.x = players[socket.id].x;
                myData.y = players[socket.id].y;
                myRole = players[socket.id].role;
                isDead = players[socket.id].isDead;
                updateRoleUI();
            }
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('taskUpdate', (data) => {
            if (players[data.id]) {
                players[data.id].tasksCompleted = data.tasksCompleted;
                if (data.id === socket.id) {
                    document.getElementById('taskStatus').innerText = `完了タスク数: ${data.tasksCompleted}`;
                }
            }
        });

        socket.on('playerKilled', (data) => {
            if (players[data.targetId]) {
                players[data.targetId].isDead = true;
                if (data.targetId === socket.id) {
                    isDead = true;
                    alert('あなたは人狼にキルされてしまいました…！');
                }
            }
        });

        socket.on('startMeeting', (data) => {
            isMeetingActive = true;
            isTaskActive = false;
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('meetingModal').style.display = 'flex';
            
            const logs = document.getElementById('chatLogs');
            logs.innerHTML += `<div style="color: #ff4444; font-weight: bold; margin-bottom: 5px;">--- ${data.reason} ---</div>`;
            logs.scrollTop = logs.scrollHeight;
        });

        socket.on('chatMessage', (data) => {
            const logs = document.getElementById('chatLogs');
            const isMe = data.id === socket.id;
            logs.innerHTML += `<div style="margin-bottom: 4px;"><span style="color: ${isMe ? '#44ff44' : '#ffcc00'}; font-weight: bold;">[${data.name}]:</span> ${data.message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        });

        socket.on('disconnectPlayer', (id) => {
            delete players[id];
        });

        function updateRoleUI() {
            const banner = document.getElementById('roleBanner');
            const killInstruction = document.getElementById('killInstruction');
            if (myRole === 'imposter') {
                banner.innerText = '役職: 人狼 (インポスター) - 通路や部屋の死角を利用して市民を襲え！';
                banner.style.color = '#ff4444';
                killInstruction.style.display = 'inline';
            } else {
                banner.innerText = '役職: 市民 (クルーメイト) - 部屋を巡ってタスクを完了させろ！';
                banner.style.color = '#44ff44';
                killInstruction.style.display = 'none';
            }
        }

        function checkTaskInteraction() {
            if (myRole === 'imposter') return;
            const dist = Math.hypot(
                (myData.x + playerSize/2) - (taskPoint.x + taskPoint.size/2),
                (myData.y + playerSize/2) - (taskPoint.y + taskPoint.size/2)
            );
            if (dist < 60) {
                openTaskMinigame();
            }
        }

        function tryKillPlayer() {
            for (let id in players) {
                if (id === socket.id) continue;
                const p = players[id];
                if (!p.isDead) {
                    const dist = Math.hypot(myData.x - p.x, myData.y - p.y);
                    if (dist < 50) {
                        socket.emit('killPlayer', id);
                        break;
                    }
                }
            }
        }

        function tryReportBody() {
            for (let id in players) {
                if (id === socket.id) continue;
                const p = players[id];
                if (p.isDead) {
                    const dist = Math.hypot(myData.x - p.x, myData.y - p.y);
                    if (dist < 60) {
                        socket.emit('startMeeting', { reporterId: socket.id, reason: '死体が通報されました！' });
                        break;
                    }
                }
            }
        }

        function tryPressEmergencyButton() {
            const dist = Math.hypot(
                (myData.x + playerSize/2) - (emergencyButton.x + emergencyButton.size/2),
                (myData.y + playerSize/2) - (emergencyButton.y + emergencyButton.size/2)
            );
            if (dist < 60) {
                socket.emit('startMeeting', { reporterId: socket.id, reason: '緊急ボタンが押されました！' });
            }
        }

        function openTaskMinigame() {
            isTaskActive = true;
            cursorPosition = 0;
            cursorDirection = 1;
            document.getElementById('taskModal').style.display = 'block';
            document.getElementById('taskMessage').innerText = '';

            taskInterval = setInterval(() => {
                cursorPosition += cursorSpeed * cursorDirection;
                if (cursorPosition >= 100 || cursorPosition <= 0) {
                    cursorDirection *= -1;
                }
                document.getElementById('cursor').style.left = cursorPosition + '%';
            }, 20);
        }

        function judgeTaskTiming() {
            clearInterval(taskInterval);

            if (cursorPosition >= 40 && cursorPosition <= 60) {
                document.getElementById('taskMessage').style.color = '#0f0';
                document.getElementById('taskMessage').innerText = '大成功！';
                
                setTimeout(() => {
                    closeTaskMinigame();
                    socket.emit('completeTask');
                    // タスク位置を別の部屋にランダム移動
                    const roomPositions = [
                        {x: 180, y: 130}, // 左上
                        {x: 880, y: 130}, // 右上
                        {x: 180, y: 580}, // 左下
                        {x: 880, y: 580}  // 右下
                    ];
                    const nextRoom = roomPositions[Math.floor(Math.random() * roomPositions.length)];
                    taskPoint.x = nextRoom.x;
                    taskPoint.y = nextRoom.y;
                }, 500);
            } else {
                document.getElementById('taskMessage').style.color = '#ff3333';
                document.getElementById('taskMessage').innerText = '失敗…もう一度Kキーで再挑戦';
                
                setTimeout(() => {
                    taskInterval = setInterval(() => {
                        cursorPosition += cursorSpeed * cursorDirection;
                        if (cursorPosition >= 100 || cursorPosition <= 0) {
                            cursorDirection *= -1;
                        }
                        document.getElementById('cursor').style.left = cursorPosition + '%';
                    }, 20);
                    document.getElementById('taskMessage').innerText = '';
                }, 800);
            }
        }

        function closeTaskMinigame() {
            isTaskActive = false;
            document.getElementById('taskModal').style.display = 'none';
            canvas.focus();
        }

        document.getElementById('sendBtn').addEventListener('click', sendChatMessage);
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message) {
                socket.emit('chatMessage', { message });
                input.value = '';
            }
        }

        function update() {
            if (isTaskActive || isDead || isMeetingActive) return;

            let nextX = myData.x;
            let nextY = myData.y;

            if (keys['w'] || keys['arrowup']) nextY -= myData.speed;
            if (keys['s'] || keys['arrowdown']) nextY += myData.speed;
            if (keys['a'] || keys['arrowleft']) nextX -= myData.speed;
            if (keys['d'] || keys['arrowright']) nextX += myData.speed;

            if (!checkCollision(nextX, myData.y, playerSize, playerSize, walls)) {
                myData.x = nextX;
            }
            if (!checkCollision(myData.x, nextY, playerSize, playerSize, walls)) {
                myData.y = nextY;
            }

            if (players[socket.id]) {
                players[socket.id].x = myData.x;
                players[socket.id].y = myData.y;
            }

            socket.emit('playerMovement', { x: myData.x, y: myData.y });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. マップ・壁・部屋の描画
            ctx.fillStyle = '#444';
            for (let wall of walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            }

            // 中央ホールの床や目印、緊急会議ボタン
            ctx.fillStyle = '#ff2222';
            ctx.beginPath();
            ctx.arc(emergencyButton.x + emergencyButton.size/2, emergencyButton.y + emergencyButton.size/2, emergencyButton.size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText('EMERGENCY', emergencyButton.x - 12, emergencyButton.y - 8);

            // タスク（市民のみ）
            if (myRole !== 'imposter') {
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(taskPoint.x, taskPoint.y, taskPoint.size, taskPoint.size);
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.fillText('TASK', taskPoint.x + 5, taskPoint.y - 5);
            }

            // プレイヤーの描画
            for (let id in players) {
                const p = players[id];
                if (p.isDead) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fillRect(p.x, p.y, playerSize, playerSize);
                    ctx.fillStyle = '#ff4444';
                    ctx.font = '12px sans-serif';
                    ctx.fillText('DEAD', p.x, p.y - 5);
                } else {
                    ctx.fillStyle = p.color || '#fff';
                    ctx.fillRect(p.x, p.y, playerSize, playerSize);
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px sans-serif';
                    ctx.fillText(id === socket.id ? '自分' : id.substring(0, 4), p.x, p.y - 5);
                }
            }

            // 2. 【視野制限（ビュー暗転）のマスク処理】
            if (!isDead) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width, canvas.height);

                const centerX = myData.x + playerSize / 2;
                const centerY = myData.y + playerSize / 2;
                const visionRadius = 170; // 視界の広さ

                ctx.arc(centerX, centerY, visionRadius, 0, Math.PI * 2, true);
                ctx.fill('evenodd');
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
