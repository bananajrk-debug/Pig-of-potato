<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Airplane Werewolf 2D</title>
  <style>
    body {
      margin: 0;
      background: #1a1c23;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #gameContainer {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 3px solid #2c3e50;
    }
    canvas {
      background: #2c3e50;
      display: block;
    }
    #titleScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 900px;
      height: 600px;
      background: linear-gradient(135deg, #1e272e 0%, #2f3640 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h1 {
      font-size: 42px;
      color: #f5cd79;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    p {
      color: #dcdde1;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231,76,60,0.4);
      transition: 0.2s;
    }
    .btn:hover {
      background: #ff7675;
      transform: scale(1.03);
    }
    #ui {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
      color: #bdc3c7;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <!-- タイトル画面 -->
    <div id="titleScreen">
      <h1>AIRPLANE SURVIVAL</h1>
      <p>― 旅客機を修理し脱出しろ。紛れ込んだ人狼を暴き出せ ―</p>
      <button class="btn" id="startButton">乗機する</button>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
  </div>

  <div id="ui">
    操作: [W, A, S, D] 移動 | [K] 修理 / 襲撃 | [Space] 全体マップ確認（移動不可）<br>
    <span id="status" style="color: #f5cd79;">待機中</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const titleScreen = document.getElementById('titleScreen');
    const startButton = document.getElementById('startButton');

    const WORLD_WIDTH = 2600;
    const WORLD_HEIGHT = 1800;

    let gameStarted = false;
    let players = {};
    let tasks = [];
    let myId = null;
    let showMap = false;

    const keys = {};
    const speed = 4.2;
    const playerRadius = 16;

    // 複雑化した旅客機の壁レイアウト（部屋や通路、コックピットなどを分離）
    const walls = [
      // 外壁
      { x: 0, y: 0, w: WORLD_WIDTH, h: 40 },
      { x: 0, y: WORLD_HEIGHT - 40, w: WORLD_WIDTH, h: 40 },
      { x: 0, y: 0, w: 40, h: WORLD_HEIGHT },
      { x: WORLD_WIDTH - 40, y: 0, w: 40, h: WORLD_HEIGHT },

      // 機内の部屋・隔壁（複雑な通路構造）
      { x: 300, y: 40, w: 500, h: 280 },  // コックピット周辺
      { x: 1000, y: 40, w: 200, h: 350 }, // 中央通路仕切り
      { x: 1400, y: 40, w: 500, h: 280 }, // ファーストクラス客室
      
      { x: 300, y: 700, w: 350, h: 400 }, // 客室エリアA
      { x: 900, y: 650, w: 400, h: 200 }, // ラウンジ
      { x: 1550, y: 700, w: 350, h: 400 }, // 客室エリアB

      { x: 300, y: 1350, w: 500, h: 300 }, // 貨物室A
      { x: 1100, y: 1200, w: 200, h: 450 }, // 後部通路仕切り
      { x: 1600, y: 1350, w: 500, h: 300 }, // 貨物室B
    ];

    // 小道具（客室のシートや荷物棚、テーブルなど、自然な飛行機の内装を表現）
    const props = [
      // ファーストクラスのシート列
      { x: 1500, y: 100, w: 80, h: 40, type: 'seat' },
      { x: 1500, y: 180, w: 80, h: 40, type: 'seat' },
      { x: 1750, y: 100, w: 80, h: 40, type: 'seat' },
      { x: 1750, y: 180, w: 80, h: 40, type: 'seat' },
      // 客室Aのシート
      { x: 380, y: 780, w: 70, h: 50, type: 'seat' },
      { x: 500, y: 780, w: 70, h: 50, type: 'seat' },
      { x: 380, y: 920, w: 70, h: 50, type: 'seat' },
      { x: 500, y: 920, w: 70, h: 50, type: 'seat' },
      // ラウンジのテーブル
      { x: 1050, y: 720, w: 100, h: 60, type: 'table' }
    ];

    startButton.addEventListener('click', () => {
      titleScreen.style.display = 'none';
      gameStarted = true;
    });

    window.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      keys[e.key.toLowerCase()] = true;

      if (e.key.toLowerCase() === 'k') {
        socket.emit('action');
      }
      if (e.key === ' ') {
        showMap = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') {
        showMap = false;
      }
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('updatePlayers', (serverPlayers) => {
      for (const id in serverPlayers) {
        if (id === myId) {
          if (players[myId]) {
            players[myId].role = serverPlayers[myId].role;
            players[myId].isAlive = serverPlayers[myId].isAlive;
          } else {
            players[myId] = serverPlayers[myId];
          }
        } else {
          players[id] = serverPlayers[id];
        }
      }

      for (const id in players) {
        if (!serverPlayers[id]) delete players[id];
      }

      if (players[myId] && gameStarted) {
        const roleText = players[myId].role === 'wolf' ? '人狼 (インポスター)' : '市民 (クルー)';
        const aliveText = players[myId].isAlive ? '生存' : '死亡';
        statusDiv.innerHTML = `役割: <b style="color:${players[myId].role === 'wolf' ? '#ff6b6b' : '#1dd1a1'}">${roleText}</b> | 状態: <span style="color:${players[myId].isAlive ? '#1dd1a1' : '#ff6b6b'}">${aliveText}</span>`;
      }
    });

    socket.on('initTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('updateTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('message', (msg) => { console.log(msg.text); });

    function checkCollision(x, y, radius, rects) {
      for (let r of rects) {
        let closestX = Math.max(r.x, Math.min(x, r.x + r.w));
        let closestY = Math.max(r.y, Math.min(y, r.y + r.h));
        if (Math.hypot(x - closestX, y - closestY) < radius) return true;
      }
      return false;
    }

    function update() {
      if (!gameStarted || showMap) return;

      if (players[myId] && players[myId].isAlive) {
        let me = players[myId];
        let newX = me.x;
        let newY = me.y;
        let vx = 0, vy = 0;

        if (keys['w'] || keys['arrowup']) vy -= speed;
        if (keys['s'] || keys['arrowdown']) vy += speed;
        if (keys['a'] || keys['arrowleft']) vx -= speed;
        if (keys['d'] || keys['arrowright']) vx += speed;

        if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }

        if (vx !== 0 && !checkCollision(newX + vx, newY, playerRadius, walls)) newX += vx;
        if (vy !== 0 && !checkCollision(newX, newY + vy, playerRadius, walls)) newY += vy;

        if (newX !== me.x || newY !== me.y) {
          me.x = newX;
          me.y = newY;
          socket.emit('playerMove', { x: newX, y: newY });
        }
      }
    }

    // 自然な人間キャラクターの描画
    function drawCharacter(ctx, x, y, color, isAlive, isMe) {
      ctx.save();
      ctx.translate(x, y);

      if (!isAlive) {
        ctx.rotate(Math.PI / 3);
        ctx.globalAlpha = 0.4;
      }

      // 影
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 6;

      // 体（服を着た人間っぽく）
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 4, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2c3e50';
      ctx.stroke();

      // 頭
      ctx.fillStyle = '#f5cd79';
      ctx.beginPath();
      ctx.arc(0, -10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 自分を示すマーカー
      if (isMe && isAlive) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 19, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!gameStarted) return;

      const me = players[myId];

      if (showMap) {
        // --- 全体マップモード ---
        ctx.fillStyle = 'rgba(26, 28, 35, 0.96)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f5cd79';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('【 機内全体マップ ＆ 修理状況 】', canvas.width / 2, 45);

        const scaleX = canvas.width / WORLD_WIDTH;
        const scaleY = canvas.height / WORLD_HEIGHT;

        // 壁の描画
        ctx.fillStyle = '#34495e';
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 1.5;
        walls.forEach(w => {
          let wx = 60 + w.x * scaleX * 0.85;
          let wy = 70 + w.y * scaleY * 0.85;
          let ww = w.w * scaleX * 0.85;
          let wh = w.h * scaleY * 0.85;
          ctx.fillRect(wx, wy, ww, wh);
          ctx.strokeRect(wx, wy, ww, wh);
        });

        // タスク
        tasks.forEach((task) => {
          let tx = 60 + task.x * scaleX * 0.85;
          let ty = 70 + task.y * scaleY * 0.85;
          ctx.fillStyle = task.completed ? '#2ecc71' : '#e74c3c';
          ctx.beginPath();
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fill();
        });

        // プレイヤー
        for (const id in players) {
          let p = players[id];
          if (!p.isAlive) continue;
          let px = 60 + p.x * scaleX * 0.85;
          let py = 70 + p.y * scaleY * 0.85;
          ctx.fillStyle = (id === myId) ? '#f1c40f' : p.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#bdc3c7';
        ctx.font = '14px sans-serif';
        ctx.fillText('※ スペースキーを離すとゲームに戻ります', canvas.width / 2, canvas.height - 25);
        ctx.textAlign = 'left';
        return;
      }

      // --- 通常ゲームプレイモード ---
      let cameraX = 0, cameraY = 0;
      if (me) {
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, me.x - canvas.width / 2));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, me.y - canvas.height / 2));
      }

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // 床面（木目調または落ち着いたカーペット風ダークカラー）
      ctx.fillStyle = '#22313f';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // 床のマットグリッド
      ctx.strokeStyle = '#1e2b37';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 120) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 120) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
      }

      // 小道具（シートやテーブルなどの内装）の描画
      props.forEach(prop => {
        if (prop.type === 'seat') {
          ctx.fillStyle = '#34495e';
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = '#1abc9c';
          ctx.lineWidth = 2;
          ctx.strokeRect(prop.x, prop.y, prop.w, prop.h);
        } else if (prop.type === 'table') {
          ctx.fillStyle = '#4e5d6c';
          ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
          ctx.strokeStyle = '#2c3e50';
          ctx.lineWidth = 2;
          ctx.strokeRect(prop.x, prop.y, prop.w, prop.h);
        }
      });

      // 壁の描画
      walls.forEach(w => {
        // 壁の立体的な影
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(w.x + 5, w.y + 5, w.w, w.h);
        // 壁本体
        ctx.fillStyle = '#34495e';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        // 壁の枠線
        ctx.strokeStyle = '#1abc9c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
      });

      // タスク（修理パーツ）の描画（壁から離れた安全な位置）
      tasks.forEach((task) => {
        ctx.fillStyle = task.completed ? '#1e272e' : '#4a151b';
        ctx.fillRect(task.x - 22, task.y - 22, 44, 44);
        
        ctx.strokeStyle = task.completed ? '#2ecc71' : '#e74c3c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(task.x - 22, task.y - 22, 44, 44);

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(task.completed ? '修理済' : `要修理 #${task.id}`, task.x, task.y - 28);
        ctx.textAlign = 'left';
      });

      // プレイヤーの描画
      for (const id in players) {
        const p = players[id];
        const isMe = (id === myId);
        const drawColor = p.isAlive ? p.color : '#7f8c8d';
        
        drawCharacter(ctx, p.x, p.y, drawColor, p.isAlive, isMe);

        // ネームタグ
        ctx.fillStyle = '#ecf0f1';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isMe ? 'あなた' : 'クルー', p.x, p.y - 28);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
