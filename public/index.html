<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2Dタスク人狼（プロトタイプ）</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #444;
        }
        #ui {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        操作: W/A/S/D または 矢印キー | タスク位置に近づいて [E] キーを押す
        <div id="taskStatus">完了タスク数: 0</div>
    </div>

    <!-- Socket.ioのクライアントライブラリをCDNから読み込み -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const playerSize = 30;
        let myData = { x: 100, y: 100, speed: 4 };
        let players = {};
        let myTasksCompleted = 0;

        // キー入力の状態管理
        const keys = {};
        window.addEventListener('keydown', (e) => { 
            keys[e.key.toLowerCase()] = true; 

            // 'e'キーでタスク実行
            if (e.key.toLowerCase() === 'e') {
                checkTaskInteraction();
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // マップの壁データ (x, y, width, height)
        // ここを書き換えることで自由に部屋や通路を作れます！
        const walls = [
            { x: 0, y: 0, w: 800, h: 20 },   // 上壁
            { x: 0, y: 580, w: 800, h: 20 },  // 下壁
            { x: 0, y: 0, w: 20, h: 600 },   // 左壁
            { x: 780, y: 0, w: 20, h: 600 },  // 右壁
            // 障害物（部屋や柱など）
            { x: 200, y: 150, w: 150, h: 100 },
            { x: 450, y: 350, w: 150, h: 120 },
        ];

        // タスク位置のデータ
        const taskPoint = { x: 400, y: 100, size: 40, active: true };

        // 矩形同士の当たり判定（AABB）
        function checkCollision(x, y, w, h, walls) {
            for (let wall of walls) {
                if (
                    x < wall.x + wall.w &&
                    x + w > wall.x &&
                    y < wall.y + wall.h &&
                    y + h > wall.y
                ) {
                    return true; // 衝突している
                }
            }
            return false;
        }

        // Socket.ioイベント受信
        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
        });

        socket.on('newPlayer', (data) => {
            players[data.id] = data.player;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('taskUpdate', (data) => {
            if (players[data.id]) {
                players[data.id].tasksCompleted = data.tasksCompleted;
                if (data.id === socket.id) {
                    document.getElementById('taskStatus').innerText = `完了タスク数: ${data.tasksCompleted}`;
                }
            }
        });

        socket.on('disconnectPlayer', (id) => {
            delete players[id];
        });

        // タスクに近づいてEキーを押したときの判定
        function checkTaskInteraction() {
            // プレイヤーとタスクの距離を計算
            const dist = Math.hypot((myData.x + playerSize/2) - (taskPoint.x + taskPoint.size/2), (myData.y + playerSize/2) - (taskPoint.y + taskPoint.size/2));
            if (dist < 60) {
                alert('タスク完了！');
                socket.emit('completeTask');
                // タスク位置をランダムにワープさせる簡易演出
                taskPoint.x = Math.random() * 600 + 100;
                taskPoint.y = Math.random() * 400 + 100;
            }
        }

        // ゲームのメインループ
        function update() {
            let nextX = myData.x;
            let nextY = myData.y;

            // 移動入力の処理
            if (keys['w'] || keys['arrowup']) nextY -= myData.speed;
            if (keys['s'] || keys['arrowdown']) nextY += myData.speed;
            if (keys['a'] || keys['arrowleft']) nextX -= myData.speed;
            if (keys['d'] || keys['arrowright']) nextX += myData.speed;

            // X軸方向の当たり判定チェック
            if (!checkCollision(nextX, myData.y, playerSize, playerSize, walls)) {
                myData.x = nextX;
            }
            // Y軸方向の当たり判定チェック
            if (!checkCollision(myData.x, nextY, playerSize, playerSize, walls)) {
                myData.y = nextY;
            }

            // サーバーに自分の位置を送信
            socket.emit('playerMovement', { x: myData.x, y: myData.y });
        }

        function draw() {
            // 画面クリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 壁の描画
            ctx.fillStyle = '#666';
            for (let wall of walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            }

            // タスクポイントの描画
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(taskPoint.x, taskPoint.y, taskPoint.size, taskPoint.size);
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText('TASK', taskPoint.x + 5, taskPoint.y - 5);

            // 他のプレイヤー（自分含む）の描画
            for (let id in players) {
                const p = players[id];
                ctx.fillStyle = p.color || '#fff';
                ctx.fillRect(p.x, p.y, playerSize, playerSize);
                
                // 簡易ネームラベル（IDの一部）
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText(id.substring(0, 4), p.x, p.y - 5);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // ループ開始
        loop();
    </script>
</body>
</html>
