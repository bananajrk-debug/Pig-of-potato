<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Airplane Werewolf 2D</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: #1a1a1a;
      border: 2px solid #555;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #ui {
      margin-top: 10px;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="900" height="600"></canvas>
  <div id="ui">
    操作: [W, A, S, D] 移動 | [K] アクション(修理/キル) | [Space] 全体マップ確認<br>
    <span id="status" style="color: yellow;">接続中...</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // マップサイズ 3倍（2400 x 1800）
    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 1800;

    let players = {};
    let tasks = [];
    let myId = null;
    let showMap = false;

    const keys = {};
    const speed = 5;

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'k') {
        socket.emit('action');
      }
      if (e.key === ' ') {
        showMap = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') {
        showMap = false;
      }
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    // プレイヤー情報の同期（自分の位置は上書きせず、他人の位置だけを更新して巻き戻りを防ぐ）
    socket.on('updatePlayers', (serverPlayers) => {
      for (const id in serverPlayers) {
        if (id === myId) {
          // 自分の役割や生存フラグだけ同期し、座標(x, y)はクライアント側の滑らかな動きを優先
          if (players[myId]) {
            players[myId].role = serverPlayers[myId].role;
            players[myId].isAlive = serverPlayers[myId].isAlive;
          } else {
            players[myId] = serverPlayers[myId];
          }
        } else {
          players[id] = serverPlayers[id];
        }
      }

      // 切断されたプレイヤーを削除
      for (const id in players) {
        if (!serverPlayers[id]) {
          delete players[id];
        }
      }

      if (players[myId]) {
        const roleText = players[myId].role === 'wolf' ? '人狼 (インポスター)' : '市民 (クルー)';
        const aliveText = players[myId].isAlive ? '生存' : '死亡';
        statusDiv.innerHTML = `役割: <b>${roleText}</b> | 状態: <span style="color:${players[myId].isAlive ? '#0ff' : '#f55'}">${aliveText}</span>`;
      }
    });

    socket.on('initTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('updateTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('message', (msg) => { console.log(msg.text); });

    function update() {
      if (players[myId] && players[myId].isAlive) {
        let me = players[myId];
        let moved = false;
        let newX = me.x;
        let newY = me.y;

        if (keys['w'] || keys['arrowup']) { newY -= speed; moved = true; }
        if (keys['s'] || keys['arrowdown']) { newY += speed; moved = true; }
        if (keys['a'] || keys['arrowleft']) { newX -= speed; moved = true; }
        if (keys['d'] || keys['arrowright']) { newX += speed; moved = true; }

        if (moved) {
          newX = Math.max(20, Math.min(WORLD_WIDTH - 20, newX));
          newY = Math.max(20, Math.min(WORLD_HEIGHT - 20, newY));
          
          me.x = newX;
          me.y = newY;
          socket.emit('playerMove', { x: newX, y: newY });
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const me = players[myId];

      if (showMap) {
        // 全体マップ描画
        ctx.fillStyle = 'rgba(10, 10, 15, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('【 飛行機全体マップ ＆ パーツ状況 】', canvas.width / 2 - 160, 40);

        const scaleX = canvas.width / WORLD_WIDTH;
        const scaleY = canvas.height / WORLD_HEIGHT;

        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(50, 60, WORLD_WIDTH * scaleX * 0.8, WORLD_HEIGHT * scaleY * 0.8);

        tasks.forEach((task) => {
          let tx = 50 + task.x * scaleX * 0.8;
          let ty = 60 + task.y * scaleY * 0.8;
          ctx.fillStyle = task.completed ? '#0f0' : '#f00';
          ctx.beginPath();
          ctx.arc(tx, ty, 6, 0, Math.PI * 2);
          ctx.fill();
        });

        for (const id in players) {
          let p = players[id];
          if (!p.isAlive) continue;
          let px = 50 + p.x * scaleX * 0.8;
          let py = 60 + p.y * scaleY * 0.8;
          ctx.fillStyle = (id === myId) ? '#ff0' : p.color;
          ctx.beginPath();
          ctx.arc(px, py, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }

      // カメラ追従
      let cameraX = 0;
      let cameraY = 0;
      if (me) {
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, me.x - canvas.width / 2));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, me.y - canvas.height / 2));
      }

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // 床とグリッド
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 200) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 200) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
      }

      // タスク
      tasks.forEach((task) => {
        ctx.fillStyle = task.completed ? '#00ffcc' : '#ff4444';
        ctx.fillRect(task.x - 25, task.y - 25, 50, 50);
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.fillText(`パーツ #${task.id} (${task.completed ? '完了' : '未修理'})`, task.x - 50, task.y - 35);
      });

      // プレイヤー
      for (const id in players) {
        const p = players[id];
        ctx.fillStyle = p.isAlive ? p.color : '#555';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fill();

        if (id === myId) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(id === myId ? 'あなた' : 'プレイヤー', p.x - 22, p.y - 28);
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
