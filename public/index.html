<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Airplane Werewolf 2D</title>
  <style>
    body {
      margin: 0;
      background: #111318;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #gameContainer {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 3px solid #2c3e50;
    }
    canvas {
      background: #1a252f;
      display: block;
    }
    #titleScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 900px;
      height: 600px;
      background: linear-gradient(135deg, #151b22 0%, #222f3e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h1 {
      font-size: 42px;
      color: #f1c40f;
      margin-bottom: 10px;
    }
    p {
      color: #b2bec3;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231,76,60,0.4);
      transition: 0.2s;
    }
    .btn:hover {
      background: #ff7675;
      transform: scale(1.03);
    }
    #ui {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
      color: #b2bec3;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <!-- タイトル画面 -->
    <div id="titleScreen">
      <h1>AIRPLANE SURVIVAL</h1>
      <p>― 旅客機を修理し脱出しろ。潜む人狼を見つけ出せ ―</p>
      <button class="btn" id="startButton">搭乗する</button>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
  </div>

  <div id="ui">
    操作: [W, A, S, D] 移動 | [K] 修理 / 襲撃 | [Space] 全体マップ確認（移動不可）<br>
    <span id="status" style="color: #f1c40f;">待機中</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const titleScreen = document.getElementById('titleScreen');
    const startButton = document.getElementById('startButton');

    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 1600;

    let gameStarted = false;
    let players = {};
    let tasks = [];
    let myId = null;
    let showMap = false;

    const keys = {};
    const speed = 4.2;
    const playerRadius = 15;

    // プレイヤーが挟まらないよう、間に十分な通路幅（廊下）を確保した壁データ
    const walls = [
      // 上部ルーム
      { x: 800, y: 300, w: 400, h: 250 },
      { x: 1800, y: 300, w: 400, h: 250 },
      // 下部ルーム
      { x: 800, y: 950, w: 400, h: 250 },
      { x: 1800, y: 950, w: 400, h: 250 }
    ];

    const props = [
      { x: 950, y: 380, w: 100, h: 60, type: 'seat' },
      { x: 1950, y: 380, w: 100, h: 60, type: 'seat' },
      { x: 950, y: 1030, w: 100, h: 60, type: 'seat' },
      { x: 1950, y: 1030, w: 100, h: 60, type: 'seat' }
    ];

    startButton.addEventListener('click', () => {
      titleScreen.style.display = 'none';
      gameStarted = true;
    });

    window.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      keys[e.key.toLowerCase()] = true;

      if (e.key.toLowerCase() === 'k') {
        socket.emit('action');
      }
      if (e.key === ' ') {
        showMap = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') {
        showMap = false;
      }
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('updatePlayers', (serverPlayers) => {
      for (const id in serverPlayers) {
        if (id === myId) {
          if (players[myId]) {
            players[myId].role = serverPlayers[myId].role;
            players[myId].isAlive = serverPlayers[myId].isAlive;
          } else {
            players[myId] = serverPlayers[myId];
          }
        } else {
          players[id] = serverPlayers[id];
        }
      }

      for (const id in players) {
        if (!serverPlayers[id]) delete players[id];
      }

      if (players[myId] && gameStarted) {
        const roleText = players[myId].role === 'wolf' ? '人狼 (インポスター)' : '市民 (クルー)';
        const aliveText = players[myId].isAlive ? '生存' : '死亡';
        statusDiv.innerHTML = `役割: <b style="color:${players[myId].role === 'wolf' ? '#ff6b6b' : '#1dd1a1'}">${roleText}</b> | 状態: <span style="color:${players[myId].isAlive ? '#1dd1a1' : '#ff6b6b'}">${aliveText}</span>`;
      }
    });

    socket.on('initTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('updateTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('message', (msg) => { console.log(msg.text); });

    function checkCollision(x, y, radius, rects) {
      for (let r of rects) {
        let closestX = Math.max(r.x, Math.min(x, r.x + r.w));
        let closestY = Math.max(r.y, Math.min(y, r.y + r.h));
        if (Math.hypot(x - closestX, y - closestY) < radius) return true;
      }
      return false;
    }

    function update() {
      if (!gameStarted || showMap) return;

      if (players[myId] && players[myId].isAlive) {
        let me = players[myId];
        let newX = me.x;
        let newY = me.y;
        let vx = 0, vy = 0;

        if (keys['w'] || keys['arrowup']) vy -= speed;
        if (keys['s'] || keys['arrowdown']) vy += speed;
        if (keys['a'] || keys['arrowleft']) vx -= speed;
        if (keys['d'] || keys['arrowright']) vx += speed;

        if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }

        if (vx !== 0 && !checkCollision(newX + vx, newY, playerRadius, walls)) newX += vx;
        if (vy !== 0 && !checkCollision(newX, newY + vy, playerRadius, walls)) newY += vy;

        if (newX !== me.x || newY !== me.y) {
          me.x = newX;
          me.y = newY;
          socket.emit('playerMove', { x: newX, y: newY });
        }
      }
    }

    function drawCharacter(ctx, x, y, color, isAlive, isMe) {
      ctx.save();
      ctx.translate(x, y);

      if (!isAlive) {
        ctx.rotate(Math.PI / 3);
        ctx.globalAlpha = 0.4;
      }

      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 6;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 4, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#1a252f';
      ctx.stroke();

      ctx.fillStyle = '#f5cd79';
      ctx.beginPath();
      ctx.arc(0, -10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isMe && isAlive) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 19, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!gameStarted) return;

      const me = players[myId];

      if (showMap) {
        // --- 全体マップモード ---
        ctx.fillStyle = 'rgba(17, 19, 24, 0.96)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('【 飛行機マップ ＆ 修理状況 】', canvas.width / 2, 45);

        const scaleX = canvas.width / WORLD_WIDTH;
        const scaleY = canvas.height / WORLD_HEIGHT;

        // 機体外枠
        ctx.fillStyle = '#2c3e50';
        ctx.strokeStyle = '#1abc9c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(1500 * scaleX * 0.85 + 75, 100 * scaleY * 0.85 + 70);
        ctx.lineTo(2600 * scaleX * 0.85 + 75, 500 * scaleY * 0.85 + 70);
        ctx.lineTo(2600 * scaleX * 0.85 + 75, 1100 * scaleY * 0.85 + 70);
        ctx.lineTo(1500 * scaleX * 0.85 + 75, 1500 * scaleY * 0.85 + 70);
        ctx.lineTo(400 * scaleX * 0.85 + 75, 1100 * scaleY * 0.85 + 70);
        ctx.lineTo(400 * scaleX * 0.85 + 75, 500 * scaleY * 0.85 + 70);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 壁
        ctx.fillStyle = '#1a252f';
        walls.forEach(w => {
          let wx = 75 + w.x * scaleX * 0.85;
          let wy = 70 + w.y * scaleY * 0.85;
          let ww = w.w * scaleX * 0.85;
          let wh = w.h * scaleY * 0.85;
          ctx.fillRect(wx, wy, ww, wh);
        });

        // タスク
        tasks.forEach((task) => {
          let tx = 75 + task.x * scaleX * 0.85;
          let ty = 70 + task.y * scaleY * 0.85;
          ctx.fillStyle = task.completed ? '#2ecc71' : '#e74c3c';
          ctx.beginPath();
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fill();
        });

        // プレイヤー
        for (const id in players) {
          let p = players[id];
          if (!p.isAlive) continue;
          let px = 75 + p.x * scaleX * 0.85;
          let py = 70 + p.y * scaleY * 0.85;
          ctx.fillStyle = (id === myId) ? '#f1c40f' : p.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#b2bec3';
        ctx.font = '14px sans-serif';
        ctx.fillText('※ スペースキーを離すとゲームに戻ります', canvas.width / 2, canvas.height - 25);
        ctx.textAlign = 'left';
        return;
      }

      // --- 通常ゲームプレイモード ---
      let cameraX = 0, cameraY = 0;
      if (me) {
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, me.x - canvas.width / 2));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, me.y - canvas.height / 2));
      }

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      ctx.fillStyle = '#0f141c';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // 機体ボディ
      ctx.fillStyle = '#22303c';
      ctx.strokeStyle = '#34495e';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(1500, 100);
      ctx.lineTo(2600, 500);
      ctx.lineTo(2600, 1100);
      ctx.lineTo(1500, 1500);
      ctx.lineTo(400, 1100);
      ctx.lineTo(400, 500);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#1b2631';
      ctx.lineWidth = 1;
      for (let x = 400; x < 2600; x += 120) {
        ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 1500); ctx.stroke();
      }

      props.forEach(prop => {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(prop.x, prop.y, prop.w, prop.h);
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 2;
        ctx.strokeRect(prop.x, prop.y, prop.w, prop.h);
      });

      walls.forEach(w => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(w.x + 6, w.y + 6, w.w, w.h);

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(w.x, w.y, w.w, w.h);

        ctx.strokeStyle = '#1abc9c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
      });

      tasks.forEach((task) => {
        ctx.fillStyle = task.completed ? '#1e272e' : '#4a151b';
        ctx.fillRect(task.x - 22, task.y - 22, 44, 44);
        
        ctx.strokeStyle = task.completed ? '#2ecc71' : '#e74c3c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(task.x - 22, task.y - 22, 44, 44);

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(task.completed ? '修理済' : `要修理 #${task.id}`, task.x, task.y - 28);
        ctx.textAlign = 'left';
      });

      for (const id in players) {
        const p = players[id];
        const isMe = (id === myId);
        const drawColor = p.isAlive ? p.color : '#7f8c8d';
        
        drawCharacter(ctx, p.x, p.y, drawColor, p.isAlive, isMe);

        ctx.fillStyle = '#ecf0f1';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isMe ? 'あなた' : 'クルー', p.x, p.y - 28);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
