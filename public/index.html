<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Airplane Werewolf 2D</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: #1a1a1a;
      border: 2px solid #555;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      outline: none;
    }
    #ui {
      margin-top: 10px;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="900" height="600" tabindex="1"></canvas>
  <div id="ui">
    操作: [W, A, S, D] 移動 | [K] アクション(修理/キル) | [Space] 全体マップ確認<br>
    <span id="status" style="color: yellow;">接続中...</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // ワールドサイズ（5倍以上に拡張: 4000 x 3000）
    const WORLD_WIDTH = 4000;
    const WORLD_HEIGHT = 3000;

    let players = {};
    let tasks = [];
    let myId = null;
    let showMap = false;

    const keys = { w: false, a: false, s: false, d: false };
    const speed = 4; // 移動スピード

    // 画面読み込み時にCanvasにフォーカスを当てる
    window.onload = () => {
      canvas.focus();
    };
    canvas.addEventListener('click', () => {
      canvas.focus();
    });

    // キー入力監視
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return; // 押しっぱなしによる誤作動防止
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.w = true;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.a = true;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.s = true;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.d = true;
      
      if (e.key === 'k' || e.key === 'K') {
        socket.emit('action');
      }
      if (e.key === ' ') {
        showMap = true;
        e.preventDefault(); // スペースキーによるスクロールを防ぐ
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.w = false;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.a = false;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.s = false;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.d = false;
      if (e.key === ' ') {
        showMap = false;
      }
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('updatePlayers', (serverPlayers) => {
      players = serverPlayers;
      if (players[myId]) {
        const roleText = players[myId].role === 'wolf' ? '人狼 (インポスター)' : '市民 (クルー)';
        const aliveText = players[myId].isAlive ? '生存' : '死亡';
        statusDiv.innerHTML = `役割: <b>${roleText}</b> | 状態: <span style="color:${players[myId].isAlive ? '#0ff' : '#f55'}">${aliveText}</span>`;
      }
    });

    socket.on('initTasks', (serverTasks) => {
      tasks = serverTasks;
    });

    socket.on('updateTasks', (serverTasks) => {
      tasks = serverTasks;
    });

    socket.on('message', (msg) => {
      console.log(msg.text);
    });

    // メインループ（更新）
    function update() {
      if (players[myId] && players[myId].isAlive) {
        let me = players[myId];
        let newX = me.x;
        let newY = me.y;

        if (keys.w) newY -= speed;
        if (keys.s) newY += speed;
        if (keys.a) newX -= speed;
        if (keys.d) newX += speed;

        // ワールドの端で止める（余白20px）
        newX = Math.max(20, Math.min(WORLD_WIDTH - 20, newX));
        newY = Math.max(20, Math.min(WORLD_HEIGHT - 20, newY));

        if (newX !== me.x || newY !== me.y) {
          socket.emit('playerMove', { x: newX, y: newY });
        }
      }
    }

    // メインループ（描画）
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const me = players[myId];

      if (showMap) {
        // --- 全体マップ表示モード (Spaceキー) ---
        ctx.fillStyle = 'rgba(10, 10, 15, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('【 飛行機全体マップ ＆ パーツ状況 】', canvas.width / 2 - 160, 40);

        // ミニマップ上の縮小スケール
        const scaleX = canvas.width / WORLD_WIDTH;
        const scaleY = canvas.height / WORLD_HEIGHT;

        // マップ枠
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(50, 60, WORLD_WIDTH * scaleX * 0.8, WORLD_HEIGHT * scaleY * 0.8);

        // タスク（パーツ）の描画
        tasks.forEach((task) => {
          let tx = 50 + task.x * scaleX * 0.8;
          let ty = 60 + task.y * scaleY * 0.8;
          ctx.fillStyle = task.completed ? '#0f0' : '#f00';
          ctx.beginPath();
          ctx.arc(tx, ty, 6, 0, Math.PI * 2);
          ctx.fill();
        });

        // プレイヤーの位置
        for (const id in players) {
          let p = players[id];
          if (!p.isAlive) continue;
          let px = 50 + p.x * scaleX * 0.8;
          let py = 60 + p.y * scaleY * 0.8;
          ctx.fillStyle = (id === myId) ? '#ff0' : p.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#aaa';
        ctx.font = '14px sans-serif';
        ctx.fillText('※ スペースキーを離すとゲームに戻ります', canvas.width / 2 - 130, canvas.height - 20);
        return;
      }

      // --- 通常ゲームプレイモード (カメラ追従) ---
      let cameraX = 0;
      let cameraY = 0;
      if (me) {
        cameraX = me.x - canvas.width / 2;
        cameraY = me.y - canvas.height / 2;
        // カメラがワールドの外に出ないように制限
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, cameraY));
      }

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // ワールドの背景グリッドや床を描画
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // グリッド線の描画（広大さを感じさせるため）
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 100) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD_WIDTH, y);
        ctx.stroke();
      }

      // タスク（修理パーツ）の描画
      tasks.range = tasks.forEach((task) => {
        ctx.fillStyle = task.completed ? '#00ffcc' : '#ff4444';
        ctx.fillRect(task.x - 20, task.y - 20, 40, 40);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(`パーツ #${task.id} (${task.completed ? '完了' : '未修理'})`, task.x - 45, task.y - 28);
      });

      // プレイヤーの描画
      for (const id in players) {
        const p = players[id];
        // 死亡したプレイヤーは灰色
        ctx.fillStyle = p.isAlive ? p.color : '#555';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fill();

        // 自分のプレイヤーには白い外枠をつける
        if (id === myId) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        // プレイヤーのロール表示（自分だけ、またはデバッグ用）
        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.fillText(id === myId ? 'あなた' : 'プレイヤー', p.x - 22, p.y - 28);
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
