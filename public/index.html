<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イノコイン釣りワールド</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            border: 1px solid #555;
        }
        #controls {
            margin-top: 15px;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #ffdd33;
        }
    </style>
</head>
<body>
    <h1>🎣 イノコイン釣りワールド</h1>
    <div id="game-container">
        <div id="ui">所持金: <span id="coin-count">0</span> イノコイン</div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <div id="controls">
        <p>移動: <b>WASD</b> または <b>矢印キー</b> | 上側の「湖エリア」に入ってボタンを押そう！</p>
        <button id="fish-btn">🐟 釣りをする</button>
    </div>

    <!-- Socket.ioクライアントライブラリ -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const coinCountEl = document.getElementById('coin-count');
        const fishBtn = document.getElementById('fish-btn');

        let players = {};
        let myId = null;
        const movement = { up: false, down: false, left: false, right: false };

        // キー入力検知
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') movement.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') movement.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') movement.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') movement.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') movement.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') movement.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') movement.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') movement.right = false;
        });

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
        });

        socket.on('newPlayer', ({ id, player }) => {
            players[id] = player;
        });

        socket.on('playerMoved', ({ id, x, y }) => {
            if (players[id]) {
                players[id].x = x;
                players[id].y = y;
            }
        });

        socket.on('disconnectPlayer', (id) => {
            delete players[id];
        });

        socket.on('coinUpdate', (coins) => {
            coinCountEl.textContent = coins;
        });

        // 釣りボタンを押したときの処理
        fishBtn.addEventListener('click', () => {
            if (myId && players[myId]) {
                // 上側の水辺エリア（Y座標が200未満）にいるときだけ釣れる
                if (players[myId].y < 200) {
                    socket.emit('fishCaught');
                } else {
                    alert('⚠️ ここでは釣りができません！上側の「湖エリア」へ移動してください。');
                }
            }
        });

        // 移動の更新
        function update() {
            if (myId && players[myId]) {
                const speed = 4;
                let moved = false;
                if (movement.up && players[myId].y > 15) { players[myId].y -= speed; moved = true; }
                if (movement.down && players[myId].y < canvas.height - 15) { players[myId].y += speed; moved = true; }
                if (movement.left && players[myId].x > 15) { players[myId].x -= speed; moved = true; }
                if (movement.right && players[myId].x < canvas.width - 15) { players[myId].x += speed; moved = true; }

                if (moved) {
                    socket.emit('playerMovement', { x: players[myId].x, y: players[myId].y });
                }
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 湖エリア（上部）
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(0, 0, canvas.width, 180);
            ctx.fillStyle = '#ecf0f1';
            ctx.font = '16px sans-serif';
            ctx.fillText('🌊 湖エリア（ここで釣りができるよ）', 25, 35);

            // 陸エリア（下部）
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 180, canvas.width, canvas.height - 180);
            ctx.fillStyle = '#2ecc71';
            ctx.fillText('🌱 散策エリア', 25, 215);

            // 全プレイヤーの描画
            for (let id in players) {
                const p = players[id];
                // 自分は赤色、他の人は青緑色
                ctx.fillStyle = (id === myId) ? '#e74c3c' : '#3498db';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // プレイヤー名
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 24);
            }
        }

        // メインループ
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
