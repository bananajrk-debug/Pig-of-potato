<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Airplane Werewolf 2D</title>
  <style>
    body {
      margin: 0;
      background: #0d0e12;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #gameContainer {
      position: relative;
      border: 3px solid #333;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }
    canvas {
      background: #151821;
      display: block;
    }
    #titleScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 900px;
      height: 600px;
      background: rgba(13, 14, 18, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h1 {
      font-size: 44px;
      color: #ff3333;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .btn {
      background: #ff3333;
      color: white;
      border: none;
      padding: 15px 45px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background: #ff5555;
      transform: scale(1.05);
    }
    #ui {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <!-- タイトル画面 -->
    <div id="titleScreen">
      <h1>AIRPLANE WOLF</h1>
      <p>― Among Us風 2D人狼アクション ―</p>
      <button class="btn" id="startButton">ゲームスタート</button>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
  </div>

  <div id="ui">
    操作: [W, A, S, D] 移動 | [K] 修理 / 襲撃 | [Space] 全体マップ確認（移動不可）<br>
    <span id="status" style="color: #ff3333;">待機中</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const titleScreen = document.getElementById('titleScreen');
    const startButton = document.getElementById('startButton');

    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 1600;

    let gameStarted = false;
    let players = {};
    let tasks = [];
    let myId = null;
    let showMap = false;

    const keys = {};
    const speed = 4.5;
    const playerRadius = 18;

    // --- Among Us風の部屋と通路を構成する壁データ ---
    // 通路がハッキリと通り抜けられるように隙間を広く設計しています
    const walls = [
      // 外枠
      { x: 0, y: 0, w: WORLD_WIDTH, h: 40 },
      { x: 0, y: WORLD_HEIGHT - 40, w: WORLD_WIDTH, h: 40 },
      { x: 0, y: 0, w: 40, h: WORLD_HEIGHT },
      { x: WORLD_WIDTH - 40, y: 0, w: 40, h: WORLD_HEIGHT },

      // 部屋の仕切り壁（間に広い通路スペースを確保）
      { x: 150, y: 150, w: 500, h: 350 },   // 左上：コックピット
      { x: 1750, y: 150, w: 500, h: 350 },  // 右上：エンジンルーム
      { x: 150, y: 1100, w: 500, h: 350 },  // 左下：電気室
      { x: 1750, y: 1100, w: 500, h: 350 }, // 右下：通信室
      { x: 950, y: 650, w: 500, h: 300 }    // 中央：カフェテリア・ホール
    ];

    startButton.addEventListener('click', () => {
      titleScreen.style.display = 'none';
      gameStarted = true;
    });

    window.addEventListener('keydown', (e) => {
      if (!gameStarted) return;
      keys[e.key.toLowerCase()] = true;

      if (e.key.toLowerCase() === 'k') {
        socket.emit('action');
      }
      if (e.key === ' ') {
        showMap = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') {
        showMap = false;
      }
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('updatePlayers', (serverPlayers) => {
      for (const id in serverPlayers) {
        if (id === myId) {
          if (players[myId]) {
            players[myId].role = serverPlayers[myId].role;
            players[myId].isAlive = serverPlayers[myId].isAlive;
          } else {
            players[myId] = serverPlayers[myId];
          }
        } else {
          players[id] = serverPlayers[id];
        }
      }

      for (const id in players) {
        if (!serverPlayers[id]) delete players[id];
      }

      if (players[myId] && gameStarted) {
        const roleText = players[myId].role === 'wolf' ? '人狼 (インポスター)' : '市民 (クルー)';
        const aliveText = players[myId].isAlive ? '生存' : '死亡';
        statusDiv.innerHTML = `役割: <b style="color:${players[myId].role === 'wolf' ? '#ff4444' : '#44ffaa'}">${roleText}</b> | 状態: <span style="color:${players[myId].isAlive ? '#44ffaa' : '#ff4444'}">${aliveText}</span>`;
      }
    });

    socket.on('initTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('updateTasks', (serverTasks) => { tasks = serverTasks; });
    socket.on('message', (msg) => { console.log(msg.text); });

    // 当たり判定（壁との衝突）
    function checkCollision(x, y, radius, rects) {
      for (let r of rects) {
        let closestX = Math.max(r.x, Math.min(x, r.x + r.w));
        let closestY = Math.max(r.y, Math.min(y, r.y + r.h));
        if (Math.hypot(x - closestX, y - closestY) < radius) return true;
      }
      return false;
    }

    function update() {
      if (!gameStarted || showMap) return;

      if (players[myId] && players[myId].isAlive) {
        let me = players[myId];
        let newX = me.x;
        let newY = me.y;
        let vx = 0, vy = 0;

        if (keys['w'] || keys['arrowup']) vy -= speed;
        if (keys['s'] || keys['arrowdown']) vy += speed;
        if (keys['a'] || keys['arrowleft']) vx -= speed;
        if (keys['d'] || keys['arrowright']) vx += speed;

        if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }

        if (vx !== 0 && !checkCollision(newX + vx, newY, playerRadius, walls)) newX += vx;
        if (vy !== 0 && !checkCollision(newX, newY + vy, playerRadius, walls)) newY += vy;

        if (newX !== me.x || newY !== me.y) {
          me.x = newX;
          me.y = newY;
          socket.emit('playerMove', { x: newX, y: newY });
        }
      }
    }

    // Among Us風の人型キャラクター描画
    function drawCrewmate(ctx, x, y, color, isAlive, isMe) {
      ctx.save();
      ctx.translate(x, y);

      if (!isAlive) {
        ctx.rotate(Math.PI / 4);
        ctx.globalAlpha = 0.4;
      }

      // 胴体
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 4, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#000';
      ctx.stroke();

      // バックパック
      ctx.fillRect(-18, -4, 6, 14);
      ctx.strokeRect(-18, -4, 6, 14);

      // バイザー（ガラス部分）
      ctx.fillStyle = '#88ccff';
      ctx.beginPath();
      ctx.ellipse(6, -4, 9, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 自分を示すマーカー
      if (isMe && isAlive) {
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!gameStarted) return;

      const me = players[myId];

      if (showMap) {
        // --- 全体マップモード (Spaceキー) ---
        ctx.fillStyle = 'rgba(13, 14, 18, 0.96)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('【 全体マップ ＆ 修理状況 】', canvas.width / 2, 45);

        const scaleX = canvas.width / WORLD_WIDTH;
        const scaleY = canvas.height / WORLD_HEIGHT;

        // 壁の描画
        ctx.fillStyle = '#222634';
        ctx.strokeStyle = '#444c64';
        ctx.lineWidth = 1.5;
        walls.forEach(w => {
          let wx = 60 + w.x * scaleX * 0.85;
          let wy = 70 + w.y * scaleY * 0.85;
          let ww = w.w * scaleX * 0.85;
          let wh = w.h * scaleY * 0.85;
          ctx.fillRect(wx, wy, ww, wh);
          ctx.strokeRect(wx, wy, ww, wh);
        });

        // タスク
        tasks.forEach((task) => {
          let tx = 60 + task.x * scaleX * 0.85;
          let ty = 70 + task.y * scaleY * 0.85;
          ctx.fillStyle = task.completed ? '#44ffaa' : '#ff3333';
          ctx.beginPath();
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fill();
        });

        // プレイヤー
        for (const id in players) {
          let p = players[id];
          if (!p.isAlive) continue;
          let px = 60 + p.x * scaleX * 0.85;
          let py = 70 + p.y * scaleY * 0.85;
          ctx.fillStyle = (id === myId) ? '#ffff00' : p.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#aaa';
        ctx.font = '14px sans-serif';
        ctx.fillText('※ スペースキーを離すとゲームに戻ります', canvas.width / 2, canvas.height - 25);
        ctx.textAlign = 'left';
        return;
      }

      // --- 通常ゲームプレイモード ---
      let cameraX = 0, cameraY = 0;
      if (me) {
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, me.x - canvas.width / 2));
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, me.y - canvas.height / 2));
      }

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // 床面
      ctx.fillStyle = '#151821';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // 床のグリッド
      ctx.strokeStyle = '#1e222e';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 150) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 150) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
      }

      // 壁の描画
      walls.forEach(w => {
        // 壁の影
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(w.x + 6, w.y + 6, w.w, w.h);

        // 壁本体
        ctx.fillStyle = '#222634';
        ctx.fillRect(w.x, w.y, w.w, w.h);

        // 壁の枠線
        ctx.strokeStyle = '#444c64';
        ctx.lineWidth = 3;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
      });

      // タスク（修理ポイント）の描画
      tasks.forEach((task) => {
        ctx.fillStyle = task.completed ? '#19222c' : '#3d1c24';
        ctx.fillRect(task.x - 22, task.y - 22, 44, 44);
        
        ctx.strokeStyle = task.completed ? '#44ffaa' : '#ff3333';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(task.x - 22, task.y - 22, 44, 44);

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(task.completed ? '修理済' : `パーツ #${task.id}`, task.x, task.y - 28);
        ctx.textAlign = 'left';
      });

      // プレイヤーの描画
      for (const id in players) {
        const p = players[id];
        const isMe = (id === myId);
        const drawColor = p.isAlive ? p.color : '#555';
        
        drawCrewmate(ctx, p.x, p.y, drawColor, p.isAlive, isMe);

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isMe ? 'あなた' : 'クルー', p.x, p.y - 32);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
