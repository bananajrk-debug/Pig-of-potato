<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2D人狼ゲーム (Among Us風)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; margin-bottom: 5px; pointer-events: auto; }
        #meeting-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; background: rgba(20,20,30,0.95); border: 2px solid #555; border-radius: 12px; padding: 20px; z-index: 100; text-align: center; }
        button { background: #333; color: white; border: 1px solid #777; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 4px; }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-box" id="role-display">ロール: 読み込み中...</div>
        <div class="hud-box" id="task-display">タスク: 0 / 0</div>
        <div class="hud-box">操作: [WASD] 移動 | [K] キル / タスク | [R] 死体通報 | [Space] ミニマップ</div>
    </div>

    <div id="meeting-modal">
        <h2 id="meeting-title">緊急会議</h2>
        <p id="meeting-timer">残り時間: 45秒</p>
        <div id="player-list-voting"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let myId = null;
        let players = {};
        let bodies = [];
        let emergencyButton = null;
        let tasks = [];
        let gameState = 'PLAYING';
        let keys = {};
        let showMinimap = false;

        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
            bodies = data.bodies;
            emergencyButton = data.emergencyButton;
            tasks = data.tasks;

            let myRole = players[myId].role;
            document.getElementById('role-display').innerText = `ロール: ${myRole === 'wolf' ? '人狼 (Wolf)' : '市民 (Crew)'}`;
            updateTaskHud();
        });

        socket.on('game-state', (data) => {
            players = data.players;
            bodies = data.bodies;
        });

        socket.on('start-meeting', (data) => {
            gameState = 'MEETING';
            players = data.players;
            document.getElementById('meeting-title').innerText = data.reason;
            document.getElementById('meeting-modal').style.display = 'block';
            updateVotingUI();
        });

        socket.on('meeting-timer', (sec) => {
            document.getElementById('meeting-timer').innerText = `残り時間: ${sec}秒`;
        });

        socket.on('end-meeting', (updatedPlayers) => {
            gameState = 'PLAYING';
            players = updatedPlayers;
            document.getElementById('meeting-modal').style.display = 'none';
        });

        socket.on('notification', (msg) => {
            console.log(msg);
        });

        socket.on('game-over', (msg) => {
            alert(msg);
            location.reload();
        });

        // 入力ハンドリング
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') showMinimap = true;

            if (e.key.toLowerCase() === 'k') {
                // キル または タスク実行
                let me = players[myId];
                if (!me || !me.isAlive) return;

                if (me.role === 'wolf') {
                    // 最寄りのプレイヤーを探してキル
                    let target = Object.values(players).find(p => p.id !== myId && p.isAlive && Math.hypot(p.x - me.x, p.y - me.y) < 100);
                    if (target) socket.emit('player-kill', target.id);
                }

                // タスクチェック
                let task = tasks.find(t => Math.hypot(t.x - me.x, t.y - me.y) < 80);
                let myTask = me.tasks.find(t => t.id === task?.id);
                if (myTask && !myTask.completed) {
                    socket.emit('complete-task', myTask.id);
                    myTask.completed = true;
                    updateTaskHud();
                }
            }

            if (e.key.toLowerCase() === 'r') {
                // 死体通報
                let me = players[myId];
                if (!me || !me.isAlive) return;
                let body = bodies.find(b => Math.hypot(b.x - me.x, b.y - me.y) < 100);
                if (body) socket.emit('report-body', body.id);

                // 非常ボタンチェック
                if (emergencyButton && Math.hypot(emergencyButton.x - me.x, emergencyButton.y - me.y) < emergencyButton.radius + 30) {
                    socket.emit('emergency-meeting');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.code === 'Space') showMinimap = false;
        });

        function updateTaskHud() {
            let me = players[myId];
            if (!me) return;
            let completedCount = me.tasks.filter(t => t.completed).length;
            document.getElementById('task-display').innerText = `タスク: ${completedCount} / ${me.tasks.length}`;
        }

        function updateVotingUI() {
            let container = document.getElementById('player-list-voting');
            container.innerHTML = '<h3>投票先を選んでください</h3>';
            Object.values(players).forEach(p => {
                if (p.isAlive) {
                    let btn = document.createElement('button');
                    btn.innerText = `${p.id.substr(4,4)} (${p.role === 'wolf' && players[myId].role === 'wolf' ? '人狼' : 'プレイヤー'})`;
                    btn.onclick = () => {
                        socket.emit('cast-vote', p.id);
                        container.innerHTML = '<p>投票完了しました。結果を待っています...</p>';
                    };
                    container.appendChild(btn);
                }
            });
            let skipBtn = document.createElement('button');
            skipBtn.innerText = 'スキップ';
            skipBtn.onclick = () => {
                socket.emit('cast-vote', null);
                container.innerHTML = '<p>スキップに投票しました。</p>';
            };
            container.appendChild(skipBtn);
        }

        // メインループ・描画
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let me = players[myId];
            if (me) {
                // 移動送信
                let vx = 0, vy = 0;
                if (keys['w']) vy -= 1;
                if (keys['s']) vy += 1;
                if (keys['a']) vx -= 1;
                if (keys['d']) vx += 1;
                if (vx !== 0 || vy !== 0) {
                    let len = Math.hypot(vx, vy);
                    socket.emit('player-move', { vx: vx / len, vy: vy / len });
                }

                // カメラ追従 & ズーム (1.4倍)
                ctx.save();
                const zoom = 1.4;
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(zoom, zoom);
                ctx.translate(-me.x, -me.y);

                // マップ背景・壁の描画
                ctx.fillStyle = '#1e1e24';
                ctx.fillRect(0, 0, 4000, 3000);

                // 簡易壁の描画
                ctx.fillStyle = '#3a3a48';
                // (サーバー側の walls 配列と同じ内容を描画)
                const wallList = [
                    { x: 0, y: 0, w: 4000, h: 40 },
                    { x: 0, y: 2960, w: 4000, h: 40 },
                    { x: 0, y: 0, w: 40, h: 3000 },
                    { x: 3960, y: 0, w: 40, h: 3000 },
                    { x: 1600, y: 1100, w: 800, h: 40 },
                    { x: 1600, y: 1860, w: 800, h: 40 },
                    { x: 1600, y: 1100, w: 40, h: 380 },
                    { x: 2360, y: 1100, w: 40, h: 380 },
                    { x: 1600, y: 1520, w: 40, h: 380 },
                    { x: 2360, y: 1520, w: 40, h: 380 },
                ];
                wallList.forEach(w => {
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                });

                // 非常ボタン描画
                if (emergencyButton) {
                    ctx.beginPath();
                    ctx.arc(emergencyButton.x, emergencyButton.y, emergencyButton.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff2222';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                // タスク描画
                tasks.forEach(t => {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffff00';
                    ctx.fill();
                });

                // 死体描画
                bodies.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px sans-serif';
                    ctx.fillText('DEAD', b.x - 18, b.y - 20);
                });

                // プレイヤー描画
                Object.values(players).forEach(p => {
                    if (!p.isAlive) return;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.font = '12px sans-serif';
                    ctx.fillText(p.id.substr(4, 4), p.x - 15, p.y - 28);
                });

                ctx.restore();

                // スペースキー押下によるミニマップ表示
                if (showMinimap) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(canvas.width / 2 - 300, canvas.height / 2 - 225, 600, 450);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(canvas.width / 2 - 300, canvas.height / 2 - 225, 600, 450);

                    ctx.save();
                    ctx.translate(canvas.width / 2 - 300, canvas.height / 2 - 225);
                    let scaleX = 600 / 4000;
                    let scaleY = 450 / 3000;
                    ctx.scale(scaleX, scaleY);

                    // ミニマップ上のプレイヤー描画
                    Object.values(players).forEach(p => {
                        if (!p.isAlive) return;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 40, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
