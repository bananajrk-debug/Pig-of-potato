<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2D 射線切り戦車バトル</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      margin-bottom: 10px;
      font-size: 16px;
      background: #2b2b2b;
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #444;
    }
    canvas {
      background: #222;
      border: 3px solid #555;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div id="ui">
    HP: <span id="hp" style="color: #ff5555; font-weight: bold;">100</span> | 
    スコア: <span id="score" style="color: #55ff55; font-weight: bold;">0</span> 
    <span style="margin-left: 20px; color: #aaa;">[操作] WASD: 移動 | マウス: 砲身照準 | クリック: 弾の発射</span>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 40;
    const TANK_SIZE = 30;

    let keys = { up: false, down: false, left: false, right: false };
    let mouseX = 0, mouseY = 0;

    // キー入力監視
    window.addEventListener('keydown', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.up = true;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.down = true;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.left = true;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.up = false;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.down = false;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.left = false;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.right = false;
    });

    // マウス位置追跡
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });

    // クリックで弾発射
    canvas.addEventListener('click', () => {
      socket.emit('shoot');
    });

    let currentState = { players: {}, bullets: [], obstacles: [] };

    // サーバーからの状態を受信して定期送信＆描画
    socket.on('state', (state) => {
      currentState = state;

      if (state.players[socket.id]) {
        const p = state.players[socket.id];
        document.getElementById('hp').innerText = p.hp;
        document.getElementById('score').innerText = p.score;

        // 自機の中心からマウス位置への角度を計算
        const cx = p.x + TANK_SIZE / 2;
        const cy = p.y + TANK_SIZE / 2;
        const angle = Math.atan2(mouseY - cy, mouseX - cx);

        // サーバーに入力を送信
        socket.emit('input', { ...keys, turretAngle: angle });
      }

      draw();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 格子マップのグリッド線描画
      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 障害物（ブロック）の描画（これを盾にして射線を切る）
      ctx.fillStyle = '#555';
      ctx.strokeStyle = '#777';
      currentState.obstacles.forEach(obs => {
        const ox = obs.x * TILE_SIZE;
        const oy = obs.y * TILE_SIZE;
        ctx.fillRect(ox, oy, TILE_SIZE, TILE_SIZE);
        ctx.strokeRect(ox, oy, TILE_SIZE, TILE_SIZE);
      });

      // 弾の描画
      ctx.fillStyle = '#ffcc00';
      currentState.bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // プレイヤー（戦車）の描画
      for (let id in currentState.players) {
        const p = currentState.players[id];
        const isSelf = id === socket.id;

        ctx.save();
        ctx.translate(p.x + TANK_SIZE / 2, p.y + TANK_SIZE / 2);

        // 戦車ボディ
        ctx.fillStyle = isSelf ? '#3b82f6' : '#ef4444'; // 自機は青、敵は赤
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);

        // 砲身（マウス方向に向く）
        ctx.rotate(p.turretAngle);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(0, -4, 22, 8);

        ctx.restore();
      }
    }
  </script>
</body>
</html>
