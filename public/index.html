<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2D 射線切り戦車バトル</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #ui {
      margin-bottom: 8px;
      font-size: 14px;
      background: #2b2b2b;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    progress {
      accent-color: #22c55e;
      height: 14px;
      width: 120px;
      border-radius: 3px;
    }
    canvas {
      background: #222;
      border: 3px solid #555;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      width: 600px;
      height: 600px;
      max-width: 90vw;
      max-height: 75vh;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>HP: <progress id="hpBar" value="100" max="100"></progress> <span id="hp" style="color: #ff5555; font-weight: bold;">100</span></div>
    <div>スコア: <span id="score" style="color: #55ff55; font-weight: bold;">0</span></div>
    <div style="color: #aaa; font-size: 13px;">[W/S]前後進 [A/D]旋回 [K]うんこ発射(クールタイム1秒)</div>
  </div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 40;
    const TANK_SIZE = 28;
    const MAP_WIDTH = 600;
    const MAP_HEIGHT = 600;

    let keys = {
      forward: false,
      backward: false,
      turnLeft: false,
      turnRight: false
    };

    window.addEventListener('keydown', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.forward = true;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.backward = true;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.turnLeft = true;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.turnRight = true;

      if (['k', 'K'].includes(e.key)) {
        if (!e.repeat) {
          socket.emit('shoot');
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 'ArrowUp'].includes(e.key)) keys.forward = false;
      if (['s', 'S', 'ArrowDown'].includes(e.key)) keys.backward = false;
      if (['a', 'A', 'ArrowLeft'].includes(e.key)) keys.turnLeft = false;
      if (['d', 'D', 'ArrowRight'].includes(e.key)) keys.turnRight = false;
    });

    let currentState = { players: {}, cpus: {}, bullets: [], obstacles: [] };

    socket.on('state', (state) => {
      currentState = state;

      if (state.players[socket.id]) {
        const p = state.players[socket.id];
        document.getElementById('hp').innerText = p.hp;
        document.getElementById('hpBar').value = p.hp;
        document.getElementById('score').innerText = p.score;

        socket.emit('input', keys);
      }

      draw();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // グリッド線
      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1;
      for (let x = 0; x <= MAP_WIDTH; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y <= MAP_HEIGHT; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
      }

      // 障害物（ブロック）
      ctx.fillStyle = '#555';
      ctx.strokeStyle = '#777';
      currentState.obstacles.forEach(obs => {
        const ox = obs.x * TILE_SIZE;
        const oy = obs.y * TILE_SIZE;
        ctx.fillRect(ox, oy, TILE_SIZE, TILE_SIZE);
        ctx.strokeRect(ox, oy, TILE_SIZE, TILE_SIZE);
      });

      // 弾の代わりに「うんこ（💩）」を描画
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      currentState.bullets.forEach(b => {
        ctx.fillText('💩', b.x, b.y);
      });

      // 戦車を描画する関数
      function drawTank(tank, color) {
        ctx.save();
        ctx.translate(tank.x + TANK_SIZE / 2, tank.y + TANK_SIZE / 2);
        ctx.rotate(tank.bodyAngle);

        ctx.fillStyle = color;
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
        
        // キャタピラ
        ctx.fillStyle = '#111';
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, 4);
        ctx.fillRect(-TANK_SIZE / 2, TANK_SIZE / 2 - 4, TANK_SIZE, 4);

        // 砲身
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(0, -3, 20, 6);

        // 正面の目印（矢印）
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(TANK_SIZE / 2, -5);
        ctx.lineTo(TANK_SIZE / 2 + 7, 0);
        ctx.lineTo(TANK_SIZE / 2, 5);
        ctx.fill();

        ctx.restore();
      }

      // CPU（緑色の敵戦車）
      for (let id in currentState.cpus) {
        drawTank(currentState.cpus[id], '#10b981');
      }

      // プレイヤー戦車（自機：青、他プレイヤー：赤）
      for (let id in currentState.players) {
        const p = currentState.players[id];
        drawTank(p, id === socket.id ? '#3b82f6' : '#ef4444');
      }
    }
  </script>
</body>
</html>
