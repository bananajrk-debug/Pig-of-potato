<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Airplane Werewolf</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: sans-serif;
            color: white;
            user-select: none;
        }
        #titleScreen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #titleScreen h1 { font-size: 48px; margin-bottom: 20px; color: #e94560; }
        #titleScreen button {
            padding: 15px 30px;
            font-size: 20px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #titleScreen button:hover { background: #e94560; }
        
        /* 会議用モーダル画面 */
        #meetingScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .meeting-container {
            background: #1f1f2e;
            padding: 25px;
            border-radius: 12px;
            width: 850px;
            height: 520px;
            display: flex;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- タイトル画面 -->
    <div id="titleScreen">
        <h1>Airplane Werewolf</h1>
        <p>飛行機からの脱出と、紛れ込んだ人狼の戦い</p>
        <button onclick="startGame()">ゲームスタート</button>
    </div>

    <!-- ゲーム画面 Canvas -->
    <canvas id="gameCanvas" style="display:none;"></canvas>

    <!-- 会議・チャット・投票モーダル -->
    <div id="meetingScreen">
        <div class="meeting-container">
            <!-- 左側：投票リスト -->
            <div style="flex: 1; border-right: 1px solid #444; padding-right: 15px; display: flex; flex-direction: column;">
                <h2>会議フェーズ</h2>
                <p id="meetingReason" style="font-size: 14px; color: #f1c40f;"></p>
                <div id="playerVoteList" style="flex: 1; overflow-y: auto; margin-top: 10px;"></div>
                <button onclick="skipVote()" style="margin-top: 10px; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer;">スキップする</button>
            </div>
            <!-- 右側：チャット -->
            <div style="flex: 1; display: flex; flex-direction: column;">
                <h2>チャット議論</h2>
                <div id="chatLog" style="flex: 1; background: #111; border: 1px solid #444; border-radius: 6px; padding: 10px; overflow-y: auto; margin-bottom: 10px; font-size: 14px;"></div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="chatInput" placeholder="メッセージを入力..." style="flex: 1; padding: 10px; border-radius: 6px; border: none; background: #2a2a3e; color: white;" onkeydown="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer;">送信</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let myId = null;
        let players = {};
        let walls = [];
        let bodies = [];
        let emergencyButton = { x: 1000, y: 1000 };
        let isMeetingActive = false;

        const keys = { w: false, a: false, s: false, d: false, space: false };
        let playerPos = { x: 300, y: 300 };
        const speed = 4;

        function startGame() {
            document.getElementById('titleScreen').style.display = 'none';
            canvas.style.display = 'block';
            requestAnimationFrame(gameLoop);
        }

        // Socket 受信イベント
        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
            walls = data.walls;
            emergencyButton = data.emergencyButton;
            if (players[myId]) {
                playerPos.x = players[myId].x;
                playerPos.y = players[myId].y;
            }
        });

        socket.on('gameStateUpdate', (data) => {
            players = data.players;
            bodies = data.bodies;
        });

        socket.on('updateGameState', (data) => {
            players = data.players;
            bodies = data.bodies;
        });

        // キー入力リスナー
        window.addEventListener('keydown', (e) => {
            if (isMeetingActive) return;
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.key === ' ') keys.space = true;

            // Rキー: 死体通報
            if (e.key.toLowerCase() === 'r') {
                socket.emit('reportBody');
            }

            // Kキー: キル (人狼用) または 非常招集ボタン / タスク
            if (e.key.toLowerCase() === 'k') {
                const me = players[myId];
                if (!me || me.isDead) return;

                // 非常招集ボタンの判定
                if (Math.hypot(emergencyButton.x - playerPos.x, emergencyButton.y - playerPos.y) < 80) {
                    socket.emit('emergencyMeeting');
                    return;
                }

                // 人狼のキル判定
                if (me.role === 'wolf') {
                    for (let id in players) {
                        if (id !== myId && !players[id].isDead) {
                            const dist = Math.hypot(players[id].x - playerPos.x, players[id].y - playerPos.y);
                            if (dist < 80) {
                                socket.emit('killPlayer', id);
                                break;
                            }
                        }
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === ' ') keys.space = false;
        });

        // 会議システム用イベント
        socket.on('startMeeting', (data) => {
            isMeetingActive = true;
            document.getElementById('meetingScreen').style.display = 'flex';
            const reasonText = data.reason === 'body' 
                ? `${data.reporterName} が死体を発見・通報しました！` 
                : `${data.reporterName} が非常招集ボタンを押しました！`;
            document.getElementById('meetingReason').innerText = reasonText;
            document.getElementById('chatLog').innerHTML = '';

            // 投票リスト構築
            const voteListDiv = document.getElementById('playerVoteList');
            voteListDiv.innerHTML = '';
            for (let id in players) {
                const p = players[id];
                if (!p.isDead) {
                    const btn = document.createElement('button');
                    btn.innerText = `${p.name} に投票`;
                    btn.style.cssText = "display: block; width: 100%; margin-bottom: 8px; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;";
                    btn.onclick = () => votePlayer(id);
                    voteListDiv.appendChild(btn);
                }
            }
        });

        socket.on('chatMessage', (data) => {
            const chatLog = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.style.marginBottom = '6px';
            div.innerHTML = `<strong>${data.name}</strong>: ${data.text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        });

        socket.on('endMeeting', (data) => {
            isMeetingActive = false;
            document.getElementById('meetingScreen').style.display = 'none';
            players = data.players;
            if (data.exiledName) {
                alert(`${data.exiledName} は宇宙へ放り出されました（追放）`);
            } else {
                alert('誰も追放されませんでした。');
            }
        });

        socket.on('gameOver', (data) => {
            alert(data.message);
            location.reload();
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim() === '') return;
            socket.emit('chatMessage', input.value);
            input.value = '';
        }

        function votePlayer(targetId) {
            socket.emit('vote', targetId);
            alert('投票しました');
        }

        function skipVote() {
            socket.emit('vote', 'skip');
            alert('スキップに投票しました');
        }

        // 当たり判定チェック関数
        function checkCollision(nx, ny) {
            const radius = 20;
            for (let w of walls) {
                if (nx + radius > w.x && nx - radius < w.x + w.width &&
                    ny + radius > w.y && ny - radius < w.y + w.height) {
                    return true;
                }
            }
            return false;
        }

        // メインゲームループ
        function gameLoop() {
            if (!isMeetingActive && players[myId]) {
                const me = players[myId];
                if (!me.isDead) {
                    let dx = 0, dy = 0;
                    if (keys.w) dy -= 1;
                    if (keys.s) dy += 1;
                    if (keys.a) dx -= 1;
                    if (keys.d) dx += 1;

                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.7071;
                        dy *= 0.7071;
                    }

                    const nextX = playerPos.x + dx * speed;
                    const nextY = playerPos.y + dy * speed;

                    if (!checkCollision(nextX, playerPos.y)) playerPos.x = nextX;
                    if (!checkCollision(playerPos.x, nextY)) playerPos.y = nextY;

                    socket.emit('playerMove', { x: playerPos.x, y: playerPos.y });
                }
            }

            // 描画処理
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const me = players[myId];
            const cameraX = me ? me.x - canvas.width / 2 : 0;
            const cameraY = me ? me.y - canvas.height / 2 : 0;

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // マップ（床・壁）の描画
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 2000, 2000);

            ctx.fillStyle = '#444';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.width, w.height);
            });

            // 非常招集ボタンの描画
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(emergencyButton.x, emergencyButton.y, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('緊急ボタン (K)', emergencyButton.x, emergencyButton.y - 40);

            // 死体の描画
            bodies.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = 'white';
                ctx.fillText(`死体: ${b.name} (Rで通報)`, b.x, b.y - 25);
            });

            // プレイヤーの描画
            for (let id in players) {
                const p = players[id];
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.isDead ? 0.4 : 1.0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // バイザー（目元）の描画
                ctx.fillStyle = '#a0e0ff';
                ctx.fillRect(p.x - 5, p.y - 8, 14, 8);

                // 名前表示
                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name + (p.role === 'wolf' && id === myId ? ' (人狼)' : ''), p.x, p.y - 28);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            // スペースキー長押しによる全体マップ表示
            if (keys.space) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(100, 100, canvas.width - 200, canvas.height - 200);
                ctx.fillStyle = 'white';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('--- 全体マップ ---', canvas.width / 2, 150);
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
