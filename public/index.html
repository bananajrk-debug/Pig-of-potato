<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イノコイン釣りワールド</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            border: 1px solid #555;
        }
        #controls {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>🎣 イノコイン釣りワールド</h1>
    <div id="game-container">
        <div id="ui">所持金: <span id="coin-count">0</span> イノコイン</div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <div id="controls">
        <p>移動: <b>WASD / 矢印キー</b> | 釣り: 上側の「湖エリア」で <b>スペースキー</b> を押す！</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const coinCountEl = document.getElementById('coin-count');

        let players = {};
        let myId = null;
        const movement = { up: false, down: false, left: false, right: false };

        // 釣り・演出用の状態変数
        let isFishing = false;
        let fishingTimer = 0;
        let notification = { text: '', alpha: 0, color: '#fff' };

        // キー入力検知
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') movement.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') movement.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') movement.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') movement.right = true;

            // スペースキーで釣り
            if (e.code === 'Space') {
                e.preventDefault(); // 画面スクロール防止
                tryToFish();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') movement.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') movement.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') movement.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') movement.right = false;
        });

        function tryToFish() {
            if (!myId || !players[myId]) return;

            if (players[myId].y < 180) {
                if (isFishing) return; // 既に釣り中なら連打防止

                isFishing = true;
                fishingTimer = 40; // 釣りにかかるフレーム数（約0.7秒）
                showNotification('🎣 釣り糸を垂らした...', '#f1c40f');
            } else {
                showNotification('⚠️ ここでは釣れません！湖に入ってね', '#e74c3c');
            }
        }

        function showNotification(text, color) {
            notification.text = text;
            notification.alpha = 1.0;
            notification.color = color;
        }

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
        });

        socket.on('newPlayer', ({ id, player }) => {
            players[id] = player;
        });

        socket.on('playerMoved', ({ id, x, y }) => {
            if (players[id]) {
                players[id].x = x;
                players[id].y = y;
            }
        });

        socket.on('disconnectPlayer', (id) => {
            delete players[id];
        });

        // 釣り成功時の結果受け取り
        socket.on('fishResult', ({ coins, earned }) => {
            coinCountEl.textContent = coins;
            showNotification(`🎉 釣れた！ +${earned} イノコイン！`, '#2ecc71');
        });

        function update() {
            // 釣り中のカウントダウン
            if (isFishing) {
                fishingTimer--;
                if (fishingTimer <= 0) {
                    isFishing = false;
                    socket.emit('fishCaught'); // サーバーに釣果を判定してもらう
                }
            }

            // 通知のフェードアウト処理
            if (notification.alpha > 0) {
                notification.alpha -= 0.015;
            }

            if (myId && players[myId] && !isFishing) {
                const speed = 4;
                let moved = false;
                if (movement.up && players[myId].y > 15) { players[myId].y -= speed; moved = true; }
                if (movement.down && players[myId].y < canvas.height - 15) { players[myId].y += speed; moved = true; }
                if (movement.left && players[myId].x > 15) { players[myId].x -= speed; moved = true; }
                if (movement.right && players[myId].x < canvas.width - 15) { players[myId].x += speed; moved = true; }

                if (moved) {
                    socket.emit('playerMovement', { x: players[myId].x, y: players[myId].y });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 湖エリア（上部）
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(0, 0, canvas.width, 180);
            ctx.fillStyle = '#ecf0f1';
            ctx.font = '16px sans-serif';
            ctx.fillText('🌊 湖エリア（スペースキーで釣り！）', 25, 35);

            // 陸エリア（下部）
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 180, canvas.width, canvas.height - 180);
            ctx.fillStyle = '#2ecc71';
            ctx.fillText('🌱 散策エリア', 25, 215);

            // 全プレイヤーの描画
            for (let id in players) {
                const p = players[id];
                const isMe = (id === myId);

                // 自分が釣り中のときの演出（ウキや竿の表現）
                if (isMe && isFishing) {
                    // 水面にウキを表示
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(p.x + 15, p.y - 40, 6, 0, Math.PI * 2);
                    ctx.fill();
                    // 釣り糸
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + 15, p.y - 40);
                    ctx.stroke();
                }

                // プレイヤー本体
                ctx.fillStyle = isMe ? '#e74c3c' : '#3498db';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // 釣り中サイン
                if (isMe && isFishing) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🎣 釣り中...', p.x, p.y - 28);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name, p.x, p.y - 24);
                }
            }

            // 画面中央上にポップアップ通知を表示
            if (notification.alpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, notification.alpha);
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = notification.color;
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 6;
                ctx.fillText(notification.text, canvas.width / 2, 100);
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
